const BOOK_MD="# Wokanda — Księga aplikacji\n\nWersja księgi: 2.3 (26 listopada 2026). Księga opisuje wszystkie funkcje, mechanizmy, powiązania i zasady działania Wokandy. Jest aktualizowana z każdą wersją, równolegle z dziennikiem zmian (kliknięcie numeru wersji w lewym dolnym rogu).\n\n## Czym jest Wokanda\n\nWokanda to menedżer zadań, projektów, klientów, terminów i zespołu dla kancelarii prawno-księgowej, połączony ze sprawami osobistymi w jednej aplikacji. Działa w przeglądarce i na telefonie (w aplikacji Claude lub jako zainstalowana aplikacja PWA). Jedna osoba (właściciel konta) jest użytkownikiem; pracownicy są kartoteką do przydzielania zadań, nie mają własnych kont.\n\nWersjonowanie: pierwsze wydanie 1.0, każda aktualizacja podnosi numer o 0,1. Numer wersji otwiera dziennik zmian ze stronicowaniem.\n\n## Słownik pojęć\n\n- **Zadanie** — podstawowa jednostka pracy. Ma sygnaturę `WK-n` nadawaną kolejno i nigdy nieużywaną ponownie.\n- **Podzadanie** — zadanie z rodzicem (`parentId`), bez limitu zagnieżdżeń; na liście pokazywane do dwóch poziomów wcięcia.\n- **Obszar** — Służbowe albo Osobiste. Zadanie w projekcie przyjmuje obszar projektu; zadanie z klientem jest zawsze służbowe.\n- **Kategoria** — podział wewnątrz obszaru (np. Prawo pracy, Kadry i płace, Sport, Dom i mieszkanie). Edytowalna w Ustawieniach.\n- **Projekt** — zbiór zadań ze startem, terminem, opiekunem, zespołem, notatkami, komentarzami i postępem. Może być przypisany do klienta.\n- **Klient** — kartoteka klienta kancelarii: forma prawna, NIP, rozliczenie VAT, usługi, opiekun, kontakt, notatki.\n- **Obowiązek cykliczny** — zadanie cykliczne z terminem ustawowym, tworzone dla klienta (np. JPK_V7M do 25. dnia).\n- **Status** — etap pracy. Każdy status ma typ, który steruje logiką: szkic, do zrobienia, w toku, oczekuje, weryfikacja, wstrzymane, zakończone, anulowane. Nazwy i kolory są edytowalne; statusy typu „zakończone” i „anulowane” zamykają zadanie. Ostatniego statusu typu „zakończone” ani „do zrobienia” nie można usunąć ani zmienić jego typu (od 2.3); usunięcie nieużywanego statusu wymaga potwierdzenia, a przy przenoszeniu zadań z usuwanego statusu przenoszone są też zadania w koszu.\n- **Priorytet** — P1 krytyczny, P2 wysoki, P3 średni, P4 niski lub brak.\n- **Termin ustawowy** — znacznik terminu nieprzekraczalnego (procesowego, podatkowego). Takie zadania mają osobną sekcję na Przeglądzie.\n- **Kamień milowy** — wyróżnione zadanie projektu, widoczne na osi czasu i w sekcji kamieni milowych.\n- **Tag** — dowolna etykieta `#nazwa`, tworzona także w locie.\n- **Dział** — jednostka organizacyjna; pracownik może należeć do kilku działów.\n- **Zależność** — zadanie może być „blokowane przez” inne zadania; dopóki blokady nie są zakończone, zamknięcie zadania wymaga potwierdzenia.\n- **Przypięte** — zadania oznaczone gwiazdką, zebrane w osobnej sekcji na Przeglądzie.\n\n## Widoki i nawigacja\n\n- **Portfel projektów** (od 1.6) — pulpit wszystkich projektów i podprojektów; opis w rozdziale „Portfel projektów”.\n- **Przegląd** — nagłówek dnia z kluczowymi liczbami (na dziś, zaległe, w toku, oczekuje, zakończone w tygodniu), pasek 14 dni (obciążenie, terminy ustawowe, dni wolne), przypięte, pilne terminy (2 dni), terminy ustawowe (30 dni), projekty w toku (według rankingu, z następnym krokiem lub informacją, na kogo czekamy), klienci z terminami w tygodniu, kamienie milowe, obciążenie zespołu, ostatnie zmiany.\n- **Skrzynka** — zadania bez projektu, kategorii i klienta.\n- **Dziś** — otwarte zadania z terminem dzisiejszym lub zaległe, zadania ze startem dziś oraz zadania zakończone dziś. Licznik w menu liczy dokładnie te same otwarte zadania.\n- **Zaległe** — jedna definicja w całej aplikacji: termin minął albo jest dziś z minioną godziną, a zadanie jest otwarte. Stosują ją licznik na Przeglądzie, znacznik w menu, filtr „Zaległe”, grupy „Zaległe” i statystyki klientów oraz projektów. Zamknięte zadania z dawnym terminem trafiają do grupy „Zakończone — wcześniejsze terminy”.\n- **Nadchodzące** — 14 dni do przodu, grupowane po dniach.\n- **Kalendarz** — miesiąc lub tydzień; przeciąganie zmienia termin; polskie święta są oznaczone; agenda wybranego dnia pod siatką.\n- **Co pokazuje kalendarz (od 2.2).** Pozycja „Kalendarz” w menu pokazuje zawsze wszystkie zadania z terminem.\n- Układ „Kalendarz” w Skrzynce, Dziś i Nadchodzących domyślnie pokazuje wszystkie zadania z terminem, bo zakres tych widoków jest węższy od kalendarza (Skrzynka to zadania bez projektu, kategorii i klienta; Dziś to dzień bieżący i zaległe; Nadchodzące to 14 dni).\n- Układ „Kalendarz” w projekcie, kliencie, osobie, dziale, kategorii, tagu i zapisanym widoku domyślnie pokazuje tylko zadania tego widoku.\n- Nad siatką kalendarza stoi pasek: co jest pokazane, ile zadań z tego okresu zostało poza widokiem, ile ukrywają filtry, oraz przyciski „Pokaż wszystkie zadania” / „Tylko …” i „Wyczyść filtry”. Wybór zapamiętuje się osobno dla każdego widoku.\n- **Wszystkie zadania** — pełna lista z filtrami, grupowaniem i sortowaniem.\n- **Kancelaria**: Klienci, Z zaległymi terminami, Raporty i czas pracy, Kalkulator terminów, Macierz priorytetów, Kamienie milowe.\n- **Obszary** z kategoriami, **Projekty**, **Zespół** (działy i osoby), **Tagi**, **Zapisane widoki**, **Kosz**, **Ustawienia**.\n- Każdą listę zadań można pokazać jako: Lista, Tabela (sortowanie po kolumnach), Tablica (Kanban), Kalendarz, Macierz Eisenhowera.\n- **Jesteś tutaj:** menu boczne zawsze wskazuje bieżący widok — podświetlona pozycja (złoty pasek), oznaczona sekcja, automatyczne przewinięcie do bieżącej pozycji; gdy jest poza widokiem lub w zwiniętej sekcji, nad menu (poza przewijaną listą, więc nic nie przesuwa) pojawia się karta „Jesteś tutaj” (kliknięcie pokazuje pozycję). Strony bez własnej pozycji wskazują najbliższą (klient → Klienci, oś czasu → Portfel projektów).\n- Górny pasek zawsze pokazuje pełną nazwę bieżącego widoku: długa nazwa (ponad ~38 znaków) dostaje własny wiersz na całą szerokość, a przyciski przechodzą pod nią.\n- Menu boczne można zwinąć do samych ikon; na telefonie działa dolny pasek i przycisk „+”.\n\n## Tworzenie i edycja zadań\n\n- **Nowe zadanie** otwiera okno ze wszystkimi polami: obszar, tytuł, notatki, podzadania, osoby, tagi, status, priorytet, termin z godziną, termin ustawowy, start, powtarzanie, przypomnienie, klient, projekt, kategoria, dział, kamień milowy, szacowany czas, szablon.\n- **Skróty w tytule**: daty (`jutro`, `pt`, `12.11`, `za 3 dni`, `w przyszły piątek`), godzina (`14:30`, `o 9`), `#tag`, `@osoba`, `+projekt`, `$klient`, `/kategoria`, `!1`–`!4` priorytet, `*` kamień milowy, `!!` termin ustawowy, powtarzanie (`co tydzień`, `codziennie`, `w dni robocze`, `co 2 tygodnie`).\n- **Panel zadania** (po prawej) ma zakładki Szczegóły, Komentarze, Czas pracy, Historia oraz stopkę Anuluj / Zapisz / Zapisz i zamknij. Zmiany pól są wersją roboczą do czasu zapisu (Ctrl+S); komentarze, podzadania, linki i wpisy czasu zapisują się od razu. Zamknięcie z niezapisanymi zmianami wymaga decyzji.\n- **Pola dodawania w panelu (od 2.3):** tekst wpisany w polu komentarza, podzadania, linku, przypomnienia lub czasu pracy nie znika przy odświeżeniu panelu (zmiana w tle, inne urządzenie) ani przy przełączeniu zakładek. Przypomnienie i link wpisane, ale niedodane przyciskiem, dopisują się do zmian przy „Zapisz” i „Zapisz i zamknij”. Niewysłany komentarz, podzadanie lub wpis czasu wstrzymuje zamknięcie panelu z komunikatem. Odświeżenie ekranu nigdy nie następuje w trakcie wciśniętego przycisku (kliknięcie nie ginie). Zamknięcie karty z niezapisanymi zmianami w otwartym zadaniu wymaga potwierdzenia przeglądarki.\n- Każda zmiana zapisuje się w historii zadania (ostatnie 50 wpisów).\n- **Edycja zbiorcza**: zaznacz wiele zadań i zmień status, priorytet, termin, klienta, projekt, osoby, tagi lub przenieś do kosza.\n- **Przeciągnij i upuść** zmienia kolejność, grupę (status, projekt, osobę…), dzień w kalendarzu, ćwiartkę macierzy; na telefonie przeciąga się za uchwyt.\n- **Duplikuj**, **zamień w projekt** (podzadania stają się zadaniami projektu), **zapisz jako szablon**, **dodaj do Google Kalendarza**.\n\n## Terminy, powtarzanie i dni wolne\n\n- Termin może mieć godzinę; zadanie z terminem dziś i minioną godziną jest zaległe.\n- Kalendarz dni wolnych: niedziele, soboty, święta ustawowe (łącznie z Wielkanocą, Bożym Ciałem i Wigilią od 2025 r.).\n- **Powtarzanie**: codziennie, w dni robocze, co tydzień, co 2 tygodnie, co miesiąc, co kwartał, co rok oraz dowolny interwał. Zadanie miesięczne pamięta dzień miesiąca (np. 31.) i w krótszych miesiącach przypada na ostatni dzień, wracając potem na właściwy.\n- Zakończenie zadania cyklicznego (odhaczenie, status, kolumna tablicy, akcja zbiorcza) przesuwa je na następny termin, odnawia podzadania i przypomnienia oraz zapisuje wykonanie w dzienniku wykonań (do raportów).\n- Ręczna zmiana terminu zadania cyklicznego staje się nowym punktem odniesienia. **Wyjątek (od 2.3): obowiązki z terminem ustawowym** (powtarzanie „przesuń na dzień roboczy” — JPK, ZUS, zaliczki, sprawozdania): przesunięcie jednego terminu dotyczy tylko tego wystąpienia, a kolejne wracają na dzień z przepisu (np. 25.).\n- Obowiązki z opcją „dzień roboczy” przesuwają termin z weekendu lub święta na najbliższy dzień roboczy.\n- **Kalkulator terminów** liczy termin X dni kalendarzowych lub roboczych od daty zdarzenia, z przesunięciem końca na dzień roboczy, i tworzy z wyniku zadanie z terminem ustawowym.\n- **Panel przypomnień** (od 1.5): przypomnienia trafiają do osobnego panelu w prawym dolnym rogu, z akcjami Otwórz, +10 min, +1 godz., Jutro 9:00, Zamknij. Panel można zwinąć do dzwonka z liczbą oczekujących. Podczas edycji zadania lub formularza nowe przypomnienia przychodzą zwinięte; na komputerze panel stoi na lewo od panelu zadania, na telefonie u góry ekranu — nigdy na polach ani przycisku Zapisz. Po zamknięciu zadania oczekujące przypomnienia rozwijają się same.\n- **Przypomnienia** działają, gdy aplikacja jest otwarta (także po przełączeniu karty): w dniu terminu, dzień wcześniej, godzinę przed lub o dowolnej porze; można je odkładać (+10 min, +1 godz., jutro 9:00).\n- **Przypomnienia a zapis i powtarzanie (od 2.3):** zapis zadania nie przywraca przypomnienia, które już się wyświetliło, i zachowuje przypomnienia dodane w międzyczasie (odłożenie, inne urządzenie). Odłożenie („+10 min”, „+1 godz.”, „Jutro 9:00”) zapisuje się zawsze w zadaniu i dotyczy tylko bieżącego wystąpienia — przy przejściu zadania cyklicznego na następny termin odłożenia znikają, a pozostałe przypomnienia przesuwają się o tyle dni co termin (także przypomnienia podzadań).\n\n## Klienci i obowiązki cykliczne\n\n- Klient jest **firmą / organizacją** (pełna nazwa) albo **osobą fizyczną** — JDG lub klient prywatny — z osobnymi polami **Nazwisko** i **Imię** oraz opcjonalną nazwą firmy; na listach widnieje jako „Nazwisko Imię” i jest sortowany po nazwisku. Wybór formy „JDG” lub „osoba fizyczna” przy pustej nazwie sam przełącza rodzaj na osobę.\n- Klient ma też: skrót, NIP (z kontrolą sumy), formę prawną, VAT (miesięczny, kwartalny, zwolniony), usługi (pełna księgowość, KPiR, ryczałt, kadry i płace, obsługa prawna, doradztwo podatkowe, biuro wirtualne), opiekuna, osobę kontaktową (osobno Nazwisko, Imię oraz funkcja / dział), e-mail, telefon, notatki, status aktywny/nieaktywny.\n- Strona klienta: statystyki (otwarte, po terminie, obowiązki, czas pracy), jego zadania (grupowane domyślnie po kategorii), przycisk Obowiązki cykliczne.\n- **Obowiązki cykliczne** proponowane na podstawie formy prawnej i usług: JPK_V7M (25.), JPK_V7K część ewidencyjna (25.) i deklaracja kwartalna, zaliczka CIT/PIT (20.), ZUS DRA (20.), zaliczki PIT od wynagrodzeń (20.), lista płac (10.), KSeF (5.), zamknięcie miesiąca (15.), PIT-11 i PIT-4R (31.01), CIT-8 (31.03), sprawozdanie finansowe: sporządzenie (31.03), zatwierdzenie (30.06), złożenie (15.07), zeznanie właściciela (30.04). Każdy jest zwykłym zadaniem cyklicznym — można zmienić dzień, osobę, tytuł. Nie powstaje duplikat już aktywnego obowiązku. Terminy należy weryfikować z aktualnymi przepisami.\n- Usunięcie klienta: zadania tracą klienta, a aktywne obowiązki trafiają do kosza; zalecane jest oznaczenie klienta jako nieaktywnego.\n\n## Projekty, zespół, szablony\n\n- Projekt: nazwa, skrót, kolor, projekt nadrzędny, obszar, kategoria, klient, status (pomysł, planowany, w realizacji, czeka na kogoś, wstrzymany, zakończony, zarchiwizowany), priorytet projektu, miejsce w rankingu, etapy z bieżącym etapem, zależności od innych projektów, następny krok, start, termin, opiekun, zespół, opis, notatki, komentarze. Postęp liczy się z zadań projektu i jego podprojektów (bez anulowanych); projekt bez zadań liczy postęp z zakończonych etapów.\n- Pracownicy: osobne pola Nazwisko i Imię (wyświetlane i sortowane „Nazwisko Imię”; podgląd i przycisk „⇄ Zamień” w formularzu), stanowisko, działy, kontakt, kolor, status aktywny. Zadanie może mieć wiele osób; pierwsza jest prowadząca; kolejność zmienia się przeciąganiem. Widok obciążenia zlicza otwarte zadania według statusów.\n- Szablony: nazwa, tytuł zadania, priorytet, kategoria, notatki, lista podzadań z opcjonalnym terminem „+N dni”. Sześć szablonów startowych (zamknięcie miesiąca, przyjęcie pracownika, ustanie stosunku pracy, wdrożenie klienta, zamknięcie roku, nowa sprawa).\n\n## Portfel projektów\n\nPulpit dla osoby zarządzającej: ile tematów jest w toku, które są najważniejsze, co można wstrzymać i gdzie się zatrzymaliśmy.\n\n- **Hierarchia:** projekt → podprojekty (np. moduły aplikacji) → etapy → zadania. Podprojekt ma jeden poziom: projekt z podprojektami nie może sam być podprojektem. Podprojekt dziedziczy przy tworzeniu obszar, klienta, kategorię, opiekuna, zespół i kolor.\n- **Statusy projektu:** Pomysł, Planowany, W realizacji, Czeka na kogoś, Wstrzymany, Zakończony, Zarchiwizowany. Dotychczasowy „Aktywny” to „W realizacji”.\n- **Czeka na kogoś:** przy tym statusie zapisuje się, na kogo / na co czekamy, od kiedy i kiedy ponowić kontakt. Po dacie ponowienia karta i podpowiedzi przypominają o kontakcie, a ikona Portfela w menu dostaje czerwony znacznik. „Mamy odpowiedź” wraca do „W realizacji”.\n- **Etapy:** lista etapów z opcjonalnymi datami i bieżącym etapem. Szablony: Aplikacja / moduł, Audyt wewnętrzny, Sprawa klienta, Prosty. Na stronie projektu etapy tworzą pasek kroków — kliknięcie ustawia bieżący etap, „Zakończ etap” przechodzi do następnego. Zadanie może mieć przypisany etap (pole „Etap” w panelu zadania, grupowanie „Etap projektu” na liście). Zmiana projektu zadania czyści etap.\n- **Gdzie jestem / następny krok:** jedno zdanie zapisywane na stronie projektu (autozapis) z datą ostatniej zmiany oraz „ostatnio zakończone zadanie”.\n- **Ranking ważności:** kolejność wszystkich otwartych projektów (1 = najważniejszy) ustawiana przeciąganiem lub strzałkami; dodatkowo priorytet Krytyczny / Wysoki / Normalny / Niski. Projekty bez miejsca w rankingu trafiają na koniec według priorytetu i terminu.\n- **Zależności:** „Zależy od projektów” — projekt nie ruszy, dopóki tamte nie zostaną zakończone. Wynikają z tego stany „Zablokowany” i linie na osi czasu oraz mapie.\n- **Kondycja projektu (liczona automatycznie):** Zgodnie z planem, Zagrożony (zadania po terminie albo postęp ponad 35 punktów poniżej upływu czasu), Po terminie, Zablokowany, Czeka, Bez ruchu (21 dni bez zmian w projekcie i jego zadaniach), Wstrzymany, Pomysł.\n- **Widoki:**\n  - *Tablica* — kolumny statusów, karty z miejscem w rankingu, priorytetem, kondycją, rodzicem, etapem i paskiem etapów, następnym krokiem, „czeka na”, podprojektami, postępem, kamieniem milowym i terminem; przeciągnięcie do kolumny zmienia status, na kartę — także miejsce w rankingu.\n  - *Oś czasu* — wykres Gantta 3/6/12 miesięcy: projekt i pod nim podprojekty, paski z wypełnieniem postępu i odcinkami etapów, kamienie milowe, linia „dziś”, strzałki zależności (czerwona przerywana = podprojekt startuje przed zakończeniem projektu, od którego zależy). Paski bez dat są szacowane z terminów zadań.\n  - *Mapa powiązań* — projekty jako przestrzenne karty ułożone warstwami według zależności, połączone liniami: przerywana = podprojekt, niebieska = zależność, pomarańczowa animowana = blokuje (w toku), zielona = spełniona. Najechanie podświetla powiązania. Powiększenie 70/85/100%.\n  - *Ranking* — lista do przeciągania i panel **Podpowiedzi**: za dużo projektów w realizacji (limit ustawiany, domyślnie 5 — kandydaci do wstrzymania), najdłużej czekające na odpowiedź, zablokowane, po terminie, bez ruchu od 3 tygodni, bez następnego kroku.\n- **Filtry:** obszar (wszystkie / służbowe / osobiste), rodzaj (wewnętrzne / klientów), podprojekty, zakończone, wyszukiwanie. Ustawienia widoku pamiętane na urządzeniu.\n- **Liczniki u góry:** w realizacji, czeka na kogoś, planowane, wstrzymane, pomysły, wymaga uwagi, kamienie milowe w 30 dni.\n- Menu boczne pokazuje podprojekty wcięte pod projektem nadrzędnym; listy wyboru projektu również. Dawny widok „Oś czasu projektów” prowadzi do osi czasu w Portfelu.\n\n## Czas pracy i raporty\n\n- Licznik czasu: jeden na raz, widoczny w nagłówku; zatrzymanie zapisuje wpis (minimum 1 minuta). Wpisy ręczne: data, czas (`1:30`, `1,5 h`, `45`), osoba, opis. Suma porównywana z szacowanym czasem.\n- Raporty za tydzień, miesiąc, kwartał, rok lub własny zakres: zakończone (łącznie z wystąpieniami cyklicznymi), terminowość, nowe zadania, zaległe teraz, czas pracy; tabela zespołu, klienci według czasu pracy, wpisy czasu, eksport CSV.\n- Eksport CSV zadań i czasu pracy używa średnika i BOM (Excel); komórki zaczynające się od `=`, `+`, `-`, `@` są neutralizowane.\n\n## Filtry, grupowanie, widoki zapisane\n\n- Filtry: tekst, obszar, termin (zaległe, dziś, 7, 30 dni, bez terminu), status, priorytet, osoby lub nieprzydzielone, działy, klienci, projekty, kategorie, tagi (dowolny / wszystkie), kamienie milowe, terminy ustawowe, przypięte, zablokowane.\n- Grupowanie: klient, projekt, status, priorytet, termin, osoba, kategoria, dział, obszar, dzień. Sortowanie: ręczne, termin, priorytet, nazwa, utworzenie, zmiana, sygnatura.\n- Zapisany widok zapamiętuje filtry, grupowanie, sortowanie i układ; pojawia się w menu. Od 2.3 pamięta też zakres, z którego go zapisano (projekt, klient, osoba, dział, kategoria, tag, Skrzynka, Dziś, Nadchodzące) i pokazuje tylko zadania z tego zakresu; widoki zapisane z „Wszystkich zadań” obejmują wszystkie zadania.\n- Listy pomocnicze (projekty, kategorie, tagi, działy, klienci, osoby) są alfabetyczne z polskim sortowaniem; statusy zachowują kolejność etapów.\n\n## Synchronizacja i przechowywanie danych\n\n- Dane zapisują się w prywatnej przestrzeni konta Claude (`data/users/<id>/ws/<kolekcja>/<id>`), w kolekcjach: zadania, projekty, pracownicy, działy, kategorie, tagi, statusy, widoki, klienci, szablony oraz dokument ustawień. Nikt inny ich nie widzi, nawet po udostępnieniu linku.\n- Każda zmiana jest zapisywana natychmiast lokalnie i wysyłana w tle; zapisy do tego samego rekordu są kolejkowane. Zmiany z innych urządzeń przychodzą na żywo.\n- **Zmiana nie jest porzucana, dopóki chmura jej nie potwierdzi (od 2.3).** Przy braku połączenia Wokanda ponawia zapis z rosnącym odstępem (2 s → 60 s) tak długo, jak karta jest otwarta; pasek synchronizacji pokazuje „Brak połączenia · N czeka”. Zapis odrzucony na stałe (limit miejsca, odrzucone dane) zostaje widoczny lokalnie, jest liczony jako „Niezapisane: N” i ponawiany co 5 minut. Niewysłane zmiany są też zapisywane w dzienniku w przeglądarce (`wk.unsent.<id>`) i dosyłane przy następnym uruchomieniu — tylko jeśli nadal są nowsze niż kopia w chmurze. Przy niewysłanych zmianach karta ostrzega przed zamknięciem.\n- Ekran powitalny pokazuje się tylko przy pustej, w pełni wczytanej bazie. Przy wolnym połączeniu aplikacja pokazuje częściowe dane i czeka na resztę; utracone nasłuchiwanie odnawia się bez przeładowania strony.\n- Bez zalogowanego konta (np. kopia uruchomiona poza Claude) aplikacja działa lokalnie, w pamięci przeglądarki; wskaźnik w lewym dolnym rogu pokazuje tryb.\n- Limity: 25 000 dokumentów, 256 KB na dokument. Historia zadania jest przycinana do 50 wpisów, dziennik wykonań do 400 (rok codziennych wykonań).\n- Sygnatury `WK-n`: najwyższy nadany numer jest pamiętany także po trwałym usunięciu zadania (`settings.numFloor`). Gdy dwa urządzenia nadadzą ten sam numer (zadania utworzone równocześnie lub offline), przy starcie zadanie utworzone później dostaje kolejny wolny numer, a zmiana trafia do jego historii.\n- Widok odświeża się sam, gdy zmienia się data albo mija godzina terminu (sprawdzenie co 30 s, nigdy podczas pisania).\n\n## Kopia zapasowa i przywracanie\n\n- Od 2.1 eksport jest domyślnie **szyfrowany hasłem kopii** (AES-256-GCM, PBKDF2 600 000) i sprawdzany po zaszyfrowaniu (odczyt próbny). W wersji w Claude można świadomie wybrać zapis bez szyfrowania; w wersji serwerowej nie. Import rozpoznaje kopię zaszyfrowaną i prosi o hasło; odszyfrowanie odbywa się tylko w przeglądarce. Hasło kopii przechowuj oddzielnie od pliku.\n\n- Eksport: weryfikacja spójności (identyfikatory, duplikaty, powiązania, cykle podzadań), suma kontrolna SHA-256 danych, ponowny odczyt gotowego pliku, zapis `wokanda-kopia-RRRR-MM-DD-GGMM.json`. Historia ostatnich 8 kopii z sumami jest w Ustawieniach.\n- Import: sprawdzenie formatu i wersji, sumy kontrolnej, liczby rekordów, powiązań; naprawa odwołań do nieistniejących elementów, odrzucenie niebezpiecznych linków i kolorów. Tryb scalania (nowsze rekordy wygrywają) lub zastąpienia (z potwierdzeniem słowem).\n- Przypomnienie o kopii po 14 dniach od ostatniej (raz dziennie). Kontrola integralności bez eksportu porównuje bieżący stan z ostatnią kopią.\n- Kosz: usunięte zadania (z podzadaniami) są oznaczane, a nie kasowane; można je przywrócić przez 30 dni; potem są usuwane automatycznie. Przywrócenie dotyczy wybranego zadania, jego podzadań i (jeśli są w koszu) zadań nadrzędnych — nie wszystkich zadań usuniętych w tej samej akcji zbiorczej.\n- **Kopia przed operacją nieodwracalną (od 2.3).** „Zastąp wszystkie dane” oraz „Usuń wszystko” zaczynają się od zapisania obecnego stanu: w Claude jako kopia w chmurze („przed przywróceniem”, „przed usunięciem danych”), a w sejfie i w trybie lokalnym — jako plik kopii. Jeśli kopia nie powstanie, operacja się nie wykona.\n- **Import traktuje plik jak dane obce (od 2.3).** Poza sumą kontrolną i powiązaniami porządkowane są: identyfikatory zagnieżdżone (komentarze, przypomnienia, linki, wpisy czasu, etapy), sygnatury (liczba całkowita), priorytet (0–4), obszar, daty i godziny (tylko istniejące daty), powtarzanie, kolory, zapętlone zależności projektów oraz ustawienia (tylko znane pola). Treść użytkownika nie jest zmieniana.\n\n## Kopie w chmurze (od 1.9)\n\n- Raz dziennie pierwsze urządzenie, na którym otworzysz Wokandę, zapisuje pełną kopię wszystkich danych (ten sam format i ta sama weryfikacja co kopia do pliku, z sumą kontrolną SHA-256) w Twojej prywatnej przestrzeni na koncie Claude. Kopia jest dzielona na części, więc rozmiar danych nie jest ograniczeniem. Po zapisaniu kopia jest odczytywana z chmury i porównywana z oryginałem (od 2.3; pole `verified`). Przechowywanych jest 14 ostatnich kopii (automatycznych, ręcznych, „przed przywróceniem” i „przed usunięciem danych”).\n- Ustawienia → Kopia zapasowa → Automatyczne kopie w chmurze: lista kopii (data, rodzaj, liczba rekordów, rozmiar), „Zrób kopię teraz”, „Przywróć…”. Przywrócenie pokazuje raport weryfikacji i pozwala scalić albo zastąpić dane; przed zastąpieniem aplikacja sama robi kopię bieżącego stanu.\n- Dane zapisane kiedyś tylko w przeglądarce (tryb bez synchronizacji) są po połączeniu z kontem proponowane do przeniesienia do chmury („Przenieś do chmury”).\n- Gdy Wokanda działa w Claude, ale synchronizacja nie odpowiada, pasek u dołu menu pokazuje „Brak synchronizacji” i pojawia się komunikat z przyciskiem „Odśwież”.\n\n## Wersja serwerowa — szyfrowany sejf (od 2.0)\n\nWokanda ma dwie odmiany z tym samym wyglądem i funkcjami: **w Claude** (dane w prywatnej przestrzeni konta Claude) oraz **serwerową** (strona z GitHub Pages, dane na serwerze dhosting). W odmianie serwerowej obowiązuje szyfrowanie end-to-end.\n\n**Jak to działa**\n- Hasło główne → PBKDF2-SHA256 (600 000 iteracji, losowa sól) → klucz główny, tylko w pamięci przeglądarki. Z niego (HKDF) powstają: dowód logowania (serwer przechowuje z niego jedynie skrót password_hash) i klucz, który szyfruje klucz prywatny konta (ECDH P-256).\n- Klucz sejfu (AES-256, losowy) jest zapakowany kluczem publicznym konta — osobno dla każdej osoby, która ma dostęp (gotowe na pracowników). Z klucza sejfu powstają klucz rekordów (AES-256-GCM) i klucz identyfikatorów (HMAC-SHA256).\n- **Pieczęć klucza sejfu (od 2.3).** Paczkę zaszyfrowaną kluczem publicznym może wytworzyć każdy, kto zna klucz publiczny — także osoba z dostępem do bazy. Dlatego klucz sejfu jest dodatkowo zapieczętowany (AES-256-GCM) kluczem z hasła głównego (`space_keys.kc`) i kluczem odzyskiwania (`rec_kc`); urządzenia właściciela używają wyłącznie tych kopii. Zmieniona pieczęć = logowanie przerwane z wyjaśnieniem. Każde urządzenie pamięta też odcisk klucza sejfu (`wk.vkfp`) i odmawia innego. Sejf założony w 2.0–2.2 dostaje pieczęć przy pierwszym logowaniu w 2.3 — po jednorazowym potwierdzeniu na ekranie (na urządzeniu, które sejf już zna: bez pytania).\n- Każdy rekord jest szyfrowany w przeglądarce razem z nazwą kolekcji i identyfikatorem; szyfrogram jest związany z identyfikatorem rekordu (AAD), więc paczek nie da się podmienić ani zamienić miejscami bez wykrycia.\n- Klucz odzyskiwania (32 losowe bajty, 64 znaki) — druga, niezależna kopia klucza prywatnego. Odzyskanie ustawia nowe hasło i wylogowuje wszystkie urządzenia.\n- Zaufane urządzenie: dane sesji i klucz sejfu zaszyfrowane PIN-em (PBKDF2) i nieeksportowalnym kluczem urządzenia w IndexedDB; ważne 30 dni; 5 błędnych PIN-ów = urządzenie zapomniane.\n- Blokada po bezczynności czyści z pamięci klucze, token logowania, odszyfrowane dane, powiadomienia i historię cofania. Bez zaufanego urządzenia logowanie jest przy blokadzie unieważniane na serwerze; na zaufanym urządzeniu token zostaje tylko w pakiecie chronionym PIN-em. Niezapisane zmiany w otwartym zadaniu są przechowywane zaszyfrowane kluczem sejfu i wracają po odblokowaniu. Pamięć podręczna w urządzeniu (IndexedDB) zawiera wyłącznie szyfrogramy; szukany tekst nie jest zapisywany w pamięci przeglądarki.\n- Synchronizacja: zapisy w paczkach z kontrolą wersji, odpytywanie o zmiany co kilka sekund, praca offline z kolejką zapisów (porcje do 150 rekordów i ok. 1,5 MB; rekord ponad limit serwera zostaje na urządzeniu z komunikatem i nie blokuje pozostałych).\n- **Konflikty (od 2.3): wygrywa zmiana wykonana później** — jednakowo dla edycji i usunięć, niezależnie od tego, czy urządzenie najpierw pobiera zmiany, czy wysyła kolejkę. Czas zmiany jest zapisany wewnątrz zaszyfrowanej paczki. Zmiana zrobiona w trakcie wysyłki poprzedniej zostaje w kolejce i wychodzi jako następna.\n- **Czego serwer nie może zrobić niezauważenie (od 2.3):** podać sfałszowanej paczki (odrzucana, urządzenie odsyła swoją kopię), podać starszej treści pod nowszym numerem wersji (odrzucana jako cofnięta), „usunąć” rekordu jawnym znacznikiem w bazie (usunięcie wynika wyłącznie z odszyfrowanej treści), podmienić klucza sejfu. Po przywróceniu starszej kopii bazy (np. przez hosting) urządzenie wykrywa to po ostatniej widzianej paczce, porównuje wszystko od zera i odsyła nowsze rekordy. Nie jest wykrywane ukrycie rekordu przed urządzeniem, które nigdy go nie widziało — do tego potrzebny jest manifest integralności (lista „Do rozważenia”).\n\n**Co widzi serwer (i każdy, kto ma do niego dostęp):** login (e-mail), liczbę i rozmiary zaszyfrowanych paczek, czasy zmian, skróty adresów IP w dzienniku. **Czego nie widzi:** żadnej treści — nazw zadań, klientów, kwot, notatek, dat, nazw projektów ani tego, do jakiej kolekcji należy paczka.\n\n**Granice ochrony:** bez hasła i klucza odzyskiwania danych nie odzyska nikt; zainfekowane urządzenie (np. złośliwe oprogramowanie z podglądem klawiatury) może przechwycić hasło; konto GitHub, z którego ładuje się strona, musi być chronione dwuetapowym logowaniem; osoba z dostępem do serwera może usunąć dane — dlatego warto okresowo eksportować zaszyfrowaną kopię do pliku.\n\n**Serwer (API):** `api.php` + `lib/` + `data/` (tworzony automatycznie: baza SQLite i `config.php` z listą dozwolonych adresów strony). Operacje: status, prelogin, setup (tylko pierwsze konto), login, me, logout, logout_all, password, recovery_set, keycheck_set, recover_start, recover_finish, security, changes, put.\n\n**Serwer po audycie (2.3):** operacje zmieniające stan tylko metodą POST (inaczej 405); limit rozmiaru żądania sprawdzany przed wczytaniem (64 KB bez logowania, 60 MB dla zapisu paczek po sprawdzeniu tokenu); jednakowy koszt sprawdzenia dowodu logowania dla konta istniejącego i nieistniejącego; próba logowania liczona w transakcji przed sprawdzeniem (8 na login i 60 na adres w 15 min; klucz odzyskiwania 5 na godzinę); wyłączone konto odrzucane także przy odzyskiwaniu; zmiana hasła, odzyskanie i nowy klucz odzyskiwania w jednej transakcji z unieważnieniem sesji; wygasłe sesje sprzątane; błędy PHP nigdy w odpowiedzi; nagłówki HSTS, X-Frame-Options, CSP; pliki biblioteki wywołane wprost nie robią nic.\n\n**Układ bazy (wersja 2):** `meta` (wersja układu, licznik kolejności, skrót-atrapa), `users`, `spaces`, `space_keys` (→ spaces, users; `wrapped`, `kc`, `rec_kc`), `records` (→ spaces; `rid`, `ver`, `seq`, `blob`, `deleted`), `sessions` (→ users; skrót tokenu), `attempts`, `log` (tylko do dopisywania — wyzwalacze blokują zmianę i usunięcie). Migracja z wersji 1 wykonuje się sama przy pierwszym zapytaniu po podmianie plików: pod blokadą pliku, z kopią bazy `data/przed-migracja-v1-<czas>.sqlite` (5 ostatnich), z kontrolą liczby rekordów i powiązań; niczego nie usuwa.\n\n**Rejestr zdarzeń serwera:** setup, login, login_fail, blocked (limit prób — raz na okno), logout, logout_all, password, password_fail, recovery_set, keycheck_set, recovered, recover_fail, denied (próba dostępu do cudzej przestrzeni). Bez treści, tokenów i adresów IP wprost (skrót HMAC). Bez sesji PHP (token w nagłówku `X-Auth`, w bazie tylko jego SHA-256), limity prób, blokada obcych adresów (CORS), nagłówki bezpieczeństwa.\n\n**Utwardzenie (2.1):** przeglądarka przyjmuje od serwera wyłącznie bezpieczne parametry klucza (PBKDF2-SHA256, 600 000–5 000 000 iteracji, sól 16 lub 32 bajty) — inaczej przerywa logowanie przed użyciem hasła. Strona ma politykę CSP: jedyny dozwolony skrypt to skrypt aplikacji przypięty skrótem SHA-256, połączenia tylko z serwerem danych, czcionki i style tylko z plików strony. Hasło główne i hasło kopii: 4–6 przypadkowych słów (min. 20 znaków) albo min. 14 znaków ze wszystkimi rodzajami znaków. Login może (i powinien) być nazwą nieidentyfikującą.\n\n**Pierwsze uruchomienie:** adres serwera → „Załóż szyfrowany sejf” (login, hasło główne: 4–6 różnych słów, min. 20 znaków, albo min. 14 znaków ze wszystkimi rodzajami znaków; popularne hasła, powtórzone słowa i ciągi typu „1234”, „qwerty” są odrzucane) → klucz odzyskiwania (wydruk) → ekran powitalny: przykładowe dane, czysta karta albo „Przenieś dane z Wokandy w Claude (plik kopii)” → propozycja zaufanego urządzenia z PIN-em.\n\n**Ustawienia → Sejf i bezpieczeństwo:** stan sejfu, zablokuj teraz, zmiana hasła głównego, nowy klucz odzyskiwania, wylogowanie, zaufane urządzenie i PIN, czas blokady, dziennik bezpieczeństwa i aktywne urządzenia, wylogowanie innych urządzeń.\n\n## Bezpieczeństwo\n\n- Linki w zadaniach muszą zaczynać się od `http://` lub `https://`; inne schematy są odrzucane przy imporcie i wpisie.\n- Wszystkie teksty użytkownika są kodowane przy wyświetlaniu (brak wstrzykiwania HTML). Kolory rekordów wchodzących do aplikacji (chmura, serwer, pamięć przeglądarki, import) są sprowadzane do postaci `#hex`.\n- Strona odmiany serwerowej nie uruchamia się wewnątrz obcej ramki.\n- Dane nie opuszczają konta Claude; eksporty zapisują się na urządzeniu użytkownika.\n- Załączniki plików nie są obsługiwane celowo — zamiast nich linki do dysku firmowego.\n\n## Instalacja na telefonie (PWA)\n\n- Manifest, ikony i tryb pełnoekranowy pozwalają dodać Wokandę do ekranu głównego (Android: „Zainstaluj aplikację”; iPhone: Udostępnij → „Do ekranu początkowego”).\n- Service worker strony (odmiana serwerowa) obsługuje wyłącznie własne pliki strony: najpierw sieć, bez sieci zapisana powłoka. Nigdy nie zapisuje odpowiedzi serwera danych. (Do wersji 2.2 nie instalował się z powodu błędu składni; od 2.3 składnia jest sprawdzana przy każdej budowie.)\n- Pełna synchronizacja działa, gdy aplikacja jest otwarta w Claude (aplikacja mobilna lub przeglądarka, zalogowany). Kopia uruchomiona poza Claude pracuje lokalnie.\n- Pełna, samodzielna wersja PWA z własną bazą danych wymaga przeniesienia na serwer kancelarii (PHP/MariaDB) — to osobne wdrożenie.\n\n## Skróty klawiszowe\n\n- `Ctrl K` lub `/` — paleta poleceń (skróty z „G” mają pierwszeństwo przed pojedynczymi literami — od 2.3 „G, potem T” otwiera oś czasu, a „G, potem L” klientów); `N` — nowe zadanie; `T` — dzień/noc; `L / V / B / C / M` — układ listy; `G` potem `O I D U K A Z S T L R` — nawigacja; `Esc` — zamknij; `Ctrl S` — zapisz i zamknij panel; `Ctrl Enter` — wyślij komentarz / utwórz zadanie; `?` — lista skrótów.\n\n## Powiązania i zależności między elementami\n\n- Zadanie → projekt (obszar i kategoria dziedziczone), klient (obszar służbowy), kategoria (obszar), dział, osoby, tagi, rodzic, blokady, szablon źródłowy.\n- Projekt → klient, kategoria, opiekun, zespół, projekt nadrzędny, projekty, od których zależy, etapy. Usunięcie projektu: zadania do kosza lub do Skrzynki; jego podprojekty stają się projektami głównymi, a zależności od niego są pomijane.\n- Zadanie → etap projektu (`phaseId`); etap znika z zadania przy przeniesieniu do innego projektu.\n- Klient → opiekun, obowiązki (zadania z `dutyKey`). Nieaktywny klient znika z list wyboru, ale pozostaje przy istniejących zadaniach.\n- Pracownik → działy; usunięcie zdejmuje go z zadań i kierownictwa działu; zalecany status nieaktywny.\n- Status → typ steruje zamknięciem, statystykami i kolumnami tablicy; usunięcie statusu wymaga przeniesienia zadań.\n- Czas pracy → zadanie, osoba, klient (przez zadanie) → raporty.\n\n## Osoby i kolejność alfabetyczna\n\n- Zasada: każda osoba — pracownik, klient będący osobą fizyczną, osoba kontaktowa — ma **osobne pole na nazwisko i osobne na imię**. Wyświetlanie zawsze „Nazwisko Imię”.\n- Sortowanie: wszystkie listy osób alfabetycznie po nazwisku, potem po imieniu, z polskim porządkiem liter (Ł po L, Ś po S, Ż na końcu). Dotyczy: listy pracowników, działów, obciążenia, wyboru osób do zadań i zespołów, opiekunów, awatarów przy zadaniach, filtrów, grup, raportów, eksportu CSV i historii zmian.\n- Wyjątek: w panelu zadania kolejność osób pokazuje osobę prowadzącą (pierwsza, numerowana) — tę kolejność zmienia się przeciąganiem.\n- Wyszukiwanie osób i klientów działa w dowolnej kolejności słów.\n- Starsze dane: pracownicy zapisani dawniej jednym polem („Imię Nazwisko”) zostali raz rozdzieleni na dwa pola; osoba kontaktowa klienta zapisana jednym polem jest rozdzielana przy pierwszej edycji (nazwa działu typu „Zarząd” trafia do pola Nazwisko — można ją przenieść do „Funkcja / dział”).\n\n## Model danych (skrót)\n\n- Zadanie: `id, num, title, notes, area, categoryId, projectId, clientId, parentId, status, prevStatus, priority, start, due, dueTime, hard, reminders[], recur{freq,interval,day,workday}, recurBase, doneLog[], milestone, pinned, blockedBy[], waitingFor, assignees[], departmentId, tags[], estimate, time[], links[], comments[], history[], order, completedAt, deletedAt, deletedBatch, dutyKey, demo`.\n- Klient: `id, kind (company|person), name, lastName, firstName, company, short, nip, form, vat, services[], ownerId, contactLast, contactFirst, contactRole, contactName, email, phone, notes, active, color`.\n- Projekt: `id, name, code, color, parentId, area, categoryId, clientId, status, prio, rank, phases[{id,name,start,due,done}], phaseId, dependsOn[], nextStep, nextStepAt, waitingFor, waitingSince, followUp, start, due, ownerId, members[], description, notes, comments[]`.\n- Pracownik: `id, lastName, firstName, name, role, email, phone, departmentIds[], color, active`.\n- Szyfrowana kopia (2.1): `format: wokanda-backup-enc, formatVersion, appVersion, exportedAt, kdf{alg, iter, salt}, data` — `data` = AES-256-GCM(cała kopia) kluczem HKDF(PBKDF2(hasło kopii)).\n- Kopia zapasowa: `format: wokanda-backup, formatVersion, appVersion, exportedAt, counts, checksum, data{kolekcje, settings}`.\n\n## Zasady rozwoju\n\n- Każda nowa osoba w dowolnym miejscu: osobne pola Nazwisko i Imię, kolejność „Nazwisko Imię”, sortowanie alfabetyczne.\n- Każda wersja: numer +0,1, wpis w dzienniku zmian, aktualizacja tej księgi, testy w obu motywach na komputerze i telefonie, test aktualizacji na istniejących danych.\n- Nazwy funkcji w modułach nie mogą się powtarzać (wszystkie części trafiają do jednego skryptu — późniejsza definicja po cichu zastępuje wcześniejszą; tak powstał błąd statusu zadań z wersji 1.6).\n- Dane przykładowe są oznaczone (`demo`) i usuwalne jednym kliknięciem.\n\n## Historia audytów\n\n### Audyt wewnętrzny 26.11.2026 (wersja 2.2 → 2.3)\n\n- **Zakres:** cały kod (src/, hosting/, pwa/, tools/, workflow), według instrukcji „Audyt wewnętrzny aplikacji Regatio” i standardów Regatio (konta i bezpieczeństwo, kopie i przywracanie, PHP + SQLite na dhosting, interfejs, testy i wydanie, wydanie na GitHub). Trzech niezależnych recenzentów (bezpieczeństwo sejfu i serwera; widoki, Portfel, terminy; panel zadania, funkcje, ustawienia), wszystkie ustalenia odtworzone testami.\n- **Wynik:** 67 ustaleń — krytyczne 0, wysokie 8, średnie 25, niskie 34. Naprawione w 2.3: 49 (wszystkie wysokie). Otwarte: 18 (4 średnie, 14 niskich) — w „Do rozważenia”.\n- **Najważniejsze naprawy:** pieczęć klucza sejfu (osoba z dostępem do bazy nie podstawi własnego klucza); zmiany nie giną przy błędach zapisu i wyścigu synchronizacji; status zadań na listach; zadania cykliczne i obowiązki ustawowe; panel zadania nie gubi wpisanego tekstu ani kliknięcia „Zapisz”; blokada sejfu czyści całą odszyfrowaną treść.\n- **Testy w repozytorium:** tests/test_api.py (serwer, 105 kontroli), tests/test_claude.py (odmiana Claude, 48), tests/test_server.py (sejf, 53); aktualizacja 2.2 → 2.3 na sejfie i na kopii prawdziwych danych bez zmian w danych.\n- **Pełny raport:** docs/AUDYT-2026-11-26.md.\n- **Decyzje właściciela:** (do uzupełnienia po odpowiedzi na listę propozycji P1–P22).\n\n## Do rozważenia\n\nPropozycje z audytu 26.11.2026 czekające na decyzję (numeracja z raportu; następny audyt wraca do tej listy):\n\n- **P1** Blokada logowania liczona na login i adres (zamiast samego loginu) — obcy nie zablokuje konta właściciela.\n- **P2** Odblokowanie odciskiem palca / twarzą (WebAuthn) i dłuższy PIN zaufanego urządzenia.\n- **P3** Własny adres strony (np. wokanda.regatio.pl) zamiast wspólnego iro78.github.io.\n- **P4** Jednorazowy kod instalacyjny do założenia sejfu.\n- **P5** Rotacja klucza sejfu po zmianie hasła i odzyskaniu; Secret Key, Argon2id (etap 2 raportu bezpieczeństwa).\n- **P6** Okres przechowywania rejestru zdarzeń serwera.\n- **P7** Szybkie listy przy tysiącach zadań (stronicowanie lub „pokaż więcej”).\n- **P8** Jednakowe liczenie postępu i statystyk projektu (strona projektu, menu, Portfel, podzadania anulowane).\n- **P9** Jedna reguła zmiany terminu zadania cyklicznego (panel, przeciąganie na listę i do macierzy).\n- **P10** Czas pracy zadań w koszu w raportach.\n- **P11** Drobne poprawki Portfela (podpowiedź daty ponowienia, ranking przy anulowaniu, cofanie statusu, etykiety).\n- **P12** Usunięcie martwego kodu (nieużywane funkcje i akcje).\n- **P13** Zbiorcze „Projekt” działa jak „Przenieś do projektu” (podzadania, etap).\n- **P14** Potwierdzenie lub „Cofnij” przy usuwaniu tagu, komentarza i wpisu czasu.\n- **P15** Obowiązki: kategoria po identyfikatorze; aktualizacja istniejących obowiązków po zmianie tabeli terminów.\n- **P16** „Pilne terminy” najpierw dzisiejsze; filtry 7/30 dni dokładnie 7/30 dni; zapamiętywanie trasy osi czasu.\n- **P17** Przycisk „Zamknij” w panelu z niezapisanymi zmianami pyta zamiast odrzucać.\n- **P18** Wdrożenie serwera danych i przeniesienie danych z Claude do sejfu.\n- **P19** Konta pracowników z dostępem do wspólnego sejfu.\n- **P20** Powiadomienia systemowe o przypomnieniach na telefonie (PWA).\n- **P21** Karta osoby RODO: wszystkie dane klienta lub pracownika w jednym miejscu, eksport, anonimizacja.\n- **P22** Automatyczna zaszyfrowana kopia sejfu w terminarzu (np. co tydzień plik do pobrania).\n\n";

let popState=null;
function closePop(){ if(popState){ popState.el.remove(); popState.onClose&&popState.onClose(); popState=null; } }
function openPop(anchor, html, opts={}){
  closePop();
  const el=document.createElement('div'); el.className='pop'; el.innerHTML=html; el.setAttribute('role','menu');
  if(opts.width) el.style.minWidth=opts.width+'px';
  $('#popHost').appendChild(el);
  const r=anchor.getBoundingClientRect(); const vw=window.innerWidth, vh=window.innerHeight;
  const pw=el.offsetWidth, ph=el.offsetHeight;
  let left=Math.min(Math.max(8, r.left), vw-pw-8); let top=r.bottom+6;
  if(top+ph>vh-8) top=Math.max(8, r.top-ph-6);
  el.style.left=left+'px'; el.style.top=top+'px';
  popState={el, anchor, onClose:opts.onClose};
  const s=el.querySelector('.psearch'); if(s && matchMedia('(hover:hover)').matches) setTimeout(()=>s.focus(),10);
  return el;
}
document.addEventListener('pointerdown', e=>{ if(popState && !popState.el.contains(e.target) && !popState.anchor.contains(e.target)) closePop(); }, true);
window.addEventListener('resize', closePop);

/** items: [{label, icon, right, on, danger, sep, header, color, action, avatar}] */
function menu(anchor, items, opts={}){
  const build=(q='')=>{
    const nq=norm(q);
    const ws=nq.split(/\s+/).filter(Boolean); const hit=it=>{ const hay=norm(`${it.label} ${typeof it.right==='string'?it.right:''} ${it.kw||''}`); return ws.every(w=>hay.includes(w)); };
    return items.filter(it=>it.sep||it.header||!nq||hit(it)).map((it,i)=>{
      if(it.sep) return '<hr>'; if(it.header) return `<div class="ph">${esc(it.header)}</div>`;
      return `<button type="button" class="pi ${it.on?'on':''} ${it.danger?'danger':''}" data-mi="${items.indexOf(it)}">${it.avatar?avatar(it.avatar,'md'):''}${it.color?`<span style="width:10px;height:10px;border-radius:3px;background:${esc(it.color)};flex:none"></span>`:''}${it.icon?ico(it.icon):''}${it.multi?`<span class="tick">${ico('i-check','s14')}</span>`:''}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.label)}</span>${it.right?`<span class="r">${esc(it.right)}</span>`:''}${it.on&&!it.multi?`<span class="r">${ico('i-check','s14')}</span>`:''}</button>`;
    }).join('');
  };
  const html=(opts.search?`<input class="inp psearch" id="pop-search" placeholder="${esc(opts.placeholder||'Szukaj…')}" autocomplete="off">`:'')+`<div class="pbody">${build()}</div>`+(opts.footer||'');
  const el=openPop(anchor, html, opts);
  el.addEventListener('click', e=>{
    const b=e.target.closest('[data-mi]'); if(!b) return;
    const it=items[+b.dataset.mi];
    if(it.multi){ it.on=!it.on; b.classList.toggle('on', it.on); it.action&&it.action(it.on); return; }
    closePop(); it.action&&it.action();
  });
  const s=el.querySelector('.psearch');
  if(s){
    s.addEventListener('input', ()=>{ el.querySelector('.pbody').innerHTML=build(s.value); });
    s.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); const first=el.querySelector('[data-mi]'); if(first) first.click(); else if(opts.onCreate && s.value.trim()){ closePop(); opts.onCreate(s.value.trim()); } }
      if(e.key==='Escape') closePop();
    });
  }
  if(opts.onCreate){ el.addEventListener('click', e=>{ if(e.target.closest('[data-create]')){ const v=s?.value.trim(); if(v){ closePop(); opts.onCreate(v); } } }); }
  return el;
}
function statusMenu(anchor, current, onPick){ menu(anchor, statuses().map(s=>({label:s.name, color:s.color, on:s.id===current, action:()=>onPick(s.id)}))); }
function priorityMenu(anchor, current, onPick){ menu(anchor, [1,2,3,4,0].map(p=>({label:PRI[p].name, right:p?PRI[p].short:'', color:PRI[p].color, on:(current||0)===p, action:()=>onPick(p)}))); }
function projectMenu(anchor, current, onPick){
  const items=[{label:'Bez projektu (Skrzynka / kategoria)', icon:'i-inbox', on:!current, action:()=>onPick(null)}];
  Object.entries(AREAS).forEach(([k,a])=>{ const ps=sorted('projects').filter(p=>p.status!=='archived'&&(p.area||'work')===k); if(ps.length){ items.push({header:a.name}); projTree(ps).forEach(({p,depth})=>items.push({label:(depth?'↳ ':'')+p.name, kw:depth?pParent(p)?.name:'', color:p.color, on:p.id===current, action:()=>onPick(p.id)})); } });
  items.push({sep:true},{label:'Nowy projekt…', icon:'i-plus', action:()=>openProjectModal(null, p=>onPick(p.id))});
  menu(anchor, items, {search:true, placeholder:'Szukaj projektu…'});
}
function categoryMenu(anchor, current, onPick){
  const items=[{label:'Bez kategorii', on:!current, action:()=>onPick(null)}];
  Object.entries(AREAS).forEach(([k,a])=>{ items.push({header:a.name}); sorted('categories').filter(c=>c.area===k).forEach(c=>items.push({label:c.name, color:c.color, on:c.id===current, action:()=>onPick(c.id)})); });
  items.push({sep:true},{label:'Nowa kategoria…', icon:'i-plus', action:()=>openCategoryModal(null, c=>onPick(c.id))});
  menu(anchor, items, {search:true});
}
function peopleMulti(anchor, selected, onToggle, opts={}){
  /* one flat list, strictly alphabetical: Nazwisko Imię (department shown on the right) */
  const items=sorted('people').filter(p=>p.active!==false||selected.includes(p.id)).map(p=>{ const dn=(p.departmentIds||[]).map(d=>S.departments.get(d)?.name).filter(Boolean).sort(alpha).join(', ');
    return {label:personLabel(p), avatar:p.id, right:(r=>r.length>44?r.slice(0,43).replace(/[\s,·]+$/,'')+'…':r)([p.role,dn].filter(Boolean).join(' · ')), multi:true, on:selected.includes(p.id), action:on=>onToggle(p.id,on)}; });
  if(!items.length) items.push({label:'Brak pracowników — dodaj osobę', icon:'i-plus', action:()=>openPersonModal()});
  else items.push({sep:true},{label:'Dodaj pracownika…', icon:'i-plus', action:()=>openPersonModal()});
  menu(anchor, items, {search:true, placeholder:'Szukaj osoby…', onClose:opts.onClose});
}
function tagsMulti(anchor, selected, onToggle){
  const items=sorted('tags').map(t=>({label:t.name, color:t.color, multi:true, on:selected.includes(t.id), action:on=>onToggle(t.id,on)}));
  menu(anchor, items, {search:true, placeholder:'Szukaj lub utwórz tag (Enter)…', onCreate:name=>{ const t=createTag(name); onToggle(t.id,true); }, footer:`<div class="muted" style="font-size:11.5px;padding:6px 9px">Wpisz nową nazwę i naciśnij Enter, aby utworzyć tag.</div>`});
}
function createTag(name){ const ex=matchTag(name); if(ex) return ex; const t={id:uid(), name:name.replace(/^#/,''), color:PALETTE[(S.tags.size*5)%PALETTE.length], order:Date.now()}; put('tags',t); return t; }
function datePop(anchor, cur, curTime, onPick, opts={}){
  const T=today(); const sow=startOfWeek(T);
  const q=[['Dziś',T],['Jutro',addDays(T,1)],['Pojutrze',addDays(T,2)],['Ten piątek',addDays(sow,4)>T?addDays(sow,4):addDays(sow,11)],['Przyszły poniedziałek',addDays(sow,7)],['Za tydzień',addDays(T,7)],['Za miesiąc',addMonths(T,1)]];
  const html=`<div class="ph">${esc(opts.title||'Termin')}</div>${q.map(([l,d])=>`<button type="button" class="pi" data-d="${d}">${ico('i-cal')}<span>${l}</span><span class="r">${fmtDate(d,{abs:true})}</span></button>`).join('')}
   <hr><div style="display:flex;gap:6px;padding:6px"><input type="date" class="inp" id="dp-date" value="${esc(cur||'')}" style="flex:1"> ${opts.noTime?'':`<input type="time" class="inp" id="dp-time" value="${esc(curTime||'')}" style="width:96px">`}</div>
   <div style="display:flex;gap:6px;padding:0 6px 6px;justify-content:flex-end"><button type="button" class="btn sm ghost" data-clear>Bez terminu</button><button type="button" class="btn sm primary" data-ok>Ustaw</button></div>`;
  const el=openPop(anchor, html, {width:280});
  el.addEventListener('click', e=>{
    const b=e.target.closest('[data-d]'); const tm=el.querySelector('#dp-time');
    if(b){ closePop(); onPick(b.dataset.d, tm?tm.value:undefined); }
    if(e.target.closest('[data-clear]')){ closePop(); onPick(null, null); }
    if(e.target.closest('[data-ok]')){ const d=el.querySelector('#dp-date').value; closePop(); onPick(d||null, tm?tm.value:undefined); }
  });
}

let modalStack=[];
function openModal(html, opts={}){
  const w=document.createElement('div'); w.className='modal-wrap'; w.innerHTML=`<div class="modal ${opts.wide?'wide':''} ${opts.xwide?'xwide':''} ${opts.cls||''}" role="dialog" aria-modal="true">${html}</div>`;
  if(opts.before) w._before=opts.before;
  $('#modalHost').appendChild(w); modalStack.push(w);
  w.addEventListener('pointerdown', e=>{ if(e.target===w) w._down=true; });
  w.addEventListener('click', e=>{ if(e.target===w && w._down) closeModal(); w._down=false; if(e.target.closest('[data-close]')) closeModal(); });
  const f=w.querySelector('[autofocus]'); if(f) setTimeout(()=>f.focus(), 30);
  return w.querySelector('.modal');
}
function closeModal(force){ const w=modalStack[modalStack.length-1]; if(!w) return; if(!force && w._before && w._before()===false) return; modalStack.pop(); w.remove(); }
function confirmBox(title, text, okLabel, onOk, opts={}){
  const m=openModal(`<div class="modal-h"><h2>${esc(title)}</h2></div><div class="modal-b"><p style="margin:0;color:var(--fg-2)">${text}</p>${opts.typeWord?`<label style="display:block;margin-top:12px;font-size:12.5px">Wpisz <b>${esc(opts.typeWord)}</b>, aby potwierdzić<input class="inp" id="cf-word" style="width:100%;margin-top:6px" autocomplete="off"></label>`:''}</div><div class="modal-f"><button class="btn" type="button" data-close>Anuluj</button><button class="btn ${opts.danger?'danger solid':'primary'}" type="button" id="cf-ok" ${opts.typeWord?'disabled':''}>${esc(okLabel)}</button></div>`);
  if(opts.typeWord){ const i=m.querySelector('#cf-word'); i.focus(); i.addEventListener('input',()=>{ m.querySelector('#cf-ok').disabled = i.value.trim().toUpperCase()!==opts.typeWord; }); }
  m.querySelector('#cf-ok').addEventListener('click', ()=>{ closeModal(); onOk(); });
}
function swatchesHTML(cur, name='color'){ return `<div class="swatches" data-sw="${name}">${PALETTE.map(c=>`<button type="button" class="sw ${c===cur?'on':''}" style="background:${c}" data-c="${c}" aria-label="Kolor ${c}"></button>`).join('')}</div>`; }
function bindSwatches(m, onPick){ m.querySelectorAll('[data-sw]').forEach(box=>box.addEventListener('click', e=>{ const b=e.target.closest('[data-c]'); if(!b) return; box.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); b.classList.add('on'); onPick(b.dataset.c); })); }

function openProjectModal(id, after, preset={}){
  const p = id ? clone(S.projects.get(id)) : {id:uid(), name:'', code:'', color:PALETTE[(S.projects.size*3)%PALETTE.length], area: rp().kind==='area'?rp().id:'work', categoryId: rp().kind==='cat'?rp().id:null, clientId: rp().kind==='client'?rp().id:null, description:'', status:'active', prio:3, ownerId:null, members:[], start:today(), due:null, comments:[], notes:'', order:Date.now(), phases:[], phaseId:null, dependsOn:[], nextStep:'', parentId:null};
  if(!id){ Object.assign(p, preset); const par=p.parentId&&S.projects.get(p.parentId); if(par){ p.area=par.area||p.area; p.clientId=par.clientId||p.clientId; p.categoryId=par.categoryId||p.categoryId; p.members=[...(par.members||[])]; p.ownerId=par.ownerId||null; p.color=par.color||p.color; } }
  p.members=p.members||[]; p.dependsOn=(p.dependsOn||[]).filter(x=>S.projects.has(x)); let ph=clone(pPhases(p)); let cur=p.phaseId;
  const hasKids=id && pChildren(id,true).length>0;
  const parentOpts=()=>`<option value="">— brak (projekt główny) —</option>`+pRankSorted(sorted('projects').filter(x=>x.id!==p.id && !pParent(x) && x.status!=='archived')).map(x=>`<option value="${x.id}" ${x.id===p.parentId?'selected':''}>${esc(x.name)}</option>`).join('');
  const catOpts=area=>`<option value="">— bez kategorii —</option>`+sorted('categories').filter(c=>c.area===area).map(c=>`<option value="${c.id}" ${c.id===p.categoryId?'selected':''}>${esc(c.name)}</option>`).join('');
  const depLabel=()=>p.dependsOn.length?p.dependsOn.map(x=>S.projects.get(x)).filter(Boolean).map(x=>`<span class="chip-p sm" style="--sc:${PSTAT_META[pSt(x)].c}"><i></i>${esc(x.name)}</span>`).join(''):'<span class="muted">Nie zależy od innych projektów</span>';
  const m=openModal(`<div class="modal-h"><h2>${id?'Edytuj projekt':(p.parentId?'Nowy podprojekt':'Nowy projekt')}</h2><button class="icon-btn" type="button" data-close aria-label="Zamknij">${ico('i-x')}</button></div>
  <form class="modal-b form" id="pm-form">
    <label class="full">Nazwa projektu<input class="inp" id="pm-name" required value="${esc(p.name)}" placeholder="np. Moduł: regulaminy i oświadczenia dla klientów" autofocus></label>
    <label>Projekt nadrzędny<select class="inp" id="pm-parent" ${hasKids?'disabled title="Ten projekt ma podprojekty — nie może być podprojektem"':''}>${parentOpts()}</select></label>
    <label>Skrót / sygnatura<input class="inp" id="pm-code" value="${esc(p.code||'')}" placeholder="np. PORTAL-REG"></label>
    <label>Status<select class="inp" id="pm-status">${Object.entries(PSTAT).map(([k,l])=>`<option value="${k}" ${pSt(p)===k?'selected':''}>${l}</option>`).join('')}</select></label>
    <label>Priorytet projektu<select class="inp" id="pm-prio">${[1,2,3,4].map(k=>`<option value="${k}" ${pPrio(p)===k?'selected':''}>${PPRI[k].l}</option>`).join('')}</select></label>
    <div class="full pm-wait" id="pm-wait" ${p.status==='waiting'?'':'hidden'}><label>Na kogo / na co czekamy<input class="inp" id="pm-wfor" value="${esc(p.waitingFor||'')}" placeholder="np. opinia działu IT klienta"></label><label>Ponowić kontakt<input class="inp" type="date" id="pm-wfol" value="${esc(p.followUp||'')}"></label></div>
    <label>Klient<select class="inp" id="pm-client">${clientOptions(p.clientId||null)}</select></label>
    <label>Obszar<select class="inp" id="pm-area">${Object.entries(AREAS).map(([k,a])=>`<option value="${k}" ${p.area===k?'selected':''}>${a.name}</option>`).join('')}</select></label>
    <label>Kategoria<select class="inp" id="pm-cat">${catOpts(p.area)}</select></label>
    <label>Opiekun projektu<select class="inp" id="pm-owner"><option value="">— ja —</option>${sorted('people').map(x=>`<option value="${x.id}" ${x.id===p.ownerId?'selected':''}>${esc(personLabel(x))}</option>`).join('')}</select></label>
    <label>Start<input class="inp" type="date" id="pm-start" value="${esc(p.start||'')}"></label>
    <label>Termin zakończenia<input class="inp" type="date" id="pm-due" value="${esc(p.due||'')}"></label>
    <label>Zespół projektu<button type="button" class="inp" id="pm-members" style="text-align:left;display:flex;align-items:center;gap:6px">${p.members.length?avatars(sortPeopleIds(p.members),6)+` <span class="muted">${p.members.length}</span>`:'<span class="muted">Wybierz osoby…</span>'}</button></label>
    <label>Zależy od projektów<button type="button" class="inp" id="pm-deps" style="text-align:left;display:flex;align-items:center;gap:6px;flex-wrap:wrap;height:auto;min-height:38px">${depLabel()}</button></label>
    <div class="full pm-ph"><div class="flabel fsec">Etapy projektu <span class="muted" style="font-weight:500">— zaznacz bieżący</span></div><div id="pm-phases"></div></div>
    <label class="full">Gdzie jestem / następny krok<textarea class="inp" id="pm-next" rows="2" placeholder="Jedno zdanie: co jest następne?">${esc(p.nextStep||'')}</textarea></label>
    <label class="full">Opis<textarea class="inp" id="pm-desc" rows="3" placeholder="Cel, zakres, kluczowe ustalenia">${esc(p.description||'')}</textarea></label>
    <div class="full"><div style="font-size:12px;color:var(--fg-2);font-weight:500;margin-bottom:6px">Kolor</div>${swatchesHTML(p.color)}</div>

  <div class="modal-f">${id?`<button class="btn danger" type="button" id="pm-del" style="margin-right:auto">${ico('i-trash','s14')}Usuń</button>`:''}<button class="btn" type="button" data-close>Anuluj</button><button class="btn primary" type="button" id="pm-save">${id?'Zapisz':'Utwórz projekt'}</button></div>`);
  bindSwatches(m, c=>p.color=c);
  /* phases editor */
  const phBox=m.querySelector('#pm-phases');
  const readPh=()=>{ $$('.phr',phBox).forEach((r,i)=>{ if(!ph[i]) return; ph[i].name=r.querySelector('.ph-n').value; ph[i].start=r.querySelector('.ph-s').value||null; ph[i].due=r.querySelector('.ph-d').value||null; }); };
  const drawPh=()=>{
    if(!ph.find(z=>z.id===cur)) cur = (ph.find(z=>!z.done)||ph[0]||{}).id||null;
    phBox.innerHTML = (ph.length? ph.map((z,i)=>`<div class="phr ${z.id===cur?'cur':''}" data-i="${i}"><label class="ph-c" title="Bieżący etap"><input type="radio" name="pm-cur" value="${esc(z.id)}" ${z.id===cur?'checked':''}><span>${i+1}</span></label><input class="inp ph-n" value="${esc(z.name)}" placeholder="Nazwa etapu"><input class="inp ph-s" type="date" value="${esc(z.start||'')}" title="Początek etapu (opcjonalnie)"><input class="inp ph-d" type="date" value="${esc(z.due||'')}" title="Koniec etapu (opcjonalnie)"><span class="ph-b"><button type="button" class="icon-btn" data-ph="up" aria-label="Wyżej">${ico('i-chevu','s14')}</button><button type="button" class="icon-btn" data-ph="down" aria-label="Niżej">${ico('i-chevd','s14')}</button><button type="button" class="icon-btn" data-ph="del" aria-label="Usuń etap">${ico('i-x','s14')}</button></span></div>`).join('') : `<p class="muted" style="font-size:12.5px;margin:2px 0 8px">Wybierz szablon albo dodaj własne etapy:</p>`)
      + `<div class="ph-tools">${ph.length?'':Object.entries(PHASE_PRESETS).map(([k,v])=>`<button type="button" class="btn sm" data-ph="preset" data-k="${k}">${esc(v.l)}</button>`).join('')}<button type="button" class="btn sm" data-ph="add">${ico('i-plus','s14')}Etap</button></div>`;
  };
  drawPh();
  phBox.addEventListener('change', e=>{ if(e.target.name==='pm-cur'){ readPh(); cur=e.target.value; drawPh(); } });
  phBox.addEventListener('click', e=>{
    const b=e.target.closest('[data-ph]'); if(!b) return; readPh(); const i=+(b.closest('.phr')?.dataset.i ?? -1); const k=b.dataset.ph;
    if(k==='add'){ ph.push({id:uid(), name:'', start:null, due:null, done:false}); drawPh(); phBox.querySelector('.phr:last-of-type .ph-n')?.focus(); return; }
    if(k==='preset'){ ph=PHASE_PRESETS[b.dataset.k].list.map(n=>({id:uid(), name:n, start:null, due:null, done:false})); cur=ph[0].id; drawPh(); return; }
    if(k==='del'){ ph.splice(i,1); drawPh(); return; }
    if(k==='up'&&i>0){ [ph[i-1],ph[i]]=[ph[i],ph[i-1]]; drawPh(); return; }
    if(k==='down'&&i<ph.length-1){ [ph[i+1],ph[i]]=[ph[i],ph[i+1]]; drawPh(); return; }
  });
  m.querySelector('#pm-status').addEventListener('change', e=>{ m.querySelector('#pm-wait').hidden = e.target.value!=='waiting'; if(e.target.value==='waiting') m.querySelector('#pm-wfor').focus(); });
  m.querySelector('#pm-area').addEventListener('change', e=>{ p.area=e.target.value; p.categoryId=null; m.querySelector('#pm-cat').innerHTML=catOpts(p.area); });
  const mb=m.querySelector('#pm-members');
  mb.addEventListener('click', ()=>peopleMulti(mb, p.members, (pid,on)=>{ p.members = on? [...new Set([...p.members,pid])] : p.members.filter(x=>x!==pid); mb.innerHTML = p.members.length?avatars(sortPeopleIds(p.members),6)+` <span class="muted">${p.members.length}</span>`:'<span class="muted">Wybierz osoby…</span>'; }));
  const db=m.querySelector('#pm-deps');
  db.addEventListener('click', ()=>projectPicker(db, [p.id], p.dependsOn, (pid,on)=>{ p.dependsOn = on? [...new Set([...p.dependsOn,pid])] : p.dependsOn.filter(x=>x!==pid); db.innerHTML=depLabel(); }, {filter:x=>{ const seen=new Set(); const dep=q=>{ if(!q||seen.has(q.id)) return false; seen.add(q.id); return (q.dependsOn||[]).some(d=>d===p.id || dep(S.projects.get(d))); }; return !dep(x); }}));
  const save=()=>{
    const name=m.querySelector('#pm-name').value.trim(); if(!name){ m.querySelector('#pm-name').focus(); return; }
    readPh(); ph=ph.map(z=>({...z, name:z.name.trim()})).filter(z=>z.name);
    const ci=ph.findIndex(z=>z.id===cur); ph=ph.map((z,k)=>({...z, done: ci>=0 ? k<ci : !!z.done}));
    const status=m.querySelector('#pm-status').value;
    Object.assign(p, {name, code:m.querySelector('#pm-code').value.trim(), status, prio:+m.querySelector('#pm-prio').value, area:m.querySelector('#pm-area').value, categoryId:m.querySelector('#pm-cat').value||null, start:m.querySelector('#pm-start').value||null, due:m.querySelector('#pm-due').value||null, ownerId:m.querySelector('#pm-owner').value||null, description:m.querySelector('#pm-desc').value.trim(), clientId:m.querySelector('#pm-client').value||null,
      parentId: hasKids ? null : (m.querySelector('#pm-parent').value||null), phases:ph, phaseId: ci>=0 ? cur : (ph[0]?.id||null)});
    const nx=m.querySelector('#pm-next').value.trim(); if(nx!==(p.nextStep||'')){ p.nextStep=nx; p.nextStepAt=Date.now(); }
    if(status==='waiting'){ p.waitingFor=m.querySelector('#pm-wfor').value.trim(); p.followUp=m.querySelector('#pm-wfol').value||null; if(!p.waitingSince) p.waitingSince=today(); } else p.waitingSince=null;
    if(p.due && p.start && p.due<p.start){ m.querySelector('#pm-due').focus(); toast('Termin zakończenia jest przed startem'); return; }
    if(p.clientId) p.area='work';
    put('projects', p); closeModal();
    if(!id){ toast(`Utworzono projekt „${p.name}”`); if(after) after(p); else go('project:'+p.id); }
  };
  m.querySelector('#pm-save').addEventListener('click', save);
  m.querySelector('#pm-form').addEventListener('submit', e=>{ e.preventDefault(); save(); });
  m.querySelector('#pm-del')?.addEventListener('click', ()=>{
    const n=tasksArr().filter(t=>t.projectId===id).length;
    closeModal();
    confirmBox('Usunąć projekt?', `Projekt „${esc(p.name)}” zostanie usunięty. ${n?`Jego ${n} ${plural(n,'zadanie','zadania','zadań')} — wybierz, co z nimi zrobić.`:''}`, n?'Usuń projekt i zadania':'Usuń projekt', ()=>{
      const before=[...snapshotFor('projects',[id]), ...snapshotFor('tasks', tasksArr().filter(t=>t.projectId===id).map(t=>t.id))];
      deleteTasks(tasksArr().filter(t=>t.projectId===id).map(t=>t.id), {silent:true}); del('projects', id); pushUndo('usunięcie projektu', before);
      go('overview'); toast('Usunięto projekt', {action:'Cofnij', onAction:undoLast});
    }, {danger:true});
    if(n){ const f=$('.modal-f', modalStack[modalStack.length-1]); const b=document.createElement('button'); b.className='btn'; b.type='button'; b.textContent='Usuń projekt, zadania do Skrzynki'; b.addEventListener('click', ()=>{ closeModal(); const before=[...snapshotFor('projects',[id]), ...snapshotFor('tasks', tasksArr().filter(t=>t.projectId===id).map(t=>t.id))]; tasksArr().filter(t=>t.projectId===id).forEach(t=>upd('tasks',t.id,x=>{x.projectId=null;})); del('projects', id); pushUndo('usunięcie projektu', before); go('inbox'); toast('Projekt usunięty, zadania przeniesione', {action:'Cofnij', onAction:undoLast}); }); f.insertBefore(b, f.lastElementChild); }
  });
}
/* Nazwisko / Imię pair: live preview of the list label + swap button (fixes records entered in the wrong order) */
function bindNamePair(m, lastSel, firstSel, swapSel, prevSel){
  const L=m.querySelector(lastSel), F=m.querySelector(firstSel), P=prevSel&&m.querySelector(prevSel);
  const upd=()=>{ if(P) P.textContent=joinName(L.value,F.value)||'Nazwisko Imię'; };
  L.addEventListener('input',upd); F.addEventListener('input',upd);
  m.querySelector(swapSel)?.addEventListener('click', ()=>{ const a=L.value; L.value=F.value; F.value=a; upd(); L.focus(); });
}

const RECUR_OPTS=[['','Nie powtarza się',null],['daily','Codziennie',{freq:'daily',interval:1}],['weekdays','W dni robocze',{freq:'weekdays',interval:1}],['weekly','Co tydzień',{freq:'weekly',interval:1}],['weekly2','Co 2 tygodnie',{freq:'weekly',interval:2}],['monthly','Co miesiąc',{freq:'monthly',interval:1}],['monthly3','Co kwartał',{freq:'monthly',interval:3}],['yearly','Co rok',{freq:'yearly',interval:1}]];
const recurKey = r => { if(!r) return ''; const f=RECUR_OPTS.find(o=>o[2]&&o[2].freq===r.freq&&(o[2].interval||1)===(r.interval||1)); return f?f[0]:'__custom'; };

function projectOptions(cur){ let h=`<option value="">— bez projektu —</option>`; Object.entries(AREAS).forEach(([k,a])=>{ const ps=sorted('projects').filter(p=>p.status!=='archived'&&(p.area||'work')===k); if(ps.length) h+=`<optgroup label="${esc(a.name)}">${projTree(ps).map(({p,depth})=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${depth?'\u00a0\u00a0↳ ':''}${esc(p.name)}</option>`).join('')}</optgroup>`; }); return h; }
function categoryOptions(cur){ let h=`<option value="">— bez kategorii —</option>`; Object.entries(AREAS).forEach(([k,a])=>{ const cs=sorted('categories').filter(c=>c.area===k); if(cs.length) h+=`<optgroup label="${esc(a.name)}">${cs.map(c=>`<option value="${c.id}" ${c.id===cur?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`; }); return h; }

function reminderAt(kind, due, time, custom){
  if(kind==='custom') return custom||null;
  if(!due) return null;
  if(kind==='same9') return `${due}T09:00`;
  if(kind==='day1') return `${addDays(due,-1)}T09:00`;
  if(kind==='h1' && time){ const [h,mi]=time.split(':').map(Number); const dt=new Date(D(due).setHours(h,mi,0,0)-3600000); return `${ymd(dt)}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`; }
  return null;
}

function previewChips(r){
  const c=[];
  if(r.due) c.push(`<span class="pill soft">${ico('i-cal','s14')}${esc(fmtDate(r.due))}${r.time?' '+r.time:''}</span>`);
  if(r.recur) c.push(`<span class="pill soft">${ico('i-repeat','s14')}${esc(recurLabel(r.recur))}</span>`);
  if(r.priority) c.push(`<span class="pill soft"><span class="d" style="background:${PRI[r.priority].color}"></span>${PRI[r.priority].name}</span>`);
  if(r.project) c.push(`<span class="pill soft"><span class="d" style="background:${esc(S.projects.get(r.project).color)}"></span>${esc(S.projects.get(r.project).name)}</span>`);
  if(r.category) c.push(`<span class="pill soft"><span class="d" style="background:${esc(S.categories.get(r.category).color)}"></span>${esc(S.categories.get(r.category).name)}</span>`);
  sortPeopleIds(r.people).forEach(id=>c.push(`<span class="pill soft">${avatar(id)}${esc(personName(id))}</span>`));
  r.tags.forEach(id=>c.push(`<span class="pill soft">#${esc(S.tags.get(id).name)}</span>`));
  r.newTags.forEach(n=>c.push(`<span class="pill soft">#${esc(n)} <span class="muted">(nowy)</span></span>`));
  if(r.milestone) c.push(`<span class="pill" style="background:var(--brass-soft);color:var(--brass)">${ico('i-diamond','s14')}Kamień milowy</span>`);
  if(r.hard) c.push(`<span class="pill" style="background:var(--accent-soft);color:var(--accent)">${ico('i-gavel','s14')}Termin ustawowy</span>`);
  return c.join('');
}
function contextDefaults(){
  const {kind,id}=rp(); const d={};
  if(kind==='project'){ const p=S.projects.get(id); if(p){ d.projectId=p.id; d.area=p.area; d.categoryId=p.categoryId; if(p.clientId) d.clientId=p.clientId; } }
  if(kind==='client'){ const c=S.clients.get(id); if(c){ d.clientId=c.id; d.area='work'; if(c.ownerId) d.assignees=[c.ownerId]; } }
  if(kind==='cat'){ const c=S.categories.get(id); if(c){ d.categoryId=c.id; d.area=c.area; } }
  if(kind==='area') d.area=id;
  if(kind==='person') d.assignees=[id];
  if(kind==='dept') d.departmentId=id;
  if(kind==='tag') d.tags=[id];
  if(kind==='today') d.due=today();
  if(kind==='milestones') d.milestone=true;
  return d;
}
function createFromQuick(text, extra={}, opts={}){
  const r=parseQuick(text);
  const d={...(opts.noContext?{}:contextDefaults()), ...extra};
  const tags=[...new Set([...(d.tags||[]), ...r.tags, ...r.newTags.map(n=>createTag(n).id)])];
  const proj=r.project?S.projects.get(r.project):(d.projectId?S.projects.get(d.projectId):null);
  const cat=r.category?S.categories.get(r.category):null;
  const fields={
    title: r.title || text.trim(),
    projectId: proj?proj.id:null,
    categoryId: cat?cat.id : (proj?.categoryId || d.categoryId || null),
    area: cat?cat.area : (proj?.area || d.area || 'work'),
    due: r.due || d.due || null, dueTime: r.time || null,
    priority: r.priority ?? 0, tags, milestone: r.milestone || !!d.milestone, hard: r.hard, recur: r.recur,
    assignees: [...new Set([...(d.assignees||[]), ...r.people])], departmentId: d.departmentId||null,
    parentId: d.parentId||null, clientId: r.client || d.clientId || proj?.clientId || null, due: r.due || d.due || null
  };
  if(fields.hard && !fields.priority) fields.priority=1;
  return newTask(fields);
}

const EDIT_FIELDS=['phaseId','title','notes','clientId','pinned','blockedBy','waitingFor','status','priority','due','dueTime','hard','start','recur','assignees','departmentId','area','projectId','categoryId','tags','milestone','estimate','reminders','links'];
const FIELD_PL={phaseId:'etap',title:'tytuł',notes:'notatki',clientId:'klient',pinned:'przypięcie',blockedBy:'zależności',waitingFor:'oczekuje na',status:'status',priority:'priorytet',due:'termin',dueTime:'godzina',hard:'termin ustawowy',start:'start',recur:'powtarzanie',assignees:'osoby',departmentId:'dział',area:'obszar',projectId:'projekt',categoryId:'kategoria',tags:'tagi',milestone:'kamień milowy',estimate:'szacowany czas',reminders:'przypomnienia',links:'linki'};
UI.patch={};
const storedTask = () => S.tasks.get(UI.openTask);
const viewTask = () => { const t=storedTask(); return t ? {...t, ...clone(UI.patch)} : null; };
const isDirty = () => Object.keys(UI.patch).length>0;
function prunePatch(){ const t=storedTask(); if(!t){ UI.patch={}; return; } for(const k of Object.keys(UI.patch)) if(same(t[k], UI.patch[k])) delete UI.patch[k]; }
function setPatch(obj, rerender=true){
  const t=storedTask(); if(!t) return;
  for(const [k,v] of Object.entries(obj)){ if(k==='reminders' && !('reminders' in UI.patch)) UI.patchOrig={tid:t.id, reminders:clone(t.reminders||[])}; if(same(t[k], v)) delete UI.patch[k]; else UI.patch[k]=clone(v); }
  if(rerender) renderDetail(); else updateDirty();
}
function patchWith(fn){ const cur=viewTask(); if(!cur) return; const v=clone(cur); fn(v); const o={}; EDIT_FIELDS.forEach(k=>{ if(!same(v[k], cur[k])) o[k]=v[k]; }); setPatch(o); }
function describeChange(k, v){
  const nm=(coll,id)=>id?(S[coll].get(id)?.name||'—'):'brak';
  switch(k){
    case 'title': return `tytuł „${v}”`;
    case 'status': return `status: ${statusById(v).name}`;
    case 'priority': return `priorytet: ${PRI[v||0].name}`;
    case 'due': return `termin: ${v?fmtNum(v):'brak'}`;
    case 'dueTime': return `godzina: ${v||'brak'}`;
    case 'start': return `start: ${v?fmtNum(v):'brak'}`;
    case 'hard': return v?'termin ustawowy':'bez terminu ustawowego';
    case 'milestone': return v?'kamień milowy':'bez kamienia milowego';
    case 'recur': return `powtarzanie: ${recurLabel(v)||'brak'}`;
    case 'assignees': return `osoby: ${sortPeopleIds(v||[]).map(personName).join(', ')||'brak'}`;
    case 'projectId': return `projekt: ${nm('projects',v)}`;
    case 'clientId': return `klient: ${v?clientName(v):'brak'}`;
    case 'categoryId': return `kategoria: ${nm('categories',v)}`;
    case 'departmentId': return `dział: ${nm('departments',v)}`;
    case 'area': return `obszar: ${AREAS[v]?.name||v}`;
    case 'tags': return `tagi: ${(v||[]).map(id=>S.tags.get(id)?.name).filter(Boolean).join(', ')||'brak'}`;
    case 'estimate': return `szacowany czas: ${fmtDur(v)||'brak'}`;
    default: return FIELD_PL[k]||k;

function commitDetail(){
  const id=UI.openTask; const t=storedTask(); if(!t || !isDirty()) return false;
  const p=clone(UI.patch); UI.patch={};
  if('title' in p){ p.title=String(p.title).replace(/\s+/g,' ').trim(); if(!p.title) delete p.title; }
  if(Array.isArray(p.reminders)){ const st=t.reminders||[]; const byId=new Map(st.map(r=>[r.id,r])); const orig=new Set(((UI.patchOrig?.tid===id && UI.patchOrig.reminders) || st).map(r=>r.id));
    p.reminders=p.reminders.map(r=>byId.get(r.id)?.fired && !r.fired ? {...r, fired:true} : r).concat(st.filter(r=>!orig.has(r.id) && !p.reminders.some(x=>x.id===r.id))); }
  { const rc=('recur' in p)?p.recur:t.recur; if('due' in p && rc && !rc.workday){ p.recurBase=null; } }   // obowiązek ustawowy: bez zmiany dnia bazowego
  const ids=[id, ...descendants(id).map(x=>x.id)];
  const before=snapshotFor('tasks', ids);
  if('projectId' in p){ descendants(id).forEach(d=>upd('tasks', d.id, x=>{ x.projectId=p.projectId||null; const pr=p.projectId&&S.projects.get(p.projectId); if(pr) x.area=pr.area||x.area; })); }
  const closingRecurring = ('status' in p) && statusById(p.status).type==='done' && !isClosed(t) && (('recur' in p) ? p.recur : t.recur);
  if(closingRecurring) delete p.status;
  if(Object.keys(p).length){
    upd('tasks', id, x=>{
      if('status' in p){ const ty=statusById(p.status).type; if(ty==='done'||ty==='cancelled'){ if(!isClosed(x)){ x.prevStatus=x.status; x.completedAt=Date.now(); } } else x.completedAt=null; }
      if('projectId' in p && x.parentId){ const par=S.tasks.get(x.parentId); if(par && par.projectId!==(p.projectId||null)) x.parentId=null; }
      if('due' in p && !p.due) p.dueTime=null;
      if(p.recurBase===null){ delete p.recurBase; delete x.recurBase; if(x.recur && x.recur.day && p.due) x.recur.day=D(p.due).getDate(); }
      Object.assign(x, p);
      logH(x, 'Zapisano: '+Object.keys(p).filter(k=>k!=='notes'&&k!=='reminders'&&k!=='links').map(k=>describeChange(k,p[k])).concat(['notes','reminders','links'].filter(k=>k in p).map(k=>FIELD_PL[k])).join('; '));
    });
  }
  if(closingRecurring) toggleDone(id);
  pushUndo('edycję zadania', before);
  toast('Zapisano zmiany', {action:'Cofnij', onAction:undoLast});
  return true;
}

   DRAG & DROP  (pointer-based: mouse drags rows, touch drags the grip)
   ===================================================================== */
const DnD={pending:null, active:null, just:false};
document.addEventListener('pointerdown', e=>{
  if(e.button!==0) return;
  const src=e.target.closest('[data-drag]'); if(!src) return;
  const onGrip=!!e.target.closest('.grip');
  const isMouse=e.pointerType==='mouse';
  if(!isMouse && !onGrip && !src.classList.contains('cev')) return;
  if(!onGrip && e.target.closest('button,input,textarea,select,a,label')) return;
  DnD.pending={src, spec:src.dataset.drag, x:e.clientX, y:e.clientY, touch:!isMouse};
  if(onGrip) e.preventDefault();
});
document.addEventListener('pointermove', e=>{
  if(DnD.pending && !DnD.active){
    const dx=e.clientX-DnD.pending.x, dy=e.clientY-DnD.pending.y;
    if(Math.hypot(dx,dy)>6) startDrag(e);
  }
  if(DnD.active){ e.preventDefault(); moveDrag(e.clientX, e.clientY); }
}, {passive:false});
document.addEventListener('pointerup', e=>{ if(DnD.active) endDrag(true); DnD.pending=null; });
document.addEventListener('pointercancel', ()=>{ if(DnD.active) endDrag(false); DnD.pending=null; });
document.addEventListener('click', e=>{ if(DnD.just){ e.stopPropagation(); e.preventDefault(); DnD.just=false; } }, true);
function startDrag(e){
  const p=DnD.pending; DnD.pending=null;

  p.src.classList.add('drag-src'); document.body.classList.add('dragging');
  DnD.active={...p, ghost:g, target:null, before:false, line:null, hot:null};
  DnD.fromGroup = p.src.dataset.group || (p.src.closest('[data-drop^="group:"]')?.dataset.drop.split(':').slice(2).join(':')) || null;

function dropMode(spec, dst){

    if(['group','cal','nav','quad'].includes(dk[0])) return 'hot';
    return null;
  }
  if(sk==='proj') return dk[0]==='nav' && dk[1]==='proj' ? 'line' : null;
  if(sk==='pf'){ if(dk[0]==='pfrow') return dk[1]===spec.split(':')[1] ? null : 'line'; if(dk[0]==='pfcol') return 'hot'; return null; }
  if(sk==='cat') return dk[0]==='nav' && dk[1]==='cat' ? 'line' : null;
  if(sk==='person') return dk[0]==='row' && dk[1]==='person' ? 'line' : null;
  if(sk==='dept') return dk[0]==='row' && dk[1]==='dept' ? 'line' : null;
  if(sk==='status') return dk[0]==='row' && dk[1]==='status' ? 'line' : null;

function moveDrag(x,y){
  const a=DnD.active; a.lx=x; a.ly=y;
  a.ghost.style.left=(x+14)+'px'; a.ghost.style.top=(y+10)+'px';
  const under=document.elementFromPoint(x,y);
  let t=under && under.closest('[data-drop]');
  // board column / calendar: prefer the row when hovering a card
  let mode=t?dropMode(a.spec, t.dataset.drop):null;
  if(t && !mode){ const outer=t.parentElement && t.parentElement.closest('[data-drop]'); if(outer){ const m2=dropMode(a.spec, outer.dataset.drop); if(m2){ t=outer; mode=m2; } } }
  if(a.hot){ a.hot.classList.remove('drop-hot'); a.hot=null; }
  if(a.line){ a.line.remove(); a.line=null; }
  a.target=mode?t:null; a.mode=mode;
  if(!mode) return;
  if(mode==='hot'){ t.classList.add('drop-hot'); a.hot=t; }

    const r=t.getBoundingClientRect(); a.before = y < r.top + r.height/2;

    document.body.appendChild(ln); a.line=ln;
  }
}
function autoScroll(){
  const a=DnD.active; if(!a) return;
  const under=document.elementFromPoint(a.lx||0, a.ly||0);
  const conts=[];
  let n=under; while(n && n!==document.body){ if(n.scrollHeight>n.clientHeight+2 || n.scrollWidth>n.clientWidth+2){ const cs=getComputedStyle(n); if(/(auto|scroll)/.test(cs.overflowY+cs.overflowX)) conts.push(n); } n=n.parentElement; }
  conts.forEach(c=>{ const r=c.getBoundingClientRect(); const e=50, sp=14;
    if(a.ly<r.top+e) c.scrollTop-=sp; else if(a.ly>r.bottom-e) c.scrollTop+=sp;
    if(a.lx<r.left+e) c.scrollLeft-=sp; else if(a.lx>r.right-e) c.scrollLeft+=sp; });

}
function endDrag(commit){

function midOrder(list, movedId, targetId, before){
  const arr=list.filter(x=>x.id!==movedId); const i=arr.findIndex(x=>x.id===targetId); if(i<0) return Date.now();
  const tgt=arr[i];
  if(before){ const prev=arr[i-1]; return prev ? ((prev.order??0)+(tgt.order??0))/2 : (tgt.order??0)-1024; }
  const next=arr[i+1]; return next ? ((tgt.order??0)+(next.order??0))/2 : (tgt.order??0)+1024;
}
function reorderColl(coll, movedId, targetId, before){ const list=sorted(coll); const o=midOrder(list, movedId, targetId, before); upd(coll, movedId, x=>{x.order=o;}); }
function handleDrop(spec, dst, before, el){
  const s=spec.split(':'); const d=dst.split(':');

    const id=s[1]; const t=S.tasks.get(id); if(!t) return;
    let ids=UI.selected.has(id)&&UI.selected.size>1 ? [...UI.selected] : [id];
    if(d[0]==='row' && d[1]==='task'){

      const grp=el.dataset.group; const by=v?.layout==='board'? v.boardBy : v?.group;
      const siblings=sortTasks(tasksArr().filter(x=>(x.parentId||'')===(tgt.parentId||'')), 'manual');
      const o=midOrder(siblings, id, tgt.id, before);
      const before0=snapshotFor('tasks',[id]);
      const regroup = v && (v.layout==='list'||v.layout==='board') && grp && by && by!=='none' && !String(grp).startsWith('sub:') && el.closest('#content') && grp!==DnD.fromGroup;
      const closeRec = regroup && by==='status' && statusById(grp).type==='done' && t.recur && !isClosed(t);   // a recurring task moves to its next occurrence instead of ending the series
      const np = tgt.parentId||null; const loop = !!np && (np===id || descendants(id).some(x=>x.id===np));      // a task cannot become a subtask of its own subtask

      pushUndo('przesunięcie', before0);
      return;
    }
    if(d[0]==='group'){
      const by=d[1], val=d.slice(2).join(':');
