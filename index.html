      const fromG=DnD.fromGroup;
      if(by==='status' && statusById(val).type==='done'){ const rec=ids.filter(tid=>S.tasks.get(tid)?.recur && !isClosed(S.tasks.get(tid))); rec.forEach(tid=>completeRecurring(tid)); ids=ids.filter(tid=>!rec.includes(tid)); if(!ids.length) return; }
      ids.forEach(tid=>upd('tasks', tid, x=>applyGroupValue(x, by, val, fromG)));
      pushUndo('zmianę', before0); toast('Zaktualizowano', {action:'Cofnij', onAction:undoLast});
      return;
    }
    if(d[0]==='cal'){ const date=d[1]; const b=snapshotFor('tasks',ids); ids.forEach(tid=>setDue(tid, date)); UI.calSel=date; pushUndo('zmianę terminu', b); toast(`Termin: ${fmtDate(date)}`, {action:'Cofnij', onAction:undoLast}); return; }
    if(d[0]==='quad'){
      const q=+d[1]; const b=snapshotFor('tasks',ids); const T=today();
      ids.forEach(tid=>upd('tasks', tid, x=>{ const imp=q===1||q===2, urg=q===1||q===3; const wasImp=x.priority===1||x.priority===2; const wasUrg=x.due&&diffDays(T,x.due)<=2;
        if(imp&&!wasImp) x.priority=2; if(!imp&&wasImp) x.priority=3;

    }
    if(d[0]==='nav'){
      if(d[1]==='proj'){ ids.forEach(tid=>moveToProject(tid, d[2])); return; }
      if(d[1]==='inbox'){ const b=snapshotFor('tasks',ids); ids.forEach(tid=>upd('tasks',tid,x=>{x.projectId=null;x.categoryId=null;})); pushUndo('przeniesienie',b); toast('Przeniesiono do Skrzynki',{action:'Cofnij',onAction:undoLast}); return; }
      if(d[1]==='today'){ const b=snapshotFor('tasks',ids); ids.forEach(tid=>setDue(tid, today())); pushUndo('zmianę terminu',b); toast('Termin: dziś',{action:'Cofnij',onAction:undoLast}); return; }
      if(d[1]==='person'){ ids.forEach(tid=>assign(tid, d[2], 'add')); toast(`Przydzielono: ${personName(d[2])}`); return; }
      if(d[1]==='cat'){ const c=S.categories.get(d[2]); const b=snapshotFor('tasks',ids); ids.forEach(tid=>upd('tasks',tid,x=>{x.categoryId=c.id; if(!x.projectId) x.area=c.area;})); pushUndo('zmianę kategorii',b); toast(`Kategoria: ${c.name}`,{action:'Cofnij',onAction:undoLast}); return; }
      if(d[1]==='area'){ const b=snapshotFor('tasks',ids); ids.forEach(tid=>upd('tasks',tid,x=>{ x.area=d[2]; const c=x.categoryId&&S.categories.get(x.categoryId); if(c&&c.area!==d[2]) x.categoryId=null; })); pushUndo('zmianę obszaru',b); toast(`Obszar: ${AREAS[d[2]].name}`,{action:'Cofnij',onAction:undoLast}); return; }

  if(s[0]==='proj') return reorderColl('projects', s[1], d[2], before);
  if(s[0]==='cat') return reorderColl('categories', s[1], d[2], before);
  if(s[0]==='person') return reorderColl('people', s[1], d[2], before);
  if(s[0]==='dept') return reorderColl('departments', s[1], d[2], before);
  if(s[0]==='status') return reorderColl('statuses', s[1], d[2], before);

  }
}

function convertToProject(id){
  const t=S.tasks.get(id); if(!t) return;
  const p={id:uid(), name:t.title, code:'', color:PALETTE[(S.projects.size*3)%PALETTE.length], area:taskArea(t), categoryId:t.categoryId, description:t.notes||'', status:'active', ownerId:t.assignees?.[0]||null, members:t.assignees||[], start:t.start||today(), due:t.due, comments:t.comments||[], notes:'', order:Date.now()};
  put('projects', p);
  childrenOf(id).forEach(c=>upd('tasks', c.id, x=>{ x.parentId=null; x.projectId=p.id; x.area=p.area; }));
  deleteTasks([id],{silent:true}); closeDetail(true); go('project:'+p.id); toast(`Utworzono projekt „${p.name}” z podzadań (zadanie źródłowe w koszu)`);
}
function bulkOp(anchor, op){
  const ids=[...UI.selected].filter(id=>S.tasks.has(id)); if(!ids.length) return;
  const b=()=>{ pushUndo('zmianę zbiorczą', snapshotFor('tasks', [...new Set([...ids, ...ids.flatMap(id=>descendants(id).map(x=>x.id))])])); undoMute++; setTimeout(()=>{ undoMute=Math.max(0,undoMute-1); }, 0); };   // the bulk action is one undo step
  const done=msg=>{ toast(msg, {action:'Cofnij', onAction:undoLast}); };
  if(op==='clear'){ UI.selected.clear(); UI.select=false; render(); return; }
  if(op==='done'){ b(); ids.filter(id=>S.tasks.get(id).recur && !isClosed(S.tasks.get(id))).forEach(id=>completeRecurring(id,{silent:true})); ids.forEach(id=>{ if(!isClosed(S.tasks.get(id)) && !S.tasks.get(id).recur) upd('tasks',id,x=>{ x.prevStatus=x.status; x.status=firstStatusOfType('done'); x.completedAt=Date.now(); logH(x,'Zakończono (zbiorczo)'); }); }); done(`Zakończono ${ids.length}`); UI.selected.clear(); return; }
  if(op==='status') return statusMenu(anchor, null, s=>{ b(); ids.forEach(id=>setStatus(id,s)); done('Zmieniono status'); });
  if(op==='priority') return priorityMenu(anchor, null, p=>{ b(); ids.forEach(id=>upd('tasks',id,x=>{x.priority=p;})); done('Zmieniono priorytet'); });
  if(op==='due') return datePop(anchor, null, null, (d,tm)=>{ b(); ids.forEach(id=>setDue(id,d,tm)); done('Zmieniono termin'); });
  if(op==='client') return menu(anchor, [{label:'Bez klienta', action:()=>{ b(); ids.forEach(id=>upd('tasks',id,x=>{x.clientId=null;})); done('Usunięto klienta'); }}, ...sorted('clients').filter(c=>c.active!==false).map(c=>({label:c.name, color:c.color, action:()=>{ b(); ids.forEach(id=>upd('tasks',id,x=>{ x.clientId=c.id; x.area='work'; })); done(`Klient: ${clientLabel(c)}`); }}))], {search:true});
  if(op==='project') return projectMenu(anchor, null, pid=>{ b(); ids.forEach(id=>upd('tasks',id,x=>{ x.projectId=pid; const p=pid&&S.projects.get(pid); if(p){ x.area=p.area; if(p.categoryId) x.categoryId=p.categoryId; } })); done('Przeniesiono'); });
  if(op==='assign') return peopleMulti(anchor, [], (pid,on)=>{ ids.forEach(id=>assign(id,pid,on?'add':'remove')); });
  if(op==='tag') return tagsMulti(anchor, [], (tid,on)=>{ ids.forEach(id=>upd('tasks',id,x=>{ x.tags= on? [...new Set([...(x.tags||[]),tid])] : (x.tags||[]).filter(z=>z!==tid); })); });
  if(op==='delete') return confirmBox('Przenieść do kosza?', `${ids.length} ${plural(ids.length,'zadanie','zadania','zadań')} (wraz z podzadaniami) trafi do kosza. Przez 30 dni możesz je przywrócić.`, 'Przenieś do kosza', ()=>{ deleteTasks(ids); UI.selected.clear(); }, {danger:true});
}

/* keyboard shortcuts */
document.addEventListener('keydown', e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='s' || (e.key==='Enter' && e.target.closest && e.target.closest('#detail') && !e.target.closest('[data-comment-form]'))) && UI.openTask && !modalStack.length){ e.preventDefault(); saveDetail(true); return; }
  if(e.key==='Escape'){
    if(DnD.active){ endDrag(false); return; }
    if(popState){ closePop(); return; }
    if(modalStack.length){ closeModal(); return; }
    if(typing){ document.activeElement.blur(); return; }
    if(UI.openTask){ closeDetail(); return; }
    if(UI.select){ UI.select=false; UI.selected.clear(); render(); return; }
    closeSidebar(); return;

function checkReminders(){
  if(!S.ready) return;
  const now=nowLocalISO(); const due=[];
  for(const t of S.tasks.values()){ if(t.deletedAt || isClosed(t)) continue; for(const r of (t.reminders||[])) if(!r.fired && r.at<=now) due.push([t,r]); }
  if(!due.length) return;
  due.forEach(([t,r])=>queueReminder(t,r));
  const byTask=new Map(); due.forEach(([t,r])=>{ (byTask.get(t.id)||byTask.set(t.id,[]).get(t.id)).push(r.id); });
  byTask.forEach((rids,tid)=>upd('tasks', tid, x=>{ x.reminders=(x.reminders||[]).map(r=>rids.includes(r.id)?{...r, fired:true}:r); }));
}
/* v1.5: reminders live in their own tray (not among toasts). The tray can be collapsed to a small bell,
   collapses itself while a task or a form is being edited and never covers the detail panel on a computer. */

function queueReminder(t, r){
  if(UI.rems.some(x=>x.rid===r.id)) return;

}

  const r={id:uid(), at, fired:false, snooze:true};
  upd('tasks', item.tid, x=>{ x.reminders=[...(x.reminders||[]), r]; });
  if(UI.openTask===item.tid && UI.patch && Array.isArray(UI.patch.reminders)) UI.patch.reminders=[...UI.patch.reminders, clone(r)];
  return at;
}

async function saveFile(filename, data, label){
  let dl=null; try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){}
  if(dl){
    try{ await dl.save({filename, data}); toast(`Zapisano: ${filename}`); return true; }
    catch(e){ if(e&&e.code==='declined') { toast('Zapis anulowany.'); return false; } if(e&&e.code==='rate_limited'){ toast('Okno zapisu jest już otwarte — dokończ je lub spróbuj za chwilę.'); return false; } }
  }
  // outside Claude (server edition): a normal browser download
  if(!window.claude){ try{ const url=URL.createObjectURL(new Blob([data], {type: /\.csv$/i.test(filename)?'text/csv;charset=utf-8':'application/json'})); const a=document.createElement('a'); a.href=url; a.download=filename; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); toast(`Zapisano: ${filename}`); return true; }catch(e){} }
  // fallback: show the content so it can be copied
  const m=openModal(`<div class="modal-h"><h2>${esc(label||filename)}</h2><button class="icon-btn" type="button" data-close aria-label="Zamknij">${ico('i-x')}</button></div><div class="modal-b"><p style="margin:0 0 8px;color:var(--fg-2);font-size:13px">Pobieranie plików nie jest dostępne w tym widoku. Skopiuj zawartość i zapisz ją jako <b class="mono">${esc(filename)}</b>.</p><textarea class="inp" style="width:100%;height:260px;font-family:var(--f-mono);font-size:11.5px" readonly id="fb-ta">${esc(typeof data==='string'?data:'')}</textarea></div><div class="modal-f"><button class="btn primary" type="button" id="fb-copy">${ico('i-copy','s14')}Kopiuj</button></div>`);
  $('#fb-copy',m).addEventListener('click', ()=>{ const ta=$('#fb-ta',m); navigator.clipboard?.writeText(ta.value).then(()=>toast('Skopiowano do schowka'), ()=>{ ta.select(); toast('Zaznaczono — naciśnij Ctrl+C'); }) || (ta.select()); });
  return false;
}

/* =====================================================================
   v2.0 — SERWEROWA WOKANDA: SEJF SZYFROWANY W PRZEGLĄDARCE (zero-knowledge)
   ---------------------------------------------------------------------
   Hasło główne → PBKDF2-SHA256 (600 000 iteracji) → klucz główny (tylko w pamięci przeglądarki)
     ├─ HKDF "auth"  → dowód logowania (serwer trzyma z niego tylko password_hash)
     └─ HKDF "enc"   → szyfruje klucz prywatny konta (ECDH P-256)
   Klucz prywatny konta odpakowuje klucz sejfu (AES-256, osobno zapakowany dla każdej osoby — gotowe na pracowników).
   Klucz sejfu → HKDF: klucz rekordów (AES-256-GCM) + klucz identyfikatorów (HMAC-SHA256).
   Na serwer trafia: rid (HMAC z kolekcji i id), wersja, szyfrogram {kolekcja, id, dokument} związany z rid (AAD).
   Klucz odzyskiwania (32 losowe bajty) — druga, niezależna kopia klucza prywatnego.
   Zaufane urządzenie: klucze zapakowane PIN-em i nieeksportowalnym kluczem urządzenia (IndexedDB), ważne 30 dni.
   ===================================================================== */
const WK_EDITION = 'server';               // 'server' w wersji na GitHub Pages (tools/build.sh)
const WK_API_DEFAULT = '';                 // adres serwera danych — uzupełniany przy budowie wersji serwerowej
const KDF_ITER = 600000, KDF_MIN = 600000, KDF_MAX = 5000000, PIN_ITER = 310000, TRUST_DAYS = 30, PIN_TRIES = 5;
/* v2.1: parametry wyprowadzania klucza przychodzą z serwera — przeglądarka przyjmuje tylko bezpieczne.
   Zmodyfikowany serwer mógłby podać np. 1 iterację, żeby z przesłanego dowodu logowania tanio odgadnąć hasło. */
function kdfCheck(k){
  const bad = !k || k.alg!=='PBKDF2-SHA256' || !Number.isInteger(k.iter) || k.iter<KDF_MIN || k.iter>KDF_MAX || typeof k.salt!=='string' || !/^[A-Za-z0-9+/]{22}==$|^[A-Za-z0-9+/]{43}=$/.test(k.salt);
  if(bad){ const e=new Error('Serwer podał niebezpieczne parametry klucza — logowanie zostało przerwane dla Twojego bezpieczeństwa. Hasło nie zostało użyte. Sprawdź, czy łączysz się z właściwym serwerem.'); e.code='kdf'; throw e; }
  return k;
}
/* v2.1: polityka hasła głównego i hasła kopii: 4+ słowa (20+ znaków) albo 14+ znaków o zróżnicowanej budowie */
function pwPolicy(p){
  p=String(p||''); const msg='Hasło jest za słabe. Najlepiej 4–6 przypadkowych, różnych słów oddzielonych spacjami (min. 20 znaków), np. „komoda wiosło pieprz latarnia”, albo min. 14 znaków zawierających małe i wielkie litery, cyfry i znaki specjalne — bez popularnych haseł i ciągów typu „1234” czy „qwerty”.';
  const low=norm(p);
  const common=/(passw|haslo|qwert|asdf|zaq1|zaq!|1qaz|abcd|12345|54321|11111|00000|admin|wokand|regatio|kancelar|letmein|welcome|iloveyou|polska1)/;
  const words=p.trim().split(/\s+/).filter(w=>w.length>=3);
  if(words.length>=4 && p.length>=20){
    const real=words.filter(w=>/\p{L}/u.test(w) && !/^(.)\1+$/u.test(w) && !/^(.{1,3})\1+$/u.test(w));          // words made of letters, not "aaa" / "abab"
    const distinct=new Set(real.map(w=>norm(w)));
    const seq=['raz','dwa','trzy','cztery','piec','szesc','siedem','osiem','jeden','one','two','three','four','five','six'];
    if(distinct.size>=4 && [...distinct].filter(w=>seq.includes(w)).length<3 && !common.test(low.replace(/\s+/g,''))) return null;
    return msg;
  }
  const cls=[/\p{Ll}/u,/\p{Lu}/u,/\d/,/[^\p{L}\d\s]/u].filter(r=>r.test(p)).length;
  if(p.length>=14 && cls===4 && !/(.)\1\1/.test(p) && !common.test(low) && new Set(p).size>=9) return null;
  return msg; }
const TE = new TextEncoder(), TD = new TextDecoder();
const SRV = { api:'', token:null, user:null, space:'main', K:null, raw:null, cursor:0, vers:new Map(), rids:new Map(), pend:new Map(), inflight:new Set(),
  stamps:new Map(), flushT:null, pollT:null, lastAct:Date.now(), online:true, err:null, tampered:0, idb:null };

/* ---------- byte helpers ---------- */
const b64e = u8 => { let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexe = u8 => [...u8].map(x=>x.toString(16).padStart(2,'0')).join('');
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const B32 = 'ABCDEFGHJKMNPQRSTVWXYZ0123456789';   // bez I, L, O, U — czytelne do przepisania
function recEncode(u8){ let bits='', out=''; u8.forEach(b=>bits+=b.toString(2).padStart(8,'0')); for(let i=0;i<bits.length;i+=5) out+=B32[parseInt(bits.slice(i,i+5).padEnd(5,'0'),2)]; return out.match(/.{1,4}/g).join('-'); }
function recDecode(s){ const c=String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1'); let bits=''; for(const ch of c){ const v=B32.indexOf(ch); if(v<0) return null; bits+=v.toString(2).padStart(5,'0'); } if(bits.length<256) return null; const u=new Uint8Array(32); for(let i=0;i<32;i++) u[i]=parseInt(bits.slice(i*8,i*8+8),2); return u; }

/* ---------- crypto primitives (WebCrypto) ---------- */
async function pbkdf2(secret, saltB64, iter){ const base=await crypto.subtle.importKey('raw', TE.encode(String(secret).normalize('NFKC')), 'PBKDF2', false, ['deriveBits']); return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64d(saltB64), iterations:iter}, base, 256)); }
async function hkdf(ikm, info, len=32){ const k=await crypto.subtle.importKey('raw', ikm, 'HKDF', false, ['deriveBits']); return new Uint8Array(await crypto.subtle.deriveBits({name:'HKDF', hash:'SHA-256', salt:new Uint8Array(32), info:TE.encode(info)}, k, len*8)); }
const aesKey = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
async function seal(key, u8, aad){ const iv=rnd(12); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:TE.encode(aad||'')}, key, u8)); const o=new Uint8Array(12+ct.length); o.set(iv); o.set(ct,12); return b64e(o); }
async function unseal(key, b64, aad){ const a=b64d(b64); return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:a.slice(0,12), additionalData:TE.encode(aad||'')}, key, a.slice(12))); }
async function pwKeys(password, kdf){ const m=await pbkdf2(password, kdf.salt, kdf.iter); return {auth:hexe(await hkdf(m,'wokanda/auth/v1')), enc:await aesKey(await hkdf(m,'wokanda/enc/v1'))}; }
async function recKeys(rec){ return {auth:hexe(await hkdf(rec,'wokanda/rec-auth/v1')), enc:await aesKey(await hkdf(rec,'wokanda/rec-enc/v1'))}; }
async function wrapFor(pubB64, raw, space){
  const pub=await crypto.subtle.importKey('spki', b64d(pubB64), {name:'ECDH', namedCurve:'P-256'}, false, []);
  const eph=await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
  const sh=new Uint8Array(await crypto.subtle.deriveBits({name:'ECDH', public:pub}, eph.privateKey, 256));
  const k=await aesKey(await hkdf(sh,'wokanda/wrap/v1/'+space));
  return 'e1.'+b64e(new Uint8Array(await crypto.subtle.exportKey('spki', eph.publicKey)))+'.'+await seal(k, raw, 'space:'+space);
}
async function unwrapWith(priv, wkey, space){
  const [v, epk, ct]=String(wkey).split('.'); if(v!=='e1') throw new Error('wrap');
  const pub=await crypto.subtle.importKey('spki', b64d(epk), {name:'ECDH', namedCurve:'P-256'}, false, []);
  const sh=new Uint8Array(await crypto.subtle.deriveBits({name:'ECDH', public:pub}, priv, 256));
  return unseal(await aesKey(await hkdf(sh,'wokanda/wrap/v1/'+space)), ct, 'space:'+space);
}
const importPriv = pk8 => crypto.subtle.importKey('pkcs8', pk8, {name:'ECDH', namedCurve:'P-256'}, false, ['deriveBits']);
/* ---------- vault key sealed with the owner's own secrets (audit 2.3) ----------
   The vault key used to reach the owner only as a package encrypted to the account's PUBLIC key. Anyone able to write to the
   server's database could replace that package with one made for a key of their choice — the next login would silently adopt it
   and everything written afterwards would be readable to them. Now the vault key is additionally sealed (AES-256-GCM) with the
   key derived from the master password and with the recovery key; the owner's devices use only those copies, which the server
   cannot forge. Each device also remembers a fingerprint of the vault key and refuses a different one. */
const kcAAD = space => 'vk:'+space;
const sealVaultKey = (encKey, raw, space) => seal(encKey, raw, kcAAD(space));
const openVaultKey = (encKey, kc, space) => unseal(encKey, kc, kcAAD(space));
async function vaultFp(raw){ return hexe(await hkdf(raw, 'wokanda/kcv/v1')).slice(0,32); }
const fpKey = () => 'wk.vkfp';
async function vaultFpCheck(raw, userId){
  const fp=await vaultFp(raw); const all=lsGet(fpKey(), {}); const k=SRV.api+'|'+userId; const had=all[k];
  if(had && had!==fp){ const e=new Error('Klucz sejfu podany przez serwer jest inny niż ten, którego to urządzenie używało dotąd. Logowanie zostało przerwane, żeby nie zapisywać danych kluczem podstawionym przez kogoś z dostępem do serwera. Sprawdź serwer; jeśli sejf został celowo założony od nowa, wybierz „Zapomnij to urządzenie” i zaloguj się ponownie.'); e.code='keyswap'; throw e; }
  return {fp, known:!!had, save:()=>{ const a=lsGet(fpKey(), {}); a[k]=fp; lsSet(fpKey(), a); }};
}
function vaultFpForget(){ try{ const a=lsGet(fpKey(), {}); Object.keys(a).filter(k=>k.startsWith(SRV.api+'|')).forEach(k=>delete a[k]); lsSet(fpKey(), a); }catch(e){} }
async function spaceKeys(raw){ return {enc:await aesKey(await hkdf(raw,'wokanda/records/v1')), mac:await crypto.subtle.importKey('raw', await hkdf(raw,'wokanda/rid/v1'), {name:'HMAC', hash:'SHA-256'}, false, ['sign'])}; }
async function ridOf(coll, id){ const k=coll+'/'+id; let r=SRV.rids.get(k); if(r) return r; r=hexe(new Uint8Array(await crypto.subtle.sign('HMAC', SRV.K.mac, TE.encode(k)))).slice(0,32); SRV.rids.set(k,r); return r; }
const recAAD = rid => `${SRV.space}|${rid}`;
async function encRec(rid, coll, id, doc, t){ return seal(SRV.K.enc, TE.encode(JSON.stringify({c:coll, id, d:doc, t:t||Date.now()})), recAAD(rid)); }
/* when two devices changed the same record, the change made later wins — the same rule for edits and deletions (audit 2.3) */
const srvStamp = o => (o && (o.t || o.d?.updatedAt)) || 0;
const SRV_MAX_BLOB = 400000, SRV_BATCH_CHARS = 1500000, SRV_BATCH_ITEMS = 150;   // limits of the server (MAX_BLOB) and of a single request
async function decRec(rid, blob){ return JSON.parse(TD.decode(await unseal(SRV.K.enc, blob, recAAD(rid)))); }

/* ---------- API ---------- */
async function api(a, body, opts={}){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(), opts.timeout||25000);
  let r;
  try{ r=await fetch(`${SRV.api}/api.php?a=${a}`, {method:body?'POST':'GET', headers:{...(body?{'Content-Type':'application/json'}:{}), ...(SRV.token?{'X-Auth':SRV.token}:{})}, body:body?JSON.stringify(body):undefined, signal:ctl.signal, credentials:'omit', cache:'no-store', referrerPolicy:'no-referrer'}); }
  catch(e){ clearTimeout(t); const err=new Error('Brak połączenia z serwerem.'); err.code='offline'; throw err; }
  clearTimeout(t);
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok || !j || j.ok===false){ const err=new Error(j?.message||`Błąd serwera (${r.status}).`); err.code=j?.error||('http'+r.status); err.status=r.status; throw err; }
  return j;
}

/* ---------- encrypted local cache (IndexedDB) ---------- */
function idbOpen(name, stores){ return new Promise((res,rej)=>{ const q=indexedDB.open(name, 1); q.onupgradeneeded=()=>stores.forEach(s=>{ if(!q.result.objectStoreNames.contains(s)) q.result.createObjectStore(s); }); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
function idbDo(db, store, mode, fn){ return new Promise((res,rej)=>{ const tx=db.transaction(store, mode); const st=tx.objectStore(store); let out; const r=fn(st); if(r && 'onsuccess' in r) r.onsuccess=()=>{ out=r.result; }; tx.oncomplete=()=>res(out); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
const idbGet = (db,s,k)=>idbDo(db,s,'readonly',st=>st.get(k));
const idbPut = (db,s,k,v)=>idbDo(db,s,'readwrite',st=>st.put(v,k));
const idbDel = (db,s,k)=>idbDo(db,s,'readwrite',st=>st.delete(k));
const idbAll = (db,s)=>idbDo(db,s,'readonly',st=>st.getAll());
async function cacheDB(){ if(SRV.idb) return SRV.idb; const h=hexe(new Uint8Array(await crypto.subtle.digest('SHA-256', TE.encode(SRV.api+'|'+SRV.user.id)))).slice(0,16); SRV.idb=await idbOpen('wokanda-vault-'+h, ['rec','pend','kv']); return SRV.idb; }
async function deviceDB(){ return idbOpen('wokanda-device', ['kv']); }

/* ---------- applying records to the app state ---------- */
const SRV_COLLS = new Set([...COLLS, 'settings']);
function applyDoc(o){
  if(!o || !SRV_COLLS.has(o.c) || typeof o.id!=='string') return;
  if(o.c==='settings'){ S.settings = o.d || {}; return; }
  if(o.d==null) S[o.c].delete(o.id); else S[o.c].set(o.id, inDoc({...o.d, id:o.id}));
}
async function loadCache(){
  const db=await cacheDB();
  COLLS.forEach(c=>S[c]=new Map()); S.settings={};
  SRV.cursor = (await idbGet(db,'kv','cursor'))||0;
  const recs=await idbAll(db,'rec'); let bad=0;
  SRV.mark = (await idbGet(db,'kv','mark'))||null; SRV.stamps.clear();
  for(const r of recs){ SRV.vers.set(r.rid, r.ver); try{ const o=await decRec(r.rid, r.blob); SRV.rids.set(o.c+'/'+o.id, r.rid); SRV.stamps.set(r.rid, srvStamp(o)); applyDoc(o); }catch(e){ bad++; } }
  for(const p of await idbAll(db,'pend')){ try{ const o=await decRec(p.rid, p.blob); SRV.rids.set(o.c+'/'+o.id, p.rid); SRV.pend.set(p.rid, p); applyDoc(o); }catch(e){ bad++; await idbDel(db,'pend',p.rid).catch(()=>{}); } }
  bumpDV(); return {count:recs.length, bad};
}

/* ---------- writes: encrypt immediately, persist, send in batches ---------- */
function srvEnqueue(coll, id, doc){ srvEnqueueAsync(coll, id, doc).catch(e=>{ SRV.err=e.message; updateSync(); }); }
async function srvEnqueueAsync(coll, id, doc){
  const rid=await ridOf(coll, id);
  const at=Date.now(); const p={rid, blob:await encRec(rid, coll, id, doc, at), deleted:doc==null?1:0, at};
  if(p.blob.length > SRV_MAX_BLOB){ p.big=true; const nm=doc?.title||doc?.name||COLL_PL[coll]||'rekord';
    toast(`„${String(nm).slice(0,60)}” jest za duże, aby zapisać je na serwerze (${Math.round(p.blob.length*0.75/1024)} KB, limit ${Math.round(SRV_MAX_BLOB*0.75/1024)} KB). Zmiana została zachowana tylko na tym urządzeniu — skróć notatki lub komentarze tego rekordu.`, {sticky:true}); }
  SRV.pend.set(rid, p); await idbPut(await cacheDB(), 'pend', rid, p);
  srvScheduleFlush(); updateSync();
}
function srvScheduleFlush(ms=350){ clearTimeout(SRV.flushT); SRV.flushT=setTimeout(srvFlush, ms); }
let srvFlushing=null;
async function srvFlush(){
  if(srvFlushing) return srvFlushing;
  srvFlushing=(async()=>{
    await null;   // the promise must be stored before the body can finish (empty queue finishes synchronously)
    try{
      while(SRV.pend.size && SRV.token){
        const batch=[]; let chars=0;
        for(const p of SRV.pend.values()){ if(SRV.inflight.has(p.rid) || p.big) continue; if(batch.length && (chars+p.blob.length>SRV_BATCH_CHARS || batch.length>=SRV_BATCH_ITEMS)) break; batch.push(p); chars+=p.blob.length; }
        if(!batch.length) break;
        batch.forEach(p=>SRV.inflight.add(p.rid));
        const sent=new Map(batch.map(p=>[p.rid, p]));
        let res;
        try{ res=await api('put', {space:SRV.space, items:batch.map(p=>({rid:p.rid, base:SRV.vers.get(p.rid)||0, blob:p.blob, deleted:p.deleted}))}); SRV.online=true; SRV.err=null; }
        catch(e){ batch.forEach(p=>SRV.inflight.delete(p.rid)); SRV.online = e.code!=='offline' ? SRV.online : false; SRV.err=e.code==='offline'?null:e.message; if(e.code==='auth') srvAuthLost(); updateSync(); srvScheduleFlush(e.code==='offline'?8000:4000); return; }
        const db=await cacheDB();
        for(const r of res.results){
          const p=sent.get(r.rid); SRV.inflight.delete(r.rid); if(!p) continue;
          if(r.ok){
            SRV.vers.set(r.rid, r.ver); SRV.stamps.set(r.rid, p.at);
            await idbPut(db,'rec',r.rid,{rid:r.rid, ver:r.ver, seq:r.seq, blob:p.blob, deleted:p.deleted});
            if(SRV.pend.get(r.rid)===p){ SRV.pend.delete(r.rid); await idbDel(db,'pend',r.rid); }   // a newer edit made meanwhile stays in the queue and goes out next
          } else if(r.conflict){
            SRV.vers.set(r.rid, r.ver);
            const cur=SRV.pend.get(r.rid); if(!cur) continue;
            let remote=null; try{ remote=r.blob?await decRec(r.rid, r.blob):null; }catch(e){ SRV.tampered++; }
            const mine=await decRec(r.rid, cur.blob);
            if(remote && srvStamp(remote) > srvStamp(mine) && SRV.pend.get(r.rid)===cur){ SRV.pend.delete(r.rid); await idbDel(db,'pend',r.rid); await srvAccept(db, r, remote); bumpDV(); render(); }
            /* otherwise: our version is newer — it stays in the queue and is re-sent against the server's current version */
          }
        }
        updateSync();
      }
    } finally { srvFlushing=null; updateSync(); }
  })();
  return srvFlushing;
}

/* ---------- reads: incremental change feed (polling) ---------- */
let srvPulling=false;
/* a verified record from the server becomes the local truth */
async function srvAccept(db, r, o){
  SRV.vers.set(r.rid, r.ver); SRV.stamps.set(r.rid, srvStamp(o)); SRV.rids.set(o.c+'/'+o.id, r.rid);
  await idbPut(db,'rec',r.rid,{rid:r.rid, ver:r.ver, seq:r.seq, blob:r.blob, deleted:o.d==null?1:0});
  applyDoc(o);
}
async function srvPull(){
  if(srvPulling || !SRV.token || !SRV.K) return false; srvPulling=true;
  try{
    let more=true, changed=false, resync=false, resent=0; const db=await cacheDB(); const seen=new Set();
    while(more){
      const j=await api('changes', {space:SRV.space, since:SRV.cursor, ...(SRV.cursor>0 && SRV.mark?{mark_rid:SRV.mark.rid, mark_ver:SRV.mark.ver}:{})}); SRV.online=true;
      if(j.reset && !resync){   // the server's database went back in time (e.g. the hosting restored a backup): compare everything from the start
        resync=true; SRV.cursor=0; SRV.mark=null; continue; }
      for(const r of j.records){
        seen.add(r.rid);
        if(SRV.inflight.has(r.rid)) continue;   // being sent right now: the server answers with a conflict and srvFlush resolves it
        const known=SRV.vers.get(r.rid)||0;
        if(known===r.ver && !SRV.pend.has(r.rid)) continue;
        if(known>r.ver && !SRV.pend.has(r.rid)){ if(resync){ SRV.vers.set(r.rid, r.ver); if(srvRepair(r.rid)) resent++; } continue; }   // server holds an older copy than this device
        let o; try{ o=await decRec(r.rid, r.blob); }catch(e){ SRV.tampered++; srvRepair(r.rid); continue; }
        if(SRV.pend.has(r.rid)){                // waiting in the queue (e.g. edited offline): compare with the other device's change
          const p=SRV.pend.get(r.rid); let mine=null; try{ mine=await decRec(p.rid, p.blob); }catch(e){}
          if(SRV.inflight.has(r.rid) || SRV.pend.get(r.rid)!==p) continue;
          SRV.vers.set(r.rid, Math.max(known, r.ver));
          if(mine && srvStamp(o) > srvStamp(mine)){ SRV.pend.delete(r.rid); await idbDel(db,'pend',r.rid); await srvAccept(db, r, o); changed=true; }
          continue; }
        // an older content under a newer version number is a replayed package: it is not applied, this device's copy is sent again
        const st=srvStamp(o), had=SRV.stamps.get(r.rid)||0;
        if(st && had && st<had){ SRV.tampered++; SRV.vers.set(r.rid, r.ver); srvRepair(r.rid); continue; }
        await srvAccept(db, r, o); changed=true;
      }
      SRV.cursor=j.cursor; const last=j.records[j.records.length-1]; if(last) SRV.mark={rid:last.rid, ver:last.ver};
      await idbPut(db,'kv','cursor',SRV.cursor); if(SRV.mark) await idbPut(db,'kv','mark',SRV.mark); more=j.more;
    }
    if(resync){   // records this device has, but the restored server no longer does, are sent again
      for(const rid of [...SRV.vers.keys()]){ if(seen.has(rid) || SRV.pend.has(rid)) continue; SRV.vers.delete(rid); if(srvRepair(rid)) resent++; }
      toast(`Serwer danych wrócił do wcześniejszego stanu (np. po przywróceniu kopii na hostingu). To urządzenie porównało wszystkie dane${resent?` i odesłało ${resent} ${plural(resent,'nowszy rekord','nowsze rekordy','nowszych rekordów')}`:''}.`, {sticky:true});
    }
    if(SRV.tampered && !SRV.tamperWarned){ SRV.tamperWarned=true; toast(`Uwaga: ${SRV.tampered} ${plural(SRV.tampered,'paczka danych na serwerze nie przeszła','paczki danych na serwerze nie przeszły','paczek danych na serwerze nie przeszło')} kontroli autentyczności (zmienione, uszkodzone lub cofnięte do starszej treści) — zostały pominięte, a Twoje dane w tym urządzeniu są nienaruszone${SRV.repaired?` (${SRV.repaired} odesłano z tego urządzenia, aby naprawić serwer)`:''}.`, {sticky:true}); }
    if(changed){ bumpDV(); if(S.ready) applyTheme(); render(); }
    SRV.err=null; SRV.synced=true; return true;
  } catch(e){ if(e.code==='offline') SRV.online=false; else if(e.code==='auth') srvAuthLost(); else SRV.err=e.message; return false; }
  finally{ srvPulling=false; updateSync(); }
}
/* a package that fails authentication on the server is replaced with this device's verified copy */
function srvRepair(rid){
  for(const [k,v] of SRV.rids){ if(v!==rid) continue; const i=k.indexOf('/'); const coll=k.slice(0,i), id=k.slice(i+1);
    const doc = coll==='settings' ? S.settings : S[coll]?.get(id);
    SRV.repaired=(SRV.repaired||0)+1; srvEnqueue(coll, id, doc ? clone(doc) : null);   // no local document = it was deleted here: the deletion is sent again
    return true; }
  return false;
}
function srvStartPolling(){
  clearInterval(SRV.pollT);
  SRV.pollT=setInterval(()=>{ if(!document.hidden || Date.now()%30000<6000) srvPull(); if(SRV.pend.size) srvScheduleFlush(50); }, 6000);
  if(SRV.pollBound) return; SRV.pollBound=true;
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && SRV.K){ srvPull(); srvCheckLock(); } });
  window.addEventListener('online', ()=>{ if(SRV.K){ srvPull().then(()=>srvScheduleFlush(50)); } });
}
function srvAuthLost(){ if(SRV.authLost) return; SRV.authLost=true; SRV.token=null; vaultLock('Sesja na serwerze wygasła — zaloguj się ponownie.', true); }
async function srvBulkApply(ops, label){
  bumpDV();
  ops.forEach(o=>{ if(o.coll==='settings'){ S.settings={...o.data}; return; } if(o.data===null) S[o.coll].delete(o.id); else S[o.coll].set(o.id, o.data); });
  render();
  const prog=toast(`${label}: szyfrowanie 0 / ${ops.length}`, {sticky:true});
  let n=0; for(const o of ops){ await srvEnqueueAsync(o.coll==='settings'?'settings':o.coll, o.coll==='settings'?'settings':o.id, o.data===null?null:o.data); if(++n%25===0){ const s=prog.querySelector('span'); if(s) s.textContent=`${label}: szyfrowanie ${n} / ${ops.length}`; } }
  const s=prog.querySelector('span'); if(s) s.textContent=`${label}: wysyłanie na serwer…`;
  await srvFlush(); prog.remove();
  const failed=SRV.pend.size;
  if(failed) toast(`${failed} ${plural(failed,'rekord czeka','rekordy czekają','rekordów czeka')} na wysłanie — zostaną wysłane automatycznie po odzyskaniu połączenia.`, {sticky:true});

/* ---------- trusted device (PIN) ---------- */
async function deviceKey(){ const db=await deviceDB(); let k=await idbGet(db,'kv','dk'); if(!k){ k=await crypto.subtle.generateKey({name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); await idbPut(db,'kv','dk',k); } return k; }
const trustKey = () => 'trust:'+SRV.api;
async function trustGet(){ try{ const t=await idbGet(await deviceDB(),'kv',trustKey()); if(t && t.exp<Date.now()){ await trustForget(); return null; } return t||null; }catch(e){ return null; } }

async function trustSave(pin){
  const salt=b64e(rnd(16)); const pk=await aesKey(await pbkdf2(pin, salt, PIN_ITER));
  const inner=await seal(pk, TE.encode(JSON.stringify({token:SRV.token, user:SRV.user, space:SRV.space, raw:b64e(SRV.raw)})), 'pin');
  const blob=await seal(await deviceKey(), TE.encode(inner), 'device');
  await idbPut(await deviceDB(),'kv',trustKey(),{login:SRV.user.login, salt, iter:PIN_ITER, blob, exp:Date.now()+TRUST_DAYS*86400000, fails:0, created:Date.now()});
}
async function trustOpen(pin){
  const t=await trustGet(); if(!t) throw Object.assign(new Error('Brak zaufanego urządzenia.'),{code:'notrust'});
  try{
    const inner=TD.decode(await unseal(await deviceKey(), t.blob, 'device'));
    const pk=await aesKey(await pbkdf2(pin, t.salt, t.iter));
    const o=JSON.parse(TD.decode(await unseal(pk, inner, 'pin')));
    t.fails=0; await idbPut(await deviceDB(),'kv',trustKey(),t);
    return o;
  }catch(e){
    t.fails=(t.fails||0)+1;
    if(t.fails>=PIN_TRIES){ await trustForget(); throw Object.assign(new Error('Zbyt wiele błędnych PIN-ów — to urządzenie zostało zapomniane. Zaloguj się hasłem głównym.'),{code:'wiped'}); }
    await idbPut(await deviceDB(),'kv',trustKey(),t);
    throw Object.assign(new Error(`Nieprawidłowy PIN. Pozostało prób: ${PIN_TRIES-t.fails}.`),{code:'badpin'});
  }
}

}
async function vaultLogin(login, password){
  const pre=await api('prelogin', {login});

async function vaultSetup(login, password){
  const kdf={alg:'PBKDF2-SHA256', iter:KDF_ITER, salt:b64e(rnd(16))};
  const k=await pwKeys(password, kdf);
  const kp=await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
  const pk8=new Uint8Array(await crypto.subtle.exportKey('pkcs8', kp.privateKey));
  const pub=b64e(new Uint8Array(await crypto.subtle.exportKey('spki', kp.publicKey)));
  const rec=rnd(32); const rk=await recKeys(rec);
  const raw=rnd(32);
  const body={login, kdf, auth:k.auth, pub, wpriv:await seal(k.enc, pk8, 'priv'), rec_auth:rk.auth, rec_wpriv:await seal(rk.enc, pk8, 'priv'), space:{id:'main', wkey:await wrapFor(pub, raw, 'main'), kc:await sealVaultKey(k.enc, raw, 'main'), rec_kc:await sealVaultKey(rk.enc, raw, 'main')}};
  const j=await api('setup', body);

async function vaultRecover(login, code, newPassword){

  const sp=(s.spaces||[]).find(x=>x.id==='main')||s.spaces?.[0]; if(!sp) throw new Error('Brak dostępu do sejfu.');
  let raw;

    try{ raw=await openVaultKey(rk.enc, sp.rec_kc, sp.id); }
    catch(e){ throw Object.assign(new Error('Zapieczętowany klucz sejfu na serwerze nie pasuje do klucza odzyskiwania — został zmieniony lub uszkodzony. Odzyskiwanie przerwane, hasło nie zostało zmienione.'), {code:'keyswap'}); }

async function serverBoot(){
  SRV.api = lsGet('wk.api','') || WK_API_DEFAULT;
  if(window.top!==window.self){ vaultShell(`<h1>Wokanda</h1><p class="vault-lead">Ze względów bezpieczeństwa Wokanda nie działa wewnątrz innej strony. Otwórz ją bezpośrednio pod jej własnym adresem.</p>`); return; }
  if(!window.isSecureContext || !crypto?.subtle){ vaultShell(`<h1>Wokanda</h1><p class="vault-lead">Szyfrowanie wymaga bezpiecznego połączenia (https). Otwórz aplikację pod adresem zaczynającym się od https://.</p>`); return; }
  if(!SRV.api) return vaultScreen('server');
  let s; try{ s=await api('status'); }catch(e){ return vaultScreen('server', {value:SRV.api}); }
  if(!s.setup) return vaultScreen('setup');
  return (await trustGet()) ? vaultScreen('pin') : vaultScreen('login');
}

/* =====================================================================
   v2.1 — SZYFROWANE KOPIE ZAPASOWE (obie odmiany)
   Plik: {format:'wokanda-backup-enc', kdf:{PBKDF2-SHA256, 600 000, sól}, data: AES-256-GCM(kopia)}.
   Klucz z osobnego hasła kopii (HKDF "backup"), więc plik można przenieść między odmianami (Claude → serwer).
   ===================================================================== */
const BACKUP_ENC_FORMAT='wokanda-backup-enc';
async function backupKey(pw, kdf){ return aesKey(await hkdf(await pbkdf2(pw, kdf.salt, kdf.iter), 'wokanda/backup/v1')); }
async function encryptBackup(env, pw){
  const kdf={alg:'PBKDF2-SHA256', iter:KDF_ITER, salt:b64e(rnd(16))};
  const data=await seal(await backupKey(pw, kdf), TE.encode(JSON.stringify(env)), BACKUP_ENC_FORMAT);
  return {format:BACKUP_ENC_FORMAT, formatVersion:1, appVersion:env.appVersion, exportedAt:env.exportedAt, kdf, data};
}
async function decryptBackup(file, pw){ kdfCheck(file.kdf); return JSON.parse(TD.decode(await unseal(await backupKey(pw, file.kdf), file.data, BACKUP_ENC_FORMAT))); }

function askOpenPassword(fileName){

      <div class="modal-f"><button class="btn" type="button" data-close>Anuluj</button><button class="btn primary" type="button" id="bo-ok">Odszyfruj</button></div>`);
    let done=false; const fin=v=>{ if(done) return; done=true; res(v); };

    const go=async ()=>{ const b=m.querySelector('#bo-ok'); b.disabled=true; b.textContent='Odszyfrowuję…'; const err=m.querySelector('#bo-err');
      try{ const env=await res2(m.querySelector('#bo-1').value); fin(env); closeModal(); }

/* reads a backup object; encrypted ones ask for the backup password; returns the plain envelope or null */
async function openBackupObject(obj, fileName){
  if(obj && obj.format===BACKUP_ENC_FORMAT){
    const p=askOpenPassword(fileName); askOpenPassword._last._setDecrypt(pw=>decryptBackup(obj, pw));

  }
  return obj;
}

async function bulkApply(ops, label){
  if(S.mode==='server') return srvBulkApply(ops, label);
  // apply locally first
  bumpDV();
  ops.forEach(o=>{ if(o.coll==='settings'){ S.settings={...o.data}; return; } if(o.data===null) S[o.coll].delete(o.id); else S[o.coll].set(o.id, o.data); });
  render();
  if(S.mode!=='cloud'){ saveLocal(); return {ok:ops.length, failed:0}; }
  const prog=toast(`${label}: 0 / ${ops.length}`, {sticky:true});
  let done=0, failed=0, i=0;
  const worker=async()=>{
    while(i<ops.length){
      const o=ops[i++];
      const ref = o.coll==='settings' ? Cloud.settingsRef : refOf(o.coll, o.id);
      const path = o.coll==='settings' ? `data/users/${S.uid}/settings` : pathOf(o.coll, o.id);
      localDirty.set(path, o.data===null?null:clone(o.data));
      try{ await attempt({ref, op:o.data===null?'del':'set', data:o.data}); }
      catch(e){ failed++; if(e&&e.code==='quota_exceeded'){ i=ops.length; toast('Limit miejsca na dane — część rekordów nie została zapisana.', {sticky:true}); } }
      localDirty.delete(path);
      done++; if(done%5===0||done===ops.length){ const s=prog.querySelector('span'); if(s) s.textContent=`${label}: ${done} / ${ops.length}`; }
    }
  };
  await Promise.all(Array.from({length:5}, worker));
  prog.remove();
  if(failed) toast(`${failed} ${plural(failed,'rekord nie został zapisany','rekordy nie zostały zapisane','rekordów nie zostało zapisanych')}. Spróbuj ponownie.`, {sticky:true});
  return {ok:done-failed, failed};
}

      if((await digest(stableStringify(back.data)))!==checksum) throw new Error('verify'); out=JSON.stringify(encF, null, 1); fn=`wokanda-kopia-szyfrowana-${stamp}.json`; }
    catch(e){ prog.remove(); toast('Nie udało się zaszyfrować kopii — spróbuj ponownie.', {sticky:true}); return false; }
    prog.remove();
  }
  const ok=await saveFile(fn, out, choice.pw?'Kopia zapasowa (zaszyfrowana)':'Kopia zapasowa');
  if(ok){ recordBackup(checksum, v.counts, out.length, !!choice.pw); if(host) host.insertAdjacentHTML('beforeend', `<div class="report" style="margin-top:8px">${choice.pw?'<span class="okk">Kopia zaszyfrowana hasłem kopii i sprawdzona po zaszyfrowaniu.</span> Przechowuj hasło kopii oddzielnie od pliku.':'<span class="wrn">Kopia zapisana bez szyfrowania</span> — przechowuj plik w bezpiecznym miejscu i usuń go, gdy nie będzie potrzebny.'}</div>`); }
  return !!ok;
}

}

async function reviewImport(env, host, srcLine, onDone){

    const sum=await digest(stableStringify(env.data));

    const extra=`<div style="margin-bottom:6px">${srcLine}<br><b>Utworzono:</b> ${env.exportedAt?fmtStamp(Date.parse(env.exportedAt)):'—'} · wersja aplikacji ${esc(env.appVersion||'?')}<br>${checks.join('<br>')}</div>`;
    host.innerHTML=reportHTML(v, extra)+(blocked?'':`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" type="button" data-imp="merge">Scal z obecnymi danymi</button><button class="btn danger" type="button" data-imp="replace">Zastąp wszystkie dane…</button></div><p class="muted" style="font-size:12px;margin-top:8px">„Scal” dodaje brakujące rekordy i aktualizuje starsze wersje — nic nie usuwa. „Zastąp” przywraca dokładnie stan z kopii.</p>`);
    if(blocked) return;

    host.querySelector('[data-imp="merge"]').addEventListener('click', async ()=>{

      COLLS.forEach(c=>(data[c]||[]).forEach(x=>{ const cur=S[c].get(x.id); if(!cur || (x.updatedAt||0)>=(cur.updatedAt||0)) ops.push({coll:c, id:x.id, data:x}); }));
      if(data.settings){ const {backups, lastBackupAt, lastSnapDay, lockMin, numFloor, ...rest}=data.settings; ops.push({coll:'settings', data:{...S.settings, ...rest, numFloor:Math.max(+S.settings.numFloor||0, +numFloor||0), initialized:true, updatedAt:Date.now()}}); }
      const r=await bulkApply(ops, 'Import (scalanie)');

      onDone&&onDone(r);
    });
    host.querySelector('[data-imp="replace"]').addEventListener('click', ()=>confirmBox('Zastąpić wszystkie dane?', `Obecne dane na wszystkich urządzeniach zostaną zastąpione zawartością kopii. ${S.mode==='cloud'?'Przed zastąpieniem aplikacja sama zapisze kopię obecnego stanu w chmurze.':'Przed zastąpieniem aplikacja poprosi o zapisanie kopii obecnego stanu do pliku — bez niej nic nie zostanie zastąpione.'}`, 'Zastąp dane', async ()=>{
      if(!(await safetyCopy('przed-przywroceniem'))){ toast('Przerwano — dane nie zostały zastąpione, bo nie powstała kopia obecnego stanu.', {sticky:true}); return; }
      const ops=[];
      COLLS.forEach(c=>{ const keep=new Set((data[c]||[]).map(x=>x.id)); [...S[c].keys()].filter(id=>!keep.has(id)).forEach(id=>ops.push({coll:c,id,data:null})); (data[c]||[]).forEach(x=>ops.push({coll:c,id:x.id,data:x})); });
      ops.push({coll:'settings', data:{...(data.settings||{}), initialized:true, lastSnapDay:S.settings.lastSnapDay||null, updatedAt:Date.now(), ...(S.mode==='server'?{lockMin:S.settings.lockMin??30}:{})}});
      const r=await bulkApply(ops, 'Import (zastąpienie)');

      applyTheme();
    }, {danger:true, typeWord:'ZASTĄP'}));

/* =====================================================================
   v1.9 — AUTOMATIC CLOUD SNAPSHOTS
   Once a day (first device that opens Wokanda) the whole data set is saved
   as a verified backup inside the user's private cloud space:
   data/users/{id}/ws/snaps/{snapId} (header) + ws/snapparts/{snapId}-{n} (≤90 000 chars each).
   The newest SNAP_KEEP snapshots are kept. Restore = the same verified import as a file.
   ===================================================================== */
const SNAP_KEEP=14, SNAP_CHUNK=90000;
let snapBusy=false;
async function cloudSnapshot(kind){
  if(S.mode!=='cloud' || !Cloud.base || snapBusy) return null;
  const day=today();
  if(!kind && S.settings.lastSnapDay===day) return null;
  snapBusy=true;
  try{
    const data=collectData(); const v=validateData(data);
    if(v.errors.length) return null;
    const checksum=await digest(stableStringify(data));
    const env={format:BACKUP_FORMAT, formatVersion:BACKUP_FORMAT_VERSION, appVersion:APP_VERSION, exportedAt:new Date().toISOString(), counts:v.counts, checksum, data};
    const text=JSON.stringify(env);
    const d=new Date();
    const id = kind ? `m-${ymd(d)}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}` : `d-${day}`;
    const n=Math.max(1, Math.ceil(text.length/SNAP_CHUNK));
    const part=i=>Cloud.base.collection('snapparts').doc(`${id}-${i}`);
    try{
      for(let i=0;i<n;i++) await attempt({ref:part(i), op:'set', data:{snap:id, i, text:text.slice(i*SNAP_CHUNK,(i+1)*SNAP_CHUNK)}});
      // read-back: a copy counts only if it can be read and opens to exactly the same data
      let back=''; for(let i=0;i<n;i++){ const d=await part(i).get(); if(!d.exists) throw new Error('snapshot part missing'); back+=d.data().text||''; }
      if(back!==text || (await digest(stableStringify(JSON.parse(back).data)))!==checksum) throw new Error('snapshot verify');
    }catch(e){ if(kind) for(let i=0;i<n;i++) await attempt({ref:part(i), op:'del'}).catch(()=>{}); throw e; }
    const total=COLLS.reduce((a,c)=>a+v.counts[c],0);
    await attempt({ref:Cloud.base.collection('snaps').doc(id), op:'set', data:{id, at:Date.now(), kind:kind||'auto', appVersion:APP_VERSION, counts:v.counts, total, checksum, parts:n, bytes:text.length, verified:true}});
    if(!kind) saveSettings({lastSnapDay:day});
    pruneSnaps().catch(()=>{});
    return id;
  } catch(e){ console.warn('snapshot', e); return null; }
  finally{ snapBusy=false; }
}
async function listSnaps(){
  if(S.mode!=='cloud' || !Cloud.base) return [];
  const q=await Cloud.base.collection('snaps').get();
  return q.docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>b.at-a.at);
}
async function pruneSnaps(){
  const all=await listSnaps(); const old=all.slice(SNAP_KEEP);
  for(const s of old){ for(let i=0;i<(s.parts||1);i++) await attempt({ref:Cloud.base.collection('snapparts').doc(`${s.id}-${i}`), op:'del'}).catch(()=>{}); await attempt({ref:Cloud.base.collection('snaps').doc(s.id), op:'del'}).catch(()=>{}); }
}
async function loadSnap(s){
  let text='';
  for(let i=0;i<(s.parts||1);i++){ const d=await Cloud.base.collection('snapparts').doc(`${s.id}-${i}`).get(); if(!d.exists) throw new Error('missing part'); text+=d.data().text||''; }
  return JSON.parse(text);
}

  const start=async demo=>{
    $('#w-demo').disabled=true; $('#w-empty').disabled=true; $('#w-prog').innerHTML=`<div class="progress"><i style="width:30%"></i></div>`;
    const ops=[...defaultsOps(), ...templateStarterOps(), ...(demo?demoOps():[]), {coll:'settings', data:{...S.settings, initialized:true, templatesSeeded:true, theme:S.settings.theme||lsGet('wk.theme','system')}}];

    b.hidden=true; go(demo?'overview':'inbox');
  };
  $('#w-demo').addEventListener('click', ()=>start(true));

      env=await openBackupObject(env, f.name); if(!env){ e.target.value=''; return; }

function maybeWelcome(){
  if(S.welcomeShown) return false;
  if(S.mode==='server' && !SRV.synced) return false;   // an empty screen is "no data" only after the server has answered
  if(!S.settings.initialized && !S.tasks.size && !S.statuses.size && !S.projects.size && !S.clients.size){ S.welcomeShown=true; showWelcome(); return true; }
  return false;
}
/** runs once the full data set is known (never on a partial / cached load) */
function onDataComplete(){
  if(S.mode==='cloud') setTimeout(offerLocalUpload, 2500);
  if(maybeWelcome()) return;
  replayUnsent();
  migrateNames(); fixDuplicateNums();
  if(S.mode==='cloud'){ setTimeout(()=>cloudSnapshot().then(id=>{ if(id && rp().kind==='settings') renderSnapList(); }), 5000); }
  if(templatesSeedNeeded()){ bulkApply(templateStarterOps().filter(o=>!S.templates.has(o.id)), 'Szablony zadań').then(()=>saveSettings({templatesSeeded:true})); }
  autoPurgeTrash();
}
/* v1.4: older people records had only name = "Imię Nazwisko" — store surname and first name separately, once */
function migrateNames(){
  const ops=[];
  for(const p of S.people.values()) if(p.firstName==null && p.lastName==null && p.name){ ops.push({coll:'people', id:p.id, doc:{...p, firstName:personFirst(p), lastName:personLast(p)}}); }
  if(!ops.length) return;
  ops.forEach(o=>put(o.coll, o.doc));
  toast(`Uporządkowano ${ops.length} ${plural(ops.length,'osobę','osoby','osób')}: nazwisko i imię w osobnych polach. Sprawdź listę pracowników — w razie potrzeby użyj „Zamień”.`);
}
function onReady(){
  if(S.ready) return;
  S.ready=true; applyTheme(); updateSync();
  try{ document.body.classList.toggle('dense', !!lsGet('wk.dense', false)); document.body.classList.toggle('side-mini', !!lsGet('wk.sideMini', false)); }catch(e){}
  if(!S.partial && maybeWelcome()){ renderAll(); if(S.mode==='cloud') setTimeout(offerLocalUpload, 2500); return; }
  $('#boot').hidden=true;
  if(UI.route.includes(':')){ const {kind,id}=rp(); const coll={project:'projects',person:'people',dept:'departments',cat:'categories',tag:'tags',view:'views',client:'clients'}[kind]; if(coll && !S[coll].has(id) && !S.partial) UI.route='overview'; }
  renderAll();
  if(!S.partial) onDataComplete();
  setTimeout(checkReminders, 1500); setTimeout(backupReminder, 4000); registerSW();
}
applyTheme();
connect();
