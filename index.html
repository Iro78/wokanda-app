    h+=`<div class="dcards">`;
    ds.forEach(d=>{ const mem=sorted('people').filter(p=>(p.departmentIds||[]).includes(d.id)); const n=open.filter(t=>t.departmentId===d.id||(t.assignees||[]).some(p=>(S.people.get(p)?.departmentIds||[]).includes(d.id))).length;
      h+=`<div class="pcard" data-nav="dept:${d.id}" data-drop="nav:dept:${d.id}"><h4><span style="width:10px;height:10px;border-radius:3px;background:${esc(d.color)}"></span>${esc(d.name)}</h4><div class="muted" style="font-size:12px;margin-bottom:10px">${d.headId?'Kierownik: '+esc(personName(d.headId)):'Brak kierownika'} · ${n} ${plural(n,'otwarte zadanie','otwarte zadania','otwartych zadań')}</div>${avatars(mem.map(p=>p.id),8)||'<span class="muted" style="font-size:12px">Brak osób</span>'}<div style="margin-top:10px"><button class="btn sm" type="button" data-act="edit-dept" data-id="${d.id}">Edytuj</button></div></div>`; });
    h+=`</div>`;
  }
  if(tab==='load'){
    const ps=sorted('people').filter(p=>p.active!==false);
    if(!ps.length) return h+emptyState('Brak pracowników','Dodaj pracowników, aby zobaczyć ich obciążenie.','','i-users');
    const sts=statuses().filter(s=>!['done','cancelled'].includes(s.type));
    h+=`<div class="tbl-scroll"><table class="ttable"><thead><tr><th>Pracownik</th>${sts.map(s=>`<th class="num" title="${esc(s.name)}"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${esc(s.color)};margin-right:4px"></span>${esc(s.name.split(/[ –/]/)[0])}</th>`).join('')}<th class="num">Razem</th><th class="num">Po terminie</th><th class="num">Szac. czas</th></tr></thead><tbody>`;
    ps.forEach(p=>{ const its=open.filter(t=>(t.assignees||[]).includes(p.id)); const est=its.reduce((a,t)=>a+(t.estimate||0),0);
      h+=`<tr class="clickable" data-nav="person:${p.id}"><td><div class="pcell">${avatar(p.id,'md')}<div>${esc(personLabel(p))}</div></div></td>${sts.map(s=>`<td class="num">${its.filter(t=>t.status===s.id).length||'<span class="muted">·</span>'}</td>`).join('')}<td class="num"><b>${its.length}</b></td><td class="num" style="${its.some(t=>dueState(t)==='late')?'color:var(--danger);font-weight:600':''}">${its.filter(t=>dueState(t)==='late').length}</td><td class="num">${est?fmtDur(est):'—'}</td></tr>`; });
    const un=open.filter(t=>!(t.assignees||[]).length && taskArea(t)==='work');
    h+=`<tr class="clickable" data-act="unassigned"><td><div class="pcell"><span class="av md" style="background:var(--sunken);color:var(--fg-2)">?</span><div>Nieprzydzielone (służbowe)</div></div></td>${sts.map(s=>`<td class="num">${un.filter(t=>t.status===s.id).length||'<span class="muted">·</span>'}</td>`).join('')}<td class="num"><b>${un.length}</b></td><td class="num">${un.filter(t=>dueState(t)==='late').length}</td><td class="num">—</td></tr>`;
    h+=`</tbody></table></div>`;
  }
  return h;
}

/* ---------- table layout ---------- */
const TCOLS=[['num','Sygn.'],['title','Zadanie'],['client','Klient'],['project','Projekt'],['status','Status'],['priority','Priorytet'],['due','Termin'],['assignees','Osoby'],['time','Czas']];
function tableVal(t,k){
  switch(k){
    case 'num': return t.num||0;
    case 'title': return t.title||'';
    case 'client': return clientName(t.clientId)||'￿';
    case 'project': return S.projects.get(t.projectId)?.name||'￿';
    case 'status': return statuses().findIndex(s=>s.id===t.status);
    case 'priority': return t.priority||9;
    case 'due': return (t.due||'9999-99-99')+(t.dueTime||'99:99');
    case 'assignees': return (t.assignees||[]).length ? personName(sortPeopleIds(t.assignees)[0]) : '￿';
    case 'time': return timeTotal(t);
  }
  return '';
}
function renderTable(ts, v){
  if(!ts.length) return emptyForRoute();
  let rows;
  if(v.tsort){ const {k,dir}=v.tsort; const m=dir==='desc'?-1:1; rows=[...ts].sort((a,b)=>{ const x=tableVal(a,k), y=tableVal(b,k); return m*((typeof x==='number'&&typeof y==='number') ? x-y : alpha(x,y)) || (a.num||0)-(b.num||0); }); }
  else rows=sortTasks(ts, v.sort);
  const total=rows.reduce((a,t)=>a+timeTotal(t),0);
  let h=`<div class="tbl-scroll"><table class="ttable tasks-table"><thead><tr><th style="width:34px"></th>${TCOLS.map(([k,l])=>{ const on=v.tsort?.k===k; return `<th class="${['num','time'].includes(k)?'num':''}"><button type="button" class="th-sort ${on?'on':''}" data-act="tsort" data-k="${k}">${l}${on?ico(v.tsort.dir==='desc'?'i-chevd':'i-chevu','s14'):''}</button></th>`; }).join('')}</tr></thead><tbody>`;
  rows.forEach(t=>{
    const p=t.projectId&&S.projects.get(t.projectId); const c=t.clientId&&S.clients.get(t.clientId); const ds=dueState(t); const tt=timeTotal(t);
    h+=`<tr class="clickable ${UI.openTask===t.id?'open':''} ${isClosed(t)?'closed':''}" data-act="open" data-id="${t.id}" data-drag="task:${t.id}" data-drag-label="${esc(t.title)}">
      <td>${chkHTML(t)}</td>
      <td class="num sig">${sigOf(t)}</td>
      <td class="t-title"><div>${t.parentId&&S.tasks.get(t.parentId)?`<span class="muted">↳ </span>`:''}<span class="ttl">${esc(t.title)}</span>${t.hard?` <span class="hard">${ico('i-gavel','s14')}ustawowy</span>`:''}${t.milestone?` <span class="ms-ico">${ico('i-diamond','s14')}</span>`:''}${t.recur?` <span class="muted" title="${esc(recurLabel(t.recur))}">${ico('i-repeat','s14')}</span>`:''}</div></td>
      <td>${c?`<span class="cell-chip">${esc(clientLabel(c))}</span>`:'<span class="muted">—</span>'}</td>
      <td>${p?`<span class="cell-chip"><i style="background:${esc(safeColor(p.color))}"></i>${esc(p.name)}</span>`:'<span class="muted">—</span>'}</td>
      <td>${statusPill(t,true)}</td>
      <td><span class="pri-txt" style="--pc:${PRI[t.priority||0].color}">${t.priority?PRI[t.priority].short:'—'}</span></td>
      <td class="due ${ds}" style="white-space:nowrap">${t.due?esc(fmtDate(t.due))+(t.dueTime?' '+esc(t.dueTime):''):'<span class="muted">—</span>'}</td>
      <td>${avatars(t.assignees||[],3)||'<span class="muted">—</span>'}</td>
      <td class="num">${tt?esc(fmtDur(tt)):'<span class="muted">—</span>'}</td></tr>`;
  });
  h+=`</tbody><tfoot><tr><td></td><td colspan="8" class="muted">${rows.length} ${plural(rows.length,'zadanie','zadania','zadań')}</td><td class="num">${total?esc(fmtDur(total)):''}</td></tr></tfoot></table></div>`;
  return h;
}

      <td>${esc(c.form||'—')}</td>
      <td><div class="svc">${(c.services||[]).map(k=>`<span>${esc(serviceName(k))}</span>`).join('')||'<span class="muted">—</span>'}</div></td>
      <td>${esc((VAT_OPTS.find(v=>v[0]===c.vat)||['','—'])[1].replace('VAT ',''))}</td>
      <td>${c.ownerId?`<span style="display:inline-flex;align-items:center;gap:6px">${avatar(c.ownerId)}${esc(personName(c.ownerId))}</span>`:'<span class="muted">—</span>'}</td>

function filterClientRows(){ const q=norm($('#cl-q')?.value||''); $$('#content tr[data-search]').forEach(tr=>{ tr.hidden = !!q && !q.split(/\s+/).every(w=>tr.dataset.search.includes(w)); }); }
document.addEventListener('input', e=>{ if(e.target.id==='cl-q'){ UI.cl.q=e.target.value; lsSet('wk.cl', S.mode==='server' ? {...UI.cl, q:''} : UI.cl); filterClientRows(); } });   // encrypted edition: the typed client name is not written to the disk in clear
document.addEventListener('change', e=>{
  const id=e.target.id;

  if(id==='cl-inactive'){ UI.cl.inactive=e.target.checked; lsSet('wk.cl', S.mode==='server' ? {...UI.cl, q:''} : UI.cl); renderContent(); }

  if(id==='rep-from'||id==='rep-to'){ UI.rep[id==='rep-from'?'from':'to']=e.target.value; UI.rep.period='custom'; lsSet('wk.rep',UI.rep); renderContent(); }
});

  };
  m.querySelector('#cm-save').addEventListener('click', save);
  m.querySelector('#cm-form').addEventListener('submit', e=>{ e.preventDefault(); save(); });

}

/* ---------- reports ---------- */
function periodRange(r){
  const T=today(); const d=D(T); const y=d.getFullYear(), mo=d.getMonth();
  const first=(yy,mm)=>ymd(new Date(yy,mm,1,12)), last=(yy,mm)=>ymd(new Date(yy,mm+1,0,12));
  switch(r.period){
    case 'week': { const s=startOfWeek(T); return [s, addDays(s,6), 'Ten tydzień']; }
    case 'prevweek': { const s=addDays(startOfWeek(T),-7); return [s, addDays(s,6), 'Poprzedni tydzień']; }
    case 'prevmonth': return [first(y,mo-1), last(y,mo-1), MONTHS[(mo+11)%12]+' '+(mo?y:y-1)];
    case 'quarter': { const q=Math.floor(mo/3)*3; return [first(y,q), last(y,q+2), `${Math.floor(mo/3)+1}. kwartał ${y}`]; }
    case 'year': return [`${y}-01-01`, `${y}-12-31`, `Rok ${y}`];
    case 'custom': { const a=r.from||first(y,mo), b=r.to||T; return a<=b?[a,b,`${fmtNum(a)} – ${fmtNum(b)}`]:[b,a,`${fmtNum(b)} – ${fmtNum(a)}`]; }
    default: return [first(y,mo), last(y,mo), MONTHS[mo]+' '+y];
  }
}
function reportData(){
  const [a,b,label]=periodRange(UI.rep); const area=UI.rep.area;
  const live=tasksArr().filter(t=>!area||taskArea(t)===area);
  const inR = d => d && d>=a && d<=b;
  const done=[]; // {t, at(date), due}
  live.forEach(t=>{
    if(isDone(t) && t.completedAt && inR(ymd(new Date(t.completedAt)))) done.push({t, at:ymd(new Date(t.completedAt)), due:t.due});
    (t.doneLog||[]).forEach(x=>{ const at=ymd(new Date(x.at)); if(inR(at)) done.push({t, at, due:x.due}); });
  });
  const withDue=done.filter(x=>x.due); const onTime=withDue.filter(x=>x.at<=x.due).length;
  const created=live.filter(t=>t.createdAt && inR(ymd(new Date(t.createdAt)))).length;
  const entries=[]; live.forEach(t=>(t.time||[]).forEach(e=>{ if(inR(e.date)) entries.push({...e, t}); }));
  entries.sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:(y.createdAt||0)-(x.createdAt||0));
  const lateNow=live.filter(t=>!isClosed(t) && dueState(t)==='late');
  return {a,b,label,live,done,withDue,onTime,created,entries,lateNow, minutes:entries.reduce((s,e)=>s+(+e.min||0),0)};
}

  else h+=`<p class="muted" style="font-size:13px">Dodaj pracowników, aby zobaczyć ich wyniki.</p>`;

  // entries

};
const HEALTH={ok:{l:'Zgodnie z planem',c:'var(--ok)'}, risk:{l:'Zagrożony',c:'var(--warn)'}, late:{l:'Po terminie',c:'var(--danger)'}, blocked:{l:'Zablokowany',c:'#B4436C'},
  wait:{l:'Czeka',c:'#D39A26'}, stale:{l:'Bez ruchu',c:'#A88B4A'}, hold:{l:'Wstrzymany',c:'var(--fg-3)'}, idea:{l:'Pomysł',c:'#8B7FD6'}, done:{l:'Zakończony',c:'var(--ok)'}};

/* ---------- helpers ---------- */
const pLive = p => p && !['done','archived'].includes(p.status);
const pPrio = p => PPRI[p?.prio] ? +p.prio : 3;
const pSt   = p => PSTAT_META[p?.status] ? p.status : 'active';
function pPhases(p){ return Array.isArray(p?.phases) ? p.phases : []; }
function pPhaseIdx(p){ const ph=pPhases(p); if(!ph.length) return -1; let i=ph.findIndex(x=>x.id===p.phaseId); if(i<0) i=ph.findIndex(x=>!x.done); return i<0 ? ph.length-1 : i; }
function pPhase(p){ const i=pPhaseIdx(p); return i<0?null:pPhases(p)[i]; }
function pParent(p){ const q=p?.parentId && S.projects.get(p.parentId); return q && q.id!==p.id ? q : null; }
function pChildren(id, withArchived){ return [...S.projects.values()].filter(x=>x.parentId===id && x.id!==id && (withArchived || x.status!=='archived')); }
function pCanBeParent(p){ return p && !pParent(p); }
function pLabel(p){ const q=pParent(p); return q ? `${q.name} ▸ ${p.name}` : p.name; }
function pStats(p){
  const ids=new Set([p.id, ...pChildren(p.id).map(c=>c.id)]);
  const ts=tasksArr().filter(t=>ids.has(t.projectId) && statusById(t.status).type!=='cancelled');
  const done=ts.filter(isDone).length, late=ts.filter(t=>dueState(t)==='late').length;
  const waiting=ts.filter(t=>!isClosed(t) && statusById(t.status).type==='waiting');
  const nextMs=sortTasks(ts.filter(t=>t.milestone && !isClosed(t) && t.due),'due')[0]||null;
  const pct = p.status==='done' ? 100 : (ts.length ? Math.round(done/ts.length*100) : (pPhases(p).length ? Math.round(pPhases(p).filter(x=>x.done).length/pPhases(p).length*100) : 0));
  const lastDone = ts.filter(t=>isDone(t) && t.completedAt).sort((a,b)=>b.completedAt-a.completedAt)[0]||null;
  return {total:ts.length, done, open:ts.length-done, late, pct, waiting, nextMs, lastDone, ts};
}
function pLastActivity(p){ let m=p.updatedAt||p.createdAt||0; const ids=new Set([p.id, ...pChildren(p.id).map(c=>c.id)]); for(const t of S.tasks.values()) if(ids.has(t.projectId) && (t.updatedAt||0)>m) m=t.updatedAt; return m; }
function pIdleDays(p){ const m=pLastActivity(p); return m ? Math.floor((Date.now()-m)/86400000) : 0; }
function pBlockers(p){ return (p.dependsOn||[]).map(id=>S.projects.get(id)).filter(d=>d && d.id!==p.id && pLive(d)); }
function pBlocks(p){ return [...S.projects.values()].filter(x=>x.status!=='archived' && (x.dependsOn||[]).includes(p.id)); }
function pDates(p, st){
  const ds=(st||pStats(p)).ts.map(t=>t.due).filter(Boolean).sort();
  const s0=p.start || ds[0] || ymd(new Date(p.createdAt||Date.now()));
  let e0=p.due || ds[ds.length-1] || addDays(s0,30); if(e0<s0) e0=s0;
  return {s:s0, e:e0, planned:!!(p.start&&p.due)};
}
function pHealth(p, st){
  st=st||pStats(p); const T=today(); const s=pSt(p);
  if(s==='done'||s==='archived') return {k:'done', l:'Zakończony'};
  if(s==='onhold') return {k:'hold', l:'Wstrzymany'};
  if(s==='idea') return {k:'idea', l:'Pomysł'};
  const bl=pBlockers(p); if(bl.length && (s==='active'||s==='planned')) return {k:'blocked', l:`Czeka na projekt: ${bl[0].name}`};
  if(s==='waiting') return {k:'wait', l:p.waitingFor?`Czeka na: ${p.waitingFor}`:'Czeka na odpowiedź'};
  if(p.due && p.due<T) return {k:'late', l:`Po terminie ${diffDays(p.due,T)} dni`};
  if(st.late) return {k:'risk', l:`${st.late} ${plural(st.late,'zadanie','zadania','zadań')} po terminie`};
  if(s==='active' && p.start && p.due && p.start<=T){ const el=diffDays(p.start,T)/Math.max(1,diffDays(p.start,p.due)); if(el>0.3 && el*100-st.pct>35) return {k:'risk', l:'Postęp poniżej planu'}; }
  const idle=pIdleDays(p); if(s==='active' && idle>=21) return {k:'stale', l:`Bez ruchu ${idle} dni`};
  return {k:'ok', l:'Zgodnie z planem'};
}
function pRankSorted(list){ return list.slice().sort((a,b)=>(a.rank??1e9)-(b.rank??1e9) || pPrio(a)-pPrio(b) || (a.due||'9999').localeCompare(b.due||'9999') || alpha(a.name,b.name)); }
function pRankMap(){ const m=new Map(); pRankSorted([...S.projects.values()].filter(pLive)).forEach((p,i)=>m.set(p.id,i+1)); return m; }
/* parent first, then its subprojects — used by the sidebar, pickers and the timeline */
function projTree(list, sorter){
  sorter=sorter||(l=>l); const set=new Set(list.map(p=>p.id)); const out=[];
  sorter(list.filter(p=>!p.parentId || !set.has(p.parentId) || p.parentId===p.id)).forEach(p=>{ out.push({p, depth:0}); sorter(list.filter(c=>c.parentId===p.id && c.id!==p.id)).forEach(c=>out.push({p:c, depth:1})); });
  return out;
}
function relDays(d){ const n=diffDays(today(), d); if(n===0) return 'dziś'; if(n===1) return 'jutro'; if(n===-1) return 'wczoraj'; if(n>0) return `za ${n} ${plural(n,'dzień','dni','dni')}`; return `${-n} ${plural(-n,'dzień','dni','dni')} temu`; }
function agoTxt(ms){ if(!ms) return ''; const d=Math.floor((Date.now()-ms)/86400000); if(d<=0) return 'dziś'; if(d===1) return 'wczoraj'; return `${d} dni temu`; }

/* ---------- state ---------- */
UI.pf = Object.assign({view:'board', area:'all', scope:'all', subs:true, done:false, q:'', zoom:6, mapZ:1}, lsGet('wk.pf', {}));
function savePF(){ lsSet('wk.pf', {view:UI.pf.view, area:UI.pf.area, scope:UI.pf.scope, subs:UI.pf.subs, done:UI.pf.done, zoom:UI.pf.zoom, mapZ:UI.pf.mapZ}); }
function pfList(){
  const q=norm(UI.pf.q||'');
  return [...S.projects.values()].filter(p=>{
    if(p.status==='archived') return false;
    if(p.status==='done' && !UI.pf.done) return false;
    if(UI.pf.area!=='all' && (p.area||'work')!==UI.pf.area) return false;
    if(UI.pf.scope==='client' && !p.clientId && !(pParent(p)?.clientId)) return false;
    if(UI.pf.scope==='internal' && (p.clientId || pParent(p)?.clientId)) return false;
    if(!UI.pf.subs && pParent(p)) return false;
    if(q && !norm(`${p.name} ${p.code||''} ${pParent(p)?.name||''} ${p.nextStep||''} ${p.waitingFor||''} ${p.clientId?clientName(p.clientId):''}`).includes(q)) return false;
    return true;
  });
}

/* ---------- actions ---------- */
function setProjectStatus(id, st, opts={}){
  const p=S.projects.get(id); if(!p || p.status===st) return;
  if(st==='waiting' && !opts.silent) return openWaitingModal(id, st);
  upd('projects', id, x=>{ const was=x.status; x.status=st; if(st!=='waiting'){ if(was==='waiting'){ x.waitingDone=today(); } x.waitingSince=null; } if(st==='done') x.doneAt=today(); });
  toast(`${p.name}: ${PSTAT_META[st].l}`, {action:'Cofnij', onAction:()=>upd('projects', id, x=>{ x.status=p.status; x.waitingSince=p.waitingSince||null; })});
}
function pfMoveRank(id, targetId, before){
  const mv=S.projects.get(id); if(!mv || id===targetId) return;
  const list=pRankSorted([...S.projects.values()].filter(pLive)).filter(x=>x.id!==id);
  let i=list.findIndex(x=>x.id===targetId); if(i<0) i=list.length; else if(!before) i++;
  list.splice(i,0,mv);
  list.forEach((p,k)=>{ if(p.rank!==k+1) upd('projects', p.id, x=>{ x.rank=k+1; }); });
}
function pfStep(id, dir){
  const list=pRankSorted([...S.projects.values()].filter(pLive)); const i=list.findIndex(x=>x.id===id); const j=i+dir;
  if(i<0||j<0||j>=list.length) return; pfMoveRank(id, list[j].id, dir<0);
}
function setPhase(pid, phId){
  upd('projects', pid, x=>{ const ph=pPhases(x); const i=ph.findIndex(z=>z.id===phId); if(i<0) return; x.phaseId=phId; x.phases=ph.map((z,k)=>({...z, done: k<i ? true : (k===i ? false : z.done && false)})); });
  const p=S.projects.get(pid); const ph=pPhase(p); if(ph) toast(`Bieżący etap: ${ph.name}`);
}
function completePhase(pid){
  const p=S.projects.get(pid); const i=pPhaseIdx(p); const ph=pPhases(p); if(i<0) return;
  if(i===ph.length-1){ upd('projects', pid, x=>{ x.phases=pPhases(x).map(z=>({...z, done:true})); }); toast('Wszystkie etapy zakończone', {action:'Zamknij projekt', onAction:()=>setProjectStatus(pid,'done')}); return; }
  upd('projects', pid, x=>{ x.phases=pPhases(x).map((z,k)=>k<=i?{...z, done:true}:z); x.phaseId=ph[i+1].id; });
  toast(`Etap „${ph[i].name}” zakończony → ${ph[i+1].name}`);
}

function openWaitingModal(id, setStatus){
  const p=S.projects.get(id); if(!p) return;
  const m=openModal(`<div class="modal-h"><h2>Czeka na kogoś</h2><button class="icon-btn" type="button" data-close aria-label="Zamknij">${ico('i-x')}</button></div>
  <form class="modal-b form" id="wm-form">
    <p class="full muted" style="font-size:13px;margin:0">${esc(p.name)} — zapisz, na kogo lub na co czekamy, żeby było widać, że piłka jest po drugiej stronie.</p>
    <label class="full">Na kogo / na co czekamy<input class="inp" id="wm-who" value="${esc(p.waitingFor||'')}" placeholder="np. Comarch — opinia o formacie eksportu" autofocus></label>
    <label>Od kiedy<input class="inp" type="date" id="wm-since" value="${esc(p.waitingSince||today())}"></label>
    <label>Ponowić kontakt<input class="inp" type="date" id="wm-follow" value="${esc(p.followUp||addDays(today(),5))}"></label>
    <p class="full muted" style="font-size:12px;margin:0">W dniu „Ponowić kontakt” projekt pojawi się w podpowiedziach rankingu, a na karcie zobaczysz przypomnienie.</p>
  </form>
  <div class="modal-f">${p.status==='waiting'?`<button class="btn" type="button" id="wm-back" style="margin-right:auto">${ico('i-check','s14')}Mamy odpowiedź — wracamy do pracy</button>`:''}<button class="btn" type="button" data-close>Anuluj</button><button class="btn primary" type="button" id="wm-save">Zapisz</button></div>`);
  m.querySelector('#wm-save').addEventListener('click', ()=>{
    const who=m.querySelector('#wm-who').value.trim(); if(!who){ m.querySelector('#wm-who').focus(); toast('Wpisz, na kogo czekamy'); return; }
    upd('projects', id, x=>{ x.status='waiting'; x.waitingFor=who; x.waitingSince=m.querySelector('#wm-since').value||today(); x.followUp=m.querySelector('#wm-follow').value||null; });
    closeModal(); toast(`${p.name}: czeka na ${who}`);
  });
  m.querySelector('#wm-back')?.addEventListener('click', ()=>{ closeModal(); setProjectStatus(id,'active'); });
}
function openNextStepModal(id){
  const p=S.projects.get(id); if(!p) return;
  const m=openModal(`<div class="modal-h"><h2>Gdzie jestem / następny krok</h2><button class="icon-btn" type="button" data-close aria-label="Zamknij">${ico('i-x')}</button></div>
  <form class="modal-b form"><p class="full muted" style="font-size:13px;margin:0">${esc(pLabel(p))}</p>
  <label class="full">Następny krok<textarea class="inp" id="ns-txt" rows="3" placeholder="np. Przesłać projekt regulaminu do akceptacji wspólnika" autofocus>${esc(p.nextStep||'')}</textarea></label></form>
  <div class="modal-f"><button class="btn" type="button" data-close>Anuluj</button><button class="btn primary" type="button" id="ns-save">Zapisz</button></div>`);
  m.querySelector('#ns-save').addEventListener('click', ()=>{ const v=m.querySelector('#ns-txt').value.trim(); upd('projects', id, x=>{ x.nextStep=v; x.nextStepAt=Date.now(); }); closeModal(); toast('Zapisano następny krok'); });
}
function projectPicker(el, exclude, selected, onToggle, opts={}){
  const list=projTree(sorted('projects').filter(p=>p.status!=='archived' && !exclude.includes(p.id) && (!opts.filter || opts.filter(p))), l=>pRankSorted(l));
  menu(el, list.length ? list.map(({p,depth})=>({label:(depth?'↳ ':'')+p.name, color:p.color, right:PSTAT_META[pSt(p)].l, multi:!opts.single, on:selected.includes(p.id), action:on=>onToggle(p.id,on)})) : [{label:'Brak projektów do wyboru', disabled:true}], {search:true});
}
function pfMenu(el, id){
  const p=S.projects.get(id); if(!p) return;
  const items=[{header:'Status'}, ...PF_COLS.map(k=>({label:PSTAT_META[k].l, color:PSTAT_META[k].c, on:pSt(p)===k, action:()=>setProjectStatus(id,k)})),
    {sep:true}, {label:'Następny krok…', icon:'i-note', action:()=>openNextStepModal(id)},
    ...(pPhases(p).length?[{label:'Zakończ bieżący etap', icon:'i-check', action:()=>completePhase(id)}]:[]),
    {label:'Priorytet: '+PPRI[pPrio(p)].l, icon:'i-flag', action:()=>setTimeout(()=>menu(el, [1,2,3,4].map(k=>({label:PPRI[k].l, color:PPRI[k].c, on:pPrio(p)===k, action:()=>upd('projects',id,x=>{x.prio=k;})}))),0)},
    {label:'W górę rankingu', icon:'i-chevu', action:()=>pfStep(id,-1)}, {label:'W dół rankingu', icon:'i-chevd', action:()=>pfStep(id,1)},
    {sep:true}, ...(pCanBeParent(p)?[{label:'Dodaj podprojekt', icon:'i-sub', action:()=>openProjectModal(null, null, {parentId:id})}]:[]),
    {label:'Edytuj projekt…', icon:'i-gear', action:()=>openProjectModal(id)}, {label:'Otwórz', icon:'i-chev', action:()=>go('project:'+id)}];
  menu(el, items);
}

/* ---------- small renderers ---------- */
function pfStatusPill(p, act){ const m=PSTAT_META[pSt(p)]; return `<button type="button" class="pfs" style="--sc:${m.c}" ${act?`data-act="pf-menu" data-id="${p.id}"`:'tabindex="-1"'}><i></i>${m.l}</button>`; }
function prioPill(p){ const k=pPrio(p); return k===3?'':`<span class="pfp p${k}" title="Priorytet projektu">${PPRI[k].l}</span>`; }
function healthDot(h, compact){ const quiet=compact && ['ok','done','hold','idea'].includes(h.k); return `<span class="pfh h-${h.k} ${quiet?'quiet':''}" title="${esc(h.l)}"><i></i>${quiet?'':esc(HEALTH[h.k].l)}</span>`; }
function phaseBar(p, big){
  const ph=pPhases(p); if(!ph.length) return ''; const i=pPhaseIdx(p);
  return `<div class="pfph ${big?'big':''}" title="Etap ${i+1} z ${ph.length}: ${esc(ph[i].name)}">${ph.map((z,k)=>`<i class="${z.done||k<i?'d':''} ${k===i?'c':''}"></i>`).join('')}</div>`;
}
function dueChip(p){ if(!p.due) return ''; const T=today(); const n=diffDays(T,p.due); const cls= pLive(p) && n<0 ? 'late' : (pLive(p) && n<=14 ? 'soon':''); return `<span class="pfd ${cls}" title="Termin zakończenia ${fmtNum(p.due)}">${ico('i-flag','s14')}${n<0&&pLive(p)?`${-n} dni po terminie`:fmtDate(p.due)}</span>`; }
function miniRing(pct, color){ const r=13, c=2*Math.PI*r; return `<svg class="mring" viewBox="0 0 32 32"><circle cx="16" cy="16" r="${r}" fill="none" stroke="var(--sunken)" stroke-width="4"/><circle cx="16" cy="16" r="${r}" fill="none" stroke="${esc(color)}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 16 16)"/><text x="16" y="19.5" text-anchor="middle">${pct}</text></svg>`; }

function pfCard(p, rk){
  const st=pStats(p), h=pHealth(p,st), par=pParent(p), kids=pChildren(p.id), ph=pPhase(p), T=today();
  const waitDays=p.status==='waiting'&&p.waitingSince?diffDays(p.waitingSince,T):null;
  const follow=p.status==='waiting'&&p.followUp&&p.followUp<=T;
  const bl=pBlockers(p);
  return `<article class="pfc h-${h.k} s-${pSt(p)}" style="--pc:${esc(p.color||'#888')}" data-nav="project:${p.id}" data-drag="pf:${p.id}" data-drag-label="${esc(p.name)}" data-drop="pfrow:${p.id}" tabindex="0">
    <div class="pfc-top"><span class="pfc-rank" title="Miejsce w rankingu ważności">${rk.get(p.id)?'#'+rk.get(p.id):'—'}</span>${prioPill(p)}<span class="sp"></span>${healthDot(h,true)}<button type="button" class="icon-btn pfc-more" data-act="pf-menu" data-id="${p.id}" aria-label="Opcje">${ico('i-more','s14')}</button></div>
    ${par?`<div class="pfc-par" style="--pp:${esc(par.color||'#888')}">${esc(par.name)} ▸</div>`:''}
    <h4>${esc(p.name)}</h4>
    ${p.clientId?`<div class="pfc-cl">${ico('i-client','s14')}${esc(clientName(p.clientId))}</div>`:''}
    ${ph?`<div class="pfc-phase"><span>Etap ${pPhaseIdx(p)+1}/${pPhases(p).length}</span><b>${esc(ph.name)}</b></div>${phaseBar(p)}`:''}
    ${p.status==='waiting'?`<div class="pfc-wait ${follow?'due':''}">${ico('i-clock','s14')}<span><b>Czeka na:</b> ${esc(p.waitingFor||'—')}${waitDays!=null?` · ${waitDays} ${plural(waitDays,'dzień','dni','dni')}`:''}${p.followUp?`<br><small>${follow?'Czas ponowić kontakt':'Ponowić'}: ${fmtDate(p.followUp)}</small>`:''}</span></div>`:''}
    ${bl.length&&p.status!=='waiting'?`<div class="pfc-wait blk">${ico('i-lock','s14')}<span><b>Czeka na projekt:</b> ${bl.map(b=>esc(b.name)).join(', ')}</span></div>`:''}
    ${p.nextStep?`<div class="pfc-next"><span>Następny krok</span>${esc(p.nextStep)}</div>`:(pLive(p)&&p.status!=='idea'?`<button type="button" class="pfc-next empty" data-act="pf-next" data-id="${p.id}">+ Dopisz następny krok</button>`:'')}
    ${kids.length?`<div class="pfc-kids">${pRankSorted(kids).map(c=>`<button type="button" class="kid" data-nav="project:${c.id}" style="--sc:${PSTAT_META[pSt(c)].c}" title="${esc(c.name)} — ${PSTAT_META[pSt(c)].l}"><i></i>${esc(c.name.replace(/^Moduł:\s*/i,''))}</button>`).join('')}</div>`:''}
    <div class="pfc-foot">${miniRing(st.pct, p.color||'var(--accent)')}<span class="muted mono" title="Zadania zakończone / wszystkie">${st.done}/${st.total}</span>${st.nextMs?`<span class="pfm-ms" title="Najbliższy kamień milowy: ${esc(st.nextMs.title)}">${ico('i-diamond','s14')}${fmtDate(st.nextMs.due)}</span>`:''}<span class="sp"></span>${dueChip(p)}${(p.members||[]).length?avatars(p.members,3):''}</div>
  </article>`;
}

    <div class="seg sm">${[['all','Wszystkie'],['internal','Wewnętrzne'],['client','Klientów']].map(([k,l])=>`<button type="button" class="${UI.pf.scope===k?'on':''}" data-act="pf-scope" data-v="${k}">${l}</button>`).join('')}</div>
    <button type="button" class="ctl ${UI.pf.subs?'on':''}" data-act="pf-subs">${ico('i-sub','s14')}Podprojekty</button>

    <label class="pf-q">${ico('i-search','s14')}<input id="pf-q" value="${esc(UI.pf.q||'')}" placeholder="Szukaj projektu…" autocomplete="off"></label>
  </div>`;
  if(!S.projects.size) return h+emptyState('Brak projektów','Dodaj pierwszy projekt — może mieć podprojekty, etapy, ranking ważności i zależności.',`<button class="btn primary" type="button" data-act="add-project">${ico('i-plus','s14')}Nowy projekt</button>`);
  if(v==='gantt') h+=pfGantt(all, rk);
  else if(v==='map') h+=pfMap(all, rk);
  else if(v==='rank') h+=pfRanking(all, rk);
  else h+=pfBoard(all, rk);
  return h;
}

/* ---------- Tablica ---------- */
function pfBoard(list, rk){
  const cols=PF_COLS.filter(k=>k!=='done'||UI.pf.done);
  return `<div class="pfb">${cols.map(k=>{ const it=pRankSorted(list.filter(p=>pSt(p)===k)); const m=PSTAT_META[k];
    return `<section class="pfcol" data-drop="pfcol:${k}" style="--cc:${m.c}"><header><span class="cdot"></span><h3>${m.l}</h3><span class="n">${it.length}</span>${k==='idea'||k==='planned'?`<button type="button" class="icon-btn" data-act="pf-add" data-st="${k}" title="Nowy projekt w tej kolumnie" aria-label="Nowy projekt">${ico('i-plus','s14')}</button>`:''}</header>
      <div class="pfcol-b">${it.map(p=>pfCard(p, rk)).join('') || `<div class="pf-empty">${m.hint}</div>`}</div></section>`; }).join('')}</div>`;
}

/* ---------- Oś czasu (Gantt) ---------- */
function pfGantt(list, rk){
  const T=today(); const months=+UI.pf.zoom||6;
  if(!UI.pf.gStart){ const d=D(T); d.setDate(1); d.setMonth(d.getMonth()-(months>=12?2:1)); UI.pf.gStart=ymd(d); }
  const start=UI.pf.gStart, end=addMonths(start, months), total=diffDays(start,end);
  const W=Math.max(2.4, Math.min(16, 1150/total)); const LW=matchMedia('(max-width:900px)').matches?176:290, RH=50, HH=46;
  const x=d=>Math.round(diffDays(start,d)*W);
  const rows=projTree(list, l=>pRankSorted(l));
  const ix=new Map(rows.map((r,i)=>[r.p.id,i]));
  const width=Math.round(total*W);
  let head=`<div class="pfg-head" style="height:${HH}px"><div class="pfg-lab hdr" style="width:${LW}px">Projekt · ranking</div><div class="pfg-scale" style="width:${width}px">`;
  for(let i=0;i<months;i++){ const a=addMonths(start,i), b=addMonths(start,i+1); head+=`<div class="mo" style="left:${x(a)}px;width:${x(b)-x(a)}px">${MONTHS[D(a).getMonth()]}${months<=6||D(a).getMonth()===0?' '+D(a).getFullYear():''}</div>`; }
  head+=`</div></div>`;
  let grid=''; for(let i=1;i<months;i++) grid+=`<div class="pfg-grid" style="left:${LW+x(addMonths(start,i))}px"></div>`;
  if(months<=3){ let d=startOfWeek(start); while(d<end){ if(d>start) grid+=`<div class="pfg-grid wk" style="left:${LW+x(d)}px"></div>`; d=addDays(d,7); } }
  const todayL = T>=start&&T<end ? `<div class="pfg-today" style="left:${LW+x(T)}px"><span>dziś</span></div>` : '';
  let body='', undated=[];
  const geo=new Map();
  rows.forEach(({p,depth},i)=>{
    const st=pStats(p), dt=pDates(p,st), h=pHealth(p,st); const ph=pPhases(p), pi=pPhaseIdx(p);
    const a=dt.s<start?start:dt.s, b=dt.e>=end?addDays(end,-1):dt.e;
    const vis = b>=start && a<end;
    geo.set(p.id,{i, x1:LW+x(dt.s), x2:LW+x(dt.e)+W, s:dt.s, e:dt.e});
    let track='';
    if(vis){
      const L=x(a), Wd=Math.max(10, x(b)-x(a)+W);
      let segs='';
      if(ph.length){
        const hasD=ph.every(z=>z.start&&z.due);
        ph.forEach((z,k)=>{ let s1,s2; if(hasD){ s1=Math.max(0,x(z.start)-L); s2=Math.min(Wd, x(z.due)+W-L); } else { s1=Wd*k/ph.length; s2=Wd*(k+1)/ph.length; }
          if(s2>s1) segs+=`<i class="seg ${z.done||k<pi?'d':''} ${k===pi?'c':''}" style="left:${s1}px;width:${s2-s1}px" title="${esc(z.name)}"></i>`; });
      }
      track+=`<div class="pfg-bar s-${pSt(p)} h-${h.k} ${depth?'sub':''} ${dt.planned?'':'est'}" style="left:${L}px;width:${Wd}px;--pc:${esc(p.color||'#888')}" data-nav="project:${p.id}" title="${esc(p.name)} · ${fmtNum(dt.s)} – ${fmtNum(dt.e)} · ${st.pct}%${dt.planned?'':' · daty szacowane z zadań'}">
        <span class="fill" style="width:${st.pct}%"></span>${segs}<span class="bl">${esc(ph.length&&pi>=0?ph[pi].name:(st.pct+'%'))}</span></div>`;
      st.ts.filter(t=>t.milestone && t.due && t.due>=start && t.due<end && t.projectId===p.id).forEach(t=>{ track+=`<div class="pfg-ms ${isDone(t)?'done':''} ${dueState(t)==='late'?'late':''}" style="left:${x(t.due)+W/2}px" data-act="open" data-id="${t.id}" title="${esc(t.title)} · ${fmtNum(t.due)}"></div>`; });
    }
    if(!p.start && !p.due && !st.ts.some(t=>t.due)) undated.push(p);
    body+=`<div class="pfg-row ${depth?'sub':''} ${i%2?'alt':''}" style="height:${RH}px"><div class="pfg-lab" style="width:${LW}px" data-nav="project:${p.id}">
      <span class="rk">${rk.get(p.id)||'—'}</span><span class="dot" style="background:${esc(p.color||'#888')}"></span>
      <span class="nm"><b>${esc(p.name)}</b><small>${PSTAT_META[pSt(p)].l}${pPhase(p)?' · '+esc(pPhase(p).name):''}</small></span>${healthDot(h)}</div>
      <div class="pfg-track" style="width:${width}px">${track}</div></div>`;
  });
  /* dependency arrows */
  let svg='';
  rows.forEach(({p})=>{ const g=geo.get(p.id); (p.dependsOn||[]).forEach(did=>{ const d=geo.get(did); if(!d) return;
    const y1=HH+d.i*RH+RH/2, y2=HH+g.i*RH+RH/2; const x1=d.x2, x2=g.x1; const dep=S.projects.get(did);
    const conflict = pLive(dep) && g.s<=d.e && pLive(p); const cls = !pLive(dep)?'ok':(conflict?'bad':'dep');
    const mx=Math.max(26, Math.abs(x2-x1)/2);
    svg+=`<path class="pfg-dep ${cls}" d="M${x1} ${y1} C${x1+mx} ${y1}, ${x2-mx} ${y2}, ${x2-4} ${y2}" marker-end="url(#pfa-${cls})"><title>${esc(dep.name)} → ${esc(p.name)}${conflict?' · start przed zakończeniem projektu, od którego zależy':''}</title></path>`; }); });
  const H=HH+rows.length*RH;
  const mk=c=>`<marker id="pfa-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah-${c}"/></marker>`;
  let h=`<div class="pfg-tools"><button class="icon-btn bordered" type="button" data-act="pf-gprev" aria-label="Wcześniej">${ico('i-chevl')}</button><button class="btn sm" type="button" data-act="pf-gtoday">Dziś</button><button class="icon-btn bordered" type="button" data-act="pf-gnext" aria-label="Później">${ico('i-chev')}</button>
    <div class="seg sm">${[3,6,12].map(n=>`<button type="button" class="${months===n?'on':''}" data-act="pf-zoom" data-v="${n}">${n} mies.</button>`).join('')}</div>
    <span class="sp"></span><div class="legend"><span><i class="lg-ph"></i>Etapy</span><span><i style="background:var(--brass);transform:rotate(45deg)"></i>Kamień milowy</span><span><i class="lg-dep"></i>Zależność</span><span><i class="lg-bad"></i>Konflikt terminów</span><span><i class="lg-est"></i>Daty szacowane</span></div></div>`;
  h+=`<div class="pfg-wrap"><div class="pfg" style="width:${LW+width}px;height:${H}px">${grid}${todayL}${head}${body}<svg class="pfg-svg" width="${LW+width}" height="${H}"><defs>${mk('dep')+mk('bad')+mk('ok')}</defs>${svg}</svg></div></div>`;
  if(undated.length) h+=`<p class="muted" style="font-size:12.5px;margin-top:10px">Bez dat (paski szacowane): ${undated.map(p=>`<button type="button" class="link" data-act="edit-project" data-id="${p.id}">${esc(p.name)}</button>`).join(', ')} — ustaw start i termin w projekcie.</p>`;
  return h;
}

/* ---------- Mapa powiązań ---------- */
function pfMap(list, rk){
  if(!list.length) return emptyState('Brak projektów w filtrze','Zmień filtry powyżej.','');
  const ids=new Set(list.map(p=>p.id)); const edges=[];
  list.forEach(p=>{ if(p.parentId && ids.has(p.parentId) && p.parentId!==p.id) edges.push({a:p.parentId, b:p.id, t:'sub'}); (p.dependsOn||[]).forEach(d=>{ if(ids.has(d) && d!==p.id){ const dp=S.projects.get(d); edges.push({a:d, b:p.id, t: !pLive(dp)?'done':(pLive(p)?'block':'dep')}); } }); });
  const lvl=new Map(list.map(p=>[p.id,0]));
  for(let k=0;k<list.length;k++){ let ch=false; edges.forEach(e=>{ const v=Math.min(list.length, lvl.get(e.a)+1); if(v>lvl.get(e.b)){ lvl.set(e.b,v); ch=true; } }); if(!ch) break; }
  const L=Math.max(...lvl.values());
  const NW=256, NH=136, GX=104, GY=22, PAD=28;
  const cols=[]; for(let i=0;i<=L;i++) cols.push([]);
  const ranked=pRankSorted(list); ranked.forEach(p=>cols[lvl.get(p.id)].push(p));
  const pos=new Map();
  cols.forEach((c,ci)=>{
    if(ci>0){ const bc=p=>{ const pr=edges.filter(e=>e.b===p.id).map(e=>pos.get(e.a)?.y).filter(v=>v!=null); return pr.length? pr.reduce((s,v)=>s+v,0)/pr.length : 1e6; }; c.sort((a,b)=>bc(a)-bc(b)); }
    c.forEach((p,ri)=>pos.set(p.id,{x:PAD+ci*(NW+GX), y:PAD+ri*(NH+GY)}));
  });
  const Wt=PAD*2+(L+1)*NW+L*GX, Ht=PAD*2+Math.max(...cols.map(c=>c.length))*(NH+GY)-GY;
  const z=+UI.pf.mapZ||1;
  let svg=''; edges.forEach(e=>{ const A=pos.get(e.a), B=pos.get(e.b); const x1=A.x+NW, y1=A.y+NH/2, x2=B.x, y2=B.y+NH/2; const mx=GX*0.62;
    svg+=`<path class="pfe e-${e.t}" data-a="${e.a}" data-b="${e.b}" d="M${x1} ${y1} C${x1+mx} ${y1}, ${x2-mx} ${y2}, ${x2-3} ${y2}" ${e.t!=='sub'?`marker-end="url(#pfm-${e.t})"`:''}></path>`;
    if(e.t==='block') svg+=`<circle class="pfe-dot" r="3.2" data-a="${e.a}" data-b="${e.b}"><animateMotion dur="2.6s" repeatCount="indefinite" path="M${x1} ${y1} C${x1+mx} ${y1}, ${x2-mx} ${y2}, ${x2-3} ${y2}"/></circle>`; });
  const mk=c=>`<marker id="pfm-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mh-${c}"/></marker>`;
  const nodes=ranked.map(p=>{ const P=pos.get(p.id), st=pStats(p), h=pHealth(p,st), ph=pPhase(p);
    return `<div class="pfn h-${h.k} s-${pSt(p)} ${pParent(p)?'child':''}" data-id="${p.id}" data-nav="project:${p.id}" style="left:${P.x}px;top:${P.y}px;width:${NW}px;height:${NH}px;--pc:${esc(p.color||'#888')};--d:${(lvl.get(p.id)*60)}ms" tabindex="0">
      <div class="pfn-top"><span class="pfc-rank">${rk.get(p.id)?'#'+rk.get(p.id):'—'}</span>${pfStatusPill(p,false)}<span class="sp"></span>${miniRing(st.pct, p.color||'var(--accent)')}</div>
      <h4>${esc(p.name)}</h4>
      ${ph?`<div class="pfn-ph">${esc(ph.name)}</div>${phaseBar(p)}`:`<div class="pfn-ph muted">${p.nextStep?esc(p.nextStep):'—'}</div>`}
      <div class="pfn-foot">${healthDot(h)}<span class="sp"></span>${dueChip(p)}</div></div>`; }).join('');
  let h=`<div class="pfg-tools"><div class="seg sm">${[[0.7,'70%'],[0.85,'85%'],[1,'100%']].map(([k,l])=>`<button type="button" class="${z===k?'on':''}" data-act="pf-mapz" data-v="${k}">${l}</button>`).join('')}</div><span class="sp"></span>
    <div class="legend"><span><i class="lg-sub"></i>Podprojekt</span><span><i class="lg-dep"></i>Zależność</span><span><i class="lg-block"></i>Blokuje (w toku)</span><span><i class="lg-done"></i>Spełniona</span></div></div>`;
  h+=`<div class="pfm-wrap"><div class="pfm-stage" style="width:${Wt*z}px;height:${Ht*z}px"><div class="pfm" style="width:${Wt}px;height:${Ht}px;transform:scale(${z})">
    <svg class="pfm-svg" width="${Wt}" height="${Ht}"><defs>${mk('dep')+mk('block')+mk('done')}</defs>${svg}</svg>${nodes}</div></div></div>`;
  if(!edges.length) h+=`<p class="muted" style="font-size:12.5px;margin-top:10px">Brak powiązań w filtrze. Ustaw w projekcie „Projekt nadrzędny” albo „Zależy od”, aby zobaczyć linie zależności.</p>`;
  return h;
}

/* ---------- Ranking ---------- */
const pfWip = () => +(S.settings.pfWip||5);
function pfRanking(list, rk){
  const live=pRankSorted(list.filter(pLive)); const T=today();
  let h=`<div class="pfr-grid"><div class="panel pfr-list"><div class="panel-h"><h3>Ranking ważności</h3><span class="muted" style="font-size:12px">Przeciągnij wyżej lub niżej · 1 = najważniejszy</span></div>`;
  h+= live.length ? live.map(p=>{ const st=pStats(p), hh=pHealth(p,st), par=pParent(p), ph=pPhase(p);
    return `<div class="pfr s-${pSt(p)}" data-drag="pf:${p.id}" data-drag-label="${esc(p.name)}" data-drop="pfrow:${p.id}" style="--pc:${esc(p.color||'#888')}">
      <span class="grip">${ico('i-grip','s14')}</span><span class="pfr-no">${rk.get(p.id)}</span>
      <div class="pfr-main" data-nav="project:${p.id}"><div class="pfr-t">${par?`<small>${esc(par.name)} ▸</small>`:''}<b>${esc(p.name)}</b>${prioPill(p)}</div>
        <div class="pfr-m">${pfStatusPill(p,true)}${ph?`<span class="pfr-ph">${ico('i-stages','s14')}${esc(ph.name)}</span>`:''}${dueChip(p)}${healthDot(hh,true)}</div>
        ${p.status==='waiting'&&p.waitingFor?`<div class="pfr-n w">${ico('i-clock','s14')}Czeka na: ${esc(p.waitingFor)}</div>`:(p.nextStep?`<div class="pfr-n">→ ${esc(p.nextStep)}</div>`:'')}</div>
      <div class="pfr-prog"><div class="bar"><i style="width:${st.pct}%;background:${esc(p.color||'var(--accent)')}"></i></div><small>${st.pct}%</small></div>
      <div class="pfr-act"><button type="button" class="icon-btn" data-act="pf-up" data-id="${p.id}" title="Wyżej" aria-label="Wyżej">${ico('i-chevu','s14')}</button><button type="button" class="icon-btn" data-act="pf-down" data-id="${p.id}" title="Niżej" aria-label="Niżej">${ico('i-chevd','s14')}</button><button type="button" class="icon-btn" data-act="pf-menu" data-id="${p.id}" aria-label="Opcje">${ico('i-more','s14')}</button></div>
    </div>`; }).join('') : `<p class="muted" style="font-size:13px">Brak otwartych projektów w filtrze.</p>`;
  h+=`</div><div>${pfSuggestions(live)}</div></div>`;
  return h;
}
function pfSuggestions(live){
  const T=today(); const out=[];
  const row=(p,txt,btn)=>`<div class="sg-row"><span class="dot" style="background:${esc(p.color||'#888')}"></span><button type="button" class="link sg-n" data-nav="project:${p.id}">${esc(p.name)}</button><span class="muted sg-t">${txt}</span>${btn||''}</div>`;
  const act=live.filter(p=>p.status==='active'||!PSTAT_META[p.status]);
  if(act.length>pfWip()){ const extra=pRankSorted(act).slice(pfWip()); out.push({c:'warn', h:`${act.length} projektów w realizacji naraz`, d:`Twój limit to ${pfWip()}. Najniżej w rankingu — kandydaci do wstrzymania:`, r:extra.map(p=>row(p, '#'+(pRankMap().get(p.id)), `<button type="button" class="btn sm" data-act="pf-hold" data-id="${p.id}">Wstrzymaj</button>`)).join('')}); }
  const follow=live.filter(p=>p.status==='waiting').sort((a,b)=>(a.waitingSince||'9').localeCompare(b.waitingSince||'9'));
  if(follow.length) out.push({c:'gold', h:'Czekamy na odpowiedź', d:'Najdłużej czekające na górze. Gdy minie data ponowienia — przypomnij się.', r:follow.map(p=>row(p, `${esc(p.waitingFor||'—')} · ${p.waitingSince?diffDays(p.waitingSince,T)+' dni':''}${p.followUp&&p.followUp<=T?' · <b style="color:var(--danger)">ponów kontakt</b>':''}`, `<button type="button" class="btn sm" data-act="pf-wait" data-id="${p.id}">Odpowiedź / ponów</button>`)).join('')});
  const blocked=live.filter(p=>pBlockers(p).length && p.status!=='waiting');
  if(blocked.length) out.push({c:'bad', h:'Zablokowane przez inne projekty', d:'Nie ruszą, dopóki projekt, od którego zależą, nie zostanie zakończony.', r:blocked.map(p=>row(p, 'czeka na: '+pBlockers(p).map(b=>esc(b.name)).join(', '))).join('')});
  const late=live.filter(p=>p.due && p.due<T);
  if(late.length) out.push({c:'bad', h:'Po terminie zakończenia', d:'Przesuń termin albo podnieś w rankingu.', r:late.map(p=>row(p, `${diffDays(p.due,T)} dni po terminie`, `<button type="button" class="btn sm" data-act="edit-project" data-id="${p.id}">Termin</button>`)).join('')});
  const stale=live.filter(p=>p.status==='active' && pIdleDays(p)>=21);
  if(stale.length) out.push({c:'muted', h:'Bez ruchu od 3 tygodni', d:'Albo wróć do nich, albo świadomie wstrzymaj — lista „W realizacji” będzie uczciwsza.', r:stale.map(p=>row(p, `${pIdleDays(p)} dni`, `<button type="button" class="btn sm" data-act="pf-hold" data-id="${p.id}">Wstrzymaj</button>`)).join('')});
  const noNext=live.filter(p=>['active','planned','waiting'].includes(p.status) && !p.nextStep);
  if(noNext.length) out.push({c:'info', h:'Brak następnego kroku', d:'Jedno zdanie „co dalej” oszczędza czas przy powrocie do tematu.', r:noNext.map(p=>row(p, '', `<button type="button" class="btn sm" data-act="pf-next" data-id="${p.id}">Dopisz</button>`)).join('')});
  let h=`<div class="panel pf-sugg"><div class="panel-h"><h3>Podpowiedzi</h3><label class="muted" style="font-size:12px;display:flex;align-items:center;gap:6px">Limit „w realizacji”<select class="inp sm" id="pf-wip" style="width:auto;padding:2px 6px;height:28px">${[3,4,5,6,7,8,10,12].map(n=>`<option ${n===pfWip()?'selected':''}>${n}</option>`).join('')}</select></label></div>`;
  h+= out.length ? out.map(s=>`<div class="sg sg-${s.c}"><h4>${s.h}</h4><p>${s.d}</p>${s.r}</div>`).join('') : `<p class="muted" style="font-size:13px">Wszystko pod kontrolą — każdy projekt ma następny krok, nic nie czeka zbyt długo.</p>`;
  return h+`</div>`;
}

/* ---------- project page: portfolio strip ---------- */
function projectPortfolioStrip(p){
  const st=pStats(p), h=pHealth(p,st), ph=pPhases(p), pi=pPhaseIdx(p), rk=pRankMap().get(p.id); const T=today();
  const kids=pRankSorted(pChildren(p.id)); const bl=(p.dependsOn||[]).map(id=>S.projects.get(id)).filter(Boolean); const blocks=pBlocks(p);
  let s=`<div class="pps" style="--ph-color:${esc(p.color||'var(--accent)')}"><div class="pps-row">${pfStatusPill(p,true)}${prioPill(p)}${rk?`<span class="pps-rank" title="Miejsce w rankingu ważności">#${rk} w rankingu</span>`:''}${healthDot(h)}<span class="sp"></span><button type="button" class="link" data-nav="portfolio">Portfel projektów →</button></div>`;
  if(ph.length){

function gcalUrl(t){
  const d=t.due.replace(/-/g,'');
  let dates;
  if(t.dueTime){ const [h,m]=t.dueTime.split(':').map(Number); const s=new Date(D(t.due).setHours(h,m,0,0)); const e=new Date(s.getTime()+60*60000); const f=x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`; dates=`${f(s)}/${f(e)}`; }
  else dates=`${d}/${addDays(t.due,1).replace(/-/g,'')}`;
  const details=[sigOf(t), t.clientId?('Klient: '+clientName(t.clientId)):'', t.projectId&&S.projects.get(t.projectId)?('Projekt: '+S.projects.get(t.projectId).name):'', t.hard?'TERMIN USTAWOWY':'', t.notes||''].filter(Boolean).join('\n');

}

/* ---------- deadline calculator ---------- */
function calcDeadline(from, n, mode){
  // mode: 'cal' = calendar days (Ordynacja: weekend/holiday at the end moves to next workday); 'work' = business days
  let d=from;
  if(mode==='work'){ let k=0; while(k<n){ d=addDays(d,1); if(isWorkday(d)) k++; } }
  else d=addDays(from, n);
  const nominal=d; const shifted=nextWorkday(d);
  return {nominal, result:shifted, shifted:nominal!==shifted, reason: nominal!==shifted ? (holidayName(nominal)||DOW[D(nominal).getDay()]) : ''};
}

/* ---------- księga (book) ---------- */
function mdToHtml(md){
  const lines=md.split('\n'); let h='', inUl=false, inOl=false;
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const close=()=>{ if(inUl){ h+='</ul>'; inUl=false; } if(inOl){ h+='</ol>'; inOl=false; } };
  for(const l of lines){
    if(/^### /.test(l)){ close(); h+=`<h4>${inline(l.slice(4))}</h4>`; }
    else if(/^## /.test(l)){ close(); h+=`<h3 id="${esc(norm(l.slice(3)).replace(/[^a-z0-9]+/g,'-'))}">${inline(l.slice(3))}</h3>`; }
    else if(/^# /.test(l)){ close(); h+=`<h2>${inline(l.slice(2))}</h2>`; }
    else if(/^- /.test(l)){ if(!inUl){ close(); h+='<ul>'; inUl=true; } h+=`<li>${inline(l.slice(2))}</li>`; }
    else if(/^\d+\. /.test(l)){ if(!inOl){ close(); h+='<ol>'; inOl=true; } h+=`<li>${inline(l.replace(/^\d+\. /,''))}</li>`; }
    else if(!l.trim()){ close(); }
    else { close(); h+=`<p>${inline(l)}</p>`; }
  }
  close(); return h;
}
