.book-body h3{font-family:var(--f-display);font-size:21px;margin:26px 0 8px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:8px}
.book-body h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:16px 0 6px}
.book-body p{margin:0 0 10px;color:var(--fg-2)}
.book-body ul,.book-body ol{margin:0 0 10px;padding-left:20px;color:var(--fg-2)}
.book-body li{margin:3px 0}
.book-body code{font-family:var(--f-mono);font-size:12px;background:var(--sunken);padding:0 5px;border-radius:4px;color:var(--fg)}
.book-body b{color:var(--fg)}
.panel.pinned{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-soft),var(--surface))}
.panel.pinned h3{display:flex;align-items:center;gap:8px;color:var(--gold)}
@media (max-width:1180px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr)}.wday{min-height:0}.modal-b.book{grid-template-columns:minmax(0,1fr)}.book-nav{display:none}.hero::after,.seal::after{animation:none}}
/* mobile */
.bottom-nav{display:none}
.fab{display:none}
@media (max-width:1180px){.ov-grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.tf{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:50;transform:translateX(-104%);transition:transform .28s var(--ease);box-shadow:var(--shadow-3);padding-top:env(safe-area-inset-top,0px)}
  .sidebar.on{transform:none}
  .topbar{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:58px;gap:8px;top:env(safe-area-inset-top,0px)}
  .topbar .menu-btn{display:inline-grid}
  .vt h1{font-size:24px}
  .vt .vt-sub{display:none}
  .new-btn{display:none}
  .theme-seg button{padding:6px 9px}
  .theme-seg button .lbl{display:none}
  .fbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding:2px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .seg button .lbl{display:none}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--glass-strong);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--fg-3);padding:4px 8px;border-radius:10px;min-width:58px}
  .bottom-nav button.on{color:var(--accent)}
  .bottom-nav .svg{width:21px;height:21px}
  .fab{display:grid;place-items:center;position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--accent-grad);color:var(--accent-fg);box-shadow:0 14px 30px -10px var(--accent);z-index:36}
  .fab .svg{width:24px;height:24px;stroke-width:2.3}
  .detail{top:0;right:0;bottom:0;width:100%;border-radius:0;border:0;margin:0;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-left:env(safe-area-inset-left,0px)}
  .hero{padding:20px 18px 16px;border-radius:var(--r-l)}
  .hero h2{font-size:29px}
  .hero .scales{width:86px;height:86px;right:12px;top:12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:last-child{grid-column:1/-1}
  .kpi .v{font-size:28px}
  .matrix{grid-template-columns:minmax(0,1fr)}
  .cal-day{min-height:64px;padding:3px}
  .cal .cev{font-size:0;padding:0;height:5px;border-radius:3px;border-left-width:0;background:var(--fg-3)}
  .cal .cev.ms{background:var(--gold)}
  .cal .cev .t,.cal .cev .svg{display:none}
  .cal-more{font-size:10px}
  .cal-dow{padding:6px 3px;text-align:center;font-size:10px}
  .set-grid{grid-template-columns:minmax(0,1fr)}
  .set-nav{position:static;flex-direction:row;overflow-x:auto;gap:4px}
  .set-nav .nav-item{white-space:nowrap;width:auto}
  .set-nav .nav-item.active::before{display:none}
  .theme-cards{grid-template-columns:minmax(0,1fr)}
  .phead{grid-template-columns:minmax(0,1fr)}
  .phead .ring{display:none}
  .props{grid-template-columns:100px minmax(0,1fr)}
  .tf-side{grid-template-columns:92px minmax(0,1fr)}
  .tl-label{width:140px}
  .form{grid-template-columns:minmax(0,1fr)}
  .toasts{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .bulk{bottom:calc(82px + env(safe-area-inset-bottom,0px))}
  .wl{grid-template-columns:minmax(0,120px) minmax(0,1fr) 46px}
  .prow{grid-template-columns:minmax(0,1fr) 70px 40px}
  .trow .tright .avs,.trow .tright .pill.status{display:none}
  .modal-wrap{padding:0;place-items:end stretch}
  .modal{width:100%!important;max-height:94%;border-radius:var(--r-xl) var(--r-xl) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .cmdk{margin-top:0;align-self:end}
  .d-foot .btn.hide-s{display:none}
  .modal-f .hide-s{display:none}
  .lg-only{display:none}

@media (min-width:901px){.sm-only{display:none}}
@media (max-width:480px){.tb-actions .hide-s{display:none}.cal-head h2{min-width:0;font-size:18px}.hero-top{margin-bottom:14px}}

/* ===== v1.5 — reminder tray ===== */
.remtray{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:91;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:min(400px,calc(100vw - 24px))}
.remtray[hidden]{display:none}
.remtray.open{width:min(400px,calc(100vw - 24px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--gold-line);border-radius:var(--r-l);padding:8px;box-shadow:var(--e3)}
.rem-head{display:flex;align-items:center;gap:8px;width:100%;padding:2px 4px 2px 8px;font-size:12.5px;color:var(--gold,var(--accent))}
.rem-head b{color:var(--fg);font-weight:700}.rem-head .sp{flex:1}
.rem-head .link{font-size:12px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:4px}
.rem-list{display:flex;flex-direction:column;gap:8px;width:100%;max-height:min(56vh,520px);overflow:auto;overscroll-behavior:contain}
.rem-list .toast.rem{max-width:none;width:100%;box-shadow:var(--e1)}
.rem-pill{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 12px;border-radius:999px;background:var(--surface);color:var(--fg);border:1px solid var(--gold-line);box-shadow:var(--e3);font-size:12.5px;font-weight:600;cursor:pointer}
.rem-pill svg{color:var(--gold,var(--accent))}
.rem-pill b{min-width:20px;height:20px;border-radius:10px;background:var(--gold,var(--accent));color:#1b1405;display:inline-grid;place-items:center;font-size:11.5px}
.rem-pill .rp-more{color:var(--accent);margin-left:4px}
.rem-pill:hover{transform:translateY(-1px)}
.pulse{animation:remPulse 1.6s var(--ease) 3}
@keyframes remPulse{0%,100%{box-shadow:var(--e3),0 0 0 0 rgba(201,162,74,.0)}50%{box-shadow:var(--e3),0 0 0 7px rgba(201,162,74,.28)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
/* never cover the task panel: on a computer the tray and toasts sit to the left of it */
@media (min-width:901px){
  body:has(#detail.on) .remtray, body:has(#detail.on) .toasts{right:calc(min(var(--detail-w),100% - 24px) + 26px)}
  body:has(#detail.on) .remtray.open{width:min(400px,calc(100vw - var(--detail-w) - 50px));max-width:none}
}
@media (max-width:900px){
  .remtray{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  body:has(#detail.on) .remtray{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px));right:12px}
  body:has(#detail.on) .remtray .rem-pill .rp-more, body:has(#detail.on) .remtray .rem-pill span:not(.rp-more){display:none}
  body:has(#detail.on) .toasts{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
}
body:has(.modal-wrap) .remtray:not(.open){bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}

/* ===================== v1.6 — PORTFEL PROJEKTÓW ===================== */
.pf-kpi{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px}
.pfk{position:relative;padding:12px 14px 11px;border-radius:14px;background:var(--card-grad);border:1px solid var(--line);box-shadow:var(--e1),var(--hi-soft);overflow:hidden;min-width:0}
.pfk::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--kc,var(--line-strong))}
.pfk b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1;font-weight:600;color:var(--fg)}
.pfk span{font-size:11.5px;color:var(--fg-3);font-weight:600;letter-spacing:.02em}
.pfk.warn.on{--kc:var(--warn)}.pfk.warn.on b{color:var(--warn)}
.pf-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.pf-bar .seg.sm button{font-size:12px;padding:0 10px;height:28px}
.pf-q{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);margin-left:auto;color:var(--fg-3)}
.pf-q input{border:0;background:none;outline:0;color:var(--fg);font:inherit;font-size:12.5px;width:170px}
/* pills */
.pfs{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:650;color:var(--fg);background:color-mix(in srgb,var(--sc) 16%,transparent);border:1px solid color-mix(in srgb,var(--sc) 38%,transparent);cursor:pointer;white-space:nowrap}
.pfs i{width:7px;height:7px;border-radius:50%;background:var(--sc);box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 22%,transparent)}
.pfp{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;white-space:nowrap}
.pfp.p1{color:var(--danger);background:var(--danger-soft)}.pfp.p2{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.pfp.p4{color:var(--fg-3);background:var(--sunken)}
.pfh{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.pfh i{width:8px;height:8px;border-radius:50%;background:var(--fg-3)}
.pfh.h-ok i{background:var(--ok)}.pfh.h-risk i{background:var(--warn)}.pfh.h-late i{background:var(--danger)}.pfh.h-blocked i{background:#B4436C}.pfh.h-wait i{background:#D39A26}.pfh.h-stale i{background:#A88B4A}.pfh.h-idea i{background:#8B7FD6}.pfh.h-done i{background:var(--ok)}
.pfh.h-risk,.pfh.h-late,.pfh.h-blocked{color:var(--fg)}.pfh.quiet{gap:0}.pfh.quiet i{width:9px;height:9px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.pfm-ms,.pfc-foot .pfd{white-space:nowrap}
.pfh.h-late i,.pfh.h-blocked i{animation:pfBeat 2.2s ease-in-out infinite}
@keyframes pfBeat{0%,100%{box-shadow:0 0 0 0 rgba(229,103,90,.0)}50%{box-shadow:0 0 0 5px rgba(229,103,90,.22)}}
.pfc-rank{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 6px;border-radius:7px;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--fg);background:linear-gradient(180deg,var(--surface),var(--sunken));border:1px solid var(--line);box-shadow:var(--hi-soft)}

/* board */
.pfb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);gap:14px;overflow-x:auto;padding:2px 2px 18px;align-items:start;scroll-snap-type:x proximity}
.pfcol{scroll-snap-align:start;border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 9%,var(--surface-2)),var(--surface-2) 140px);border:1px solid var(--line);padding:10px;min-height:220px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.pfcol header{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}

.pfcol .cdot{width:10px;height:10px;border-radius:4px;background:var(--cc);box-shadow:0 0 0 4px color-mix(in srgb,var(--cc) 20%,transparent),0 0 14px color-mix(in srgb,var(--cc) 55%,transparent)}
.pfcol .n{font-size:11.5px;font-weight:700;color:var(--fg-3);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;height:20px;display:inline-grid;place-items:center}
.pfcol-b{display:flex;flex-direction:column;gap:10px;min-height:60px}
.pfcol,.pfcol-b,.pfc{min-width:0}.pfc h4{overflow-wrap:anywhere}.pfc-foot{flex-wrap:wrap;row-gap:6px}
.pfcol.drop-hot{outline:2px dashed var(--cc);outline-offset:-3px}
.pf-empty{font-size:12px;color:var(--fg-3);padding:14px 10px;border:1px dashed var(--line-strong);border-radius:12px;text-align:center;line-height:1.45}
.pfc{position:relative;padding:11px 12px 10px 14px;border-radius:15px;background:var(--card-grad);border:1px solid var(--line);cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 1px 2px rgba(10,20,40,.08),0 8px 22px -12px rgba(10,20,40,.35);
  transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0)) translateZ(0);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s;transform-style:preserve-3d;outline:0}
.pfc::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--pc);box-shadow:0 0 12px color-mix(in srgb,var(--pc) 60%,transparent)}
.pfc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--gx,50%) var(--gy,0%),color-mix(in srgb,var(--pc) 13%,transparent),transparent 45%);opacity:0;transition:opacity .25s}
.pfc:hover,.pfc:focus-visible{border-color:color-mix(in srgb,var(--pc) 45%,var(--line));box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 2px 4px rgba(10,20,40,.08),0 22px 40px -18px color-mix(in srgb,var(--pc) 55%,rgba(10,20,40,.55))}
.pfc.tilt{transition:transform .08s linear,box-shadow .25s,border-color .2s}.pfc:hover::after,.pfc.tilt::after{opacity:1}
.pfc.s-onhold{opacity:.78;filter:saturate(.6)}.pfc.s-idea{border-style:dashed}
.pfc.h-late{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.pfc-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}.pfc-top .sp{flex:1}
.pfc-more{width:24px;height:24px;margin:-4px -6px -4px 0;opacity:.55}.pfc:hover .pfc-more{opacity:1}
.pfc-par{font-size:11px;font-weight:650;color:var(--fg-3);display:flex;align-items:center;gap:5px;margin-bottom:1px}
.pfc-par::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--pp)}

/* sidebar: where am I */
.nav-here-slot{flex:none;padding:0 10px}
.nav-here{position:relative;display:none;align-items:center;gap:9px;width:100%;margin:2px 0 6px;padding:8px 10px;border-radius:12px;text-align:left;cursor:pointer;
  background:linear-gradient(135deg,rgba(232,201,130,.20),rgba(232,201,130,.08));border:1px solid rgba(232,201,130,.42);color:#fff;
  box-shadow:0 10px 22px -10px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:hereIn .25s var(--ease)}
.nav-here.show{display:flex}

.nav-here svg{color:#E8C982;flex:none}
.nav-here .t{display:flex;flex-direction:column;min-width:0;flex:1}
.nav-here small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#E8C982;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-here b{font-size:12.5px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nav-here:hover{border-color:#E8C982}
@keyframes hereIn{from{opacity:0;transform:translateY(-4px)}}
#nav .nav-item.active{background:linear-gradient(90deg,rgba(232,201,130,.22),rgba(232,201,130,.07) 70%,transparent);color:#fff;font-weight:650;box-shadow:inset 0 0 0 1px rgba(232,201,130,.28),0 6px 14px -8px rgba(0,0,0,.6)}

#nav .nav-item.active .lbl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.vault{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px 16px;overflow:auto;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(232,201,130,.16),transparent 60%),radial-gradient(900px 500px at 110% 110%,rgba(79,91,213,.22),transparent 60%),linear-gradient(160deg,#0B1530,#070D1C 70%);color:#EEF2FA}
.vault::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1.4px) 0 0/26px 26px;pointer-events:none}
.vault-card{position:relative;width:min(460px,100%);padding:30px 28px 18px;border-radius:24px;background:linear-gradient(180deg,rgba(23,36,66,.92),rgba(14,24,46,.94));border:1px solid rgba(232,201,130,.28);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 40px 80px -30px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.3);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:pfIn .45s var(--ease) both}
.vault-seal{position:relative;width:58px;height:58px;margin:0 auto 14px}.vault-seal .seal{width:58px;height:58px;border-radius:18px;font-size:26px;box-shadow:0 12px 30px -10px rgba(232,201,130,.6)}
.vault-seal>svg,.vault-seal>svg.svg{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;padding:4px;border-radius:50%;background:#0E1B33;color:#E8C982;border:1px solid rgba(232,201,130,.5)}
.vault h1{font-family:var(--f-display);font-size:28px;font-weight:600;text-align:center;margin:0 0 6px;color:#fff;letter-spacing:-.01em}
.vault-lead{font-size:13.5px;line-height:1.55;color:#C3CCE0;text-align:center;margin:0 0 18px}.vault-lead b{color:#fff}
.vault-form{display:flex;flex-direction:column;gap:12px}
.vault-form label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#AEB9D2;letter-spacing:.02em}
.vault .inp{background:rgba(5,10,22,.55);border:1px solid rgba(255,255,255,.14);color:#fff;height:44px;font-size:15px;border-radius:12px}
.vault .inp:focus{border-color:#E8C982;box-shadow:0 0 0 3px rgba(232,201,130,.2);outline:0}
.vault .pin-inp{font-family:var(--f-mono);font-size:22px;letter-spacing:.5em;text-align:center}
.vault .btn.big{width:100%;height:46px;font-size:14.5px;justify-content:center;border-radius:12px;margin-top:4px}
.vault .btn.primary{background:linear-gradient(180deg,#F0D592,#C9A253);color:#16120A;border:0;box-shadow:0 10px 24px -10px rgba(232,201,130,.7)}
.vault .btn:not(.primary){background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.16)}
.vault-note{font-size:12px;color:#93A0BC;margin:-2px 0 0;line-height:1.45}
.vault-err{margin:0;padding:9px 11px;border-radius:10px;background:rgba(229,103,90,.14);border:1px solid rgba(229,103,90,.4);color:#FFC7BF;font-size:13px}
.vault-busy{display:flex;align-items:center;gap:9px;font-size:13px;color:#E8C982}.vault-busy[hidden]{display:none}
.spinner.sm{width:16px;height:16px;border-width:2px;margin:0}
.vault-alts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:14px}.vault-alts .link,.vault-alt{color:#E8C982;font-size:12.5px;background:none;border:0;cursor:pointer;padding:2px}

const MON_SHORT = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const DOW = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const DOW_SHORT = ['nd','pn','wt','śr','cz','pt','sb'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const D = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d=D(s); d.setDate(d.getDate()+n); return ymd(d); };
const addMonths = (s, n) => { const d=D(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return ymd(d); };

const startOfWeek = s => { const d=D(s); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); };

function fmtDate(s, opts={}){
  if(!s) return '';

  if(!opts.abs){

    if(dd>1 && dd<7) return DOW[D(s).getDay()].replace(/^./,c=>c.toUpperCase());
  }
  const d=D(s); const sameY=d.getFullYear()===new Date().getFullYear();

}

const COLL_PL_SORT = new Intl.Collator('pl', {sensitivity:'base', numeric:true});

function personFirst(p){ if(!p) return ''; if(p.firstName!=null || p.lastName!=null) return p.firstName||''; const w=String(p.name||'').trim().split(/\s+/); return w.length>1 ? w.slice(0,-1).join(' ') : ''; }
function personLast(p){ if(!p) return ''; if(p.firstName!=null || p.lastName!=null) return p.lastName||''; const w=String(p.name||'').trim().split(/\s+/); return w[w.length-1]||''; }

function clientSortName(c){ if(!c) return ''; if(c.kind==='person') return [c.lastName,c.firstName].filter(Boolean).join(' ') || c.name || ''; return c.name||''; }
function joinName(last, first){ return [String(last||'').trim(), String(first||'').trim()].filter(Boolean).join(' '); }
function splitLegacyName(s){ const w=String(s||'').trim().split(/\s+/).filter(Boolean); if(w.length===2 && w.every(x=>/^\p{Lu}\p{Ll}+(-\p{Lu}\p{Ll}+)?$/u.test(x))) return {first:w[0], last:w[1]}; return {first:'', last:w.join(' ')}; }

function childIndex(){ if(CI.v===DV) return CI.map; const m=new Map(); for(const t of S.tasks.values()){ if(t.deletedAt||!t.parentId) continue; let a=m.get(t.parentId); if(!a){ a=[]; m.set(t.parentId,a); } a.push(t); } m.forEach(a=>a.sort((x,y)=>(x.order??0)-(y.order??0))); CI={v:DV, map:m}; return m; }
const childrenOf = id => (childIndex().get(id)||[]).slice();
function descendants(id){ const out=[], seen=new Set([id]); const walk=pid=>{ for(const c of childrenOf(pid)) if(!seen.has(c.id)){ seen.add(c.id); out.push(c); walk(c.id); } }; walk(id); return out; }
function ancestors(t){ const out=[]; let p=t.parentId && S.tasks.get(t.parentId), guard=0; while(p && guard++<20){ out.unshift(p); p=p.parentId && S.tasks.get(p.parentId); } return out; }

/* task signatures (WK-n) are never reused: the highest number ever given is remembered even after the task is deleted for good */
function nextNum(){ let m=+(S.settings.numFloor)||0; for(const t of S.tasks.values()) if((t.num||0)>m) m=t.num; return m+1; }
function keepNumFloor(ids){ let top=0, rest=0; const gone=new Set(ids); for(const t of S.tasks.values()){ const n=t.num||0; if(gone.has(t.id)){ if(n>top) top=n; } else if(n>rest) rest=n; } if(top>rest && top>(+(S.settings.numFloor)||0)) saveSettings({numFloor:top}); }
/* two devices can give the same number to tasks created at the same moment (or offline): the task created later gets the next free number.
   The rule depends only on the data (createdAt, then id), so every device arrives at the same result. */
function fixDuplicateNums(){
  const by=new Map(); for(const t of S.tasks.values()){ if(!t.num) continue; let a=by.get(t.num); if(!a){ a=[]; by.set(t.num,a); } a.push(t); }
  const dups=[]; by.forEach(a=>{ if(a.length>1){ a.sort((x,y)=>(x.createdAt||0)-(y.createdAt||0) || String(x.id).localeCompare(String(y.id))); dups.push(...a.slice(1)); } });
  if(!dups.length) return 0;
  dups.sort((x,y)=>(x.createdAt||0)-(y.createdAt||0) || String(x.id).localeCompare(String(y.id)));
  let n=nextNum();
  dups.forEach(t=>upd('tasks', t.id, x=>{ const old=x.num; x.num=n++; logH(x, `Sygnatura zmieniona z WK-${old} na WK-${x.num} (ten sam numer nadany na dwóch urządzeniach)`); }));
  toast(`${dups.length} ${plural(dups.length,'zadanie miało','zadania miały','zadań miało')} powtórzoną sygnaturę (utworzone równocześnie na dwóch urządzeniach) — ${plural(dups.length,'dostało nowy numer','dostały nowe numery','dostało nowe numery')}. Szczegóły w historii zadań.`, {sticky:true});
  return dups.length;
}
function logH(t, text){ t.history = (t.history||[]).concat([{at:Date.now(), text}]).slice(-50); }

/* ---------------- sync / storage layer ---------------- */
const Cloud = { db:null, user:null, base:null, settingsRef:null, unsubs:[], firstSeen:new Set() };
const pending = new Map();      // doc path -> {running, next}
const localDirty = new Map();   // doc path -> latest local body (or null for delete)
let syncError = null;

function pathOf(coll, id){ return `data/users/${S.uid}/ws/${coll}/${id}`; }
function refOf(coll, id){ return Cloud.base.collection(coll).doc(id); }

/* Every local change is kept until the cloud has confirmed it (audit 2.3):
   - a temporary failure (no network, overloaded store) is retried with a growing delay for as long as the tab is open,
   - a refused write (quota, rejected data, lost access) stays visible locally and is retried every few minutes,
   - unsent changes are also journaled in this browser, so closing the tab does not lose them (replayed at next start),
   - the tab warns before closing while something is still unsent. */
const failedWrites = new Map();          // doc path -> job refused by the store (kept, retried later)
const WRITE_RETRY = [2000, 5000, 15000, 30000, 60000];
const WRITE_PERMANENT = new Set(['invalid_argument','quota_exceeded','revoked','not_granted','permission_denied','unauthenticated','failed_precondition','out_of_range']);
let writeTrouble = false;                // one notice per outage, not one per record
function enqueue(path, ref, op, data){
  let q = pending.get(path);
  if(!q){ q={running:false, next:null, fails:0}; pending.set(path, q); }
  q.next = {ref, op, data, path, at:Date.now()};
  failedWrites.delete(path);
  localDirty.set(path, op==='del'? null : data);
  journalKeep(path, q.next);
  if(!q.running) drain(path, q);
  updateSync();
}
async function drain(path, q){
  q.running = true; let refused=null;
  while(q.next){
    const job=q.next; q.next=null;
    try{ await attempt(job); q.fails=0; journalDrop(path, job); if(!failedWrites.size){ syncError=null; if(writeTrouble){ writeTrouble=false; toast('Połączenie wróciło — zaległe zmiany zostały zapisane.'); } } }
    catch(e){
      const c=(e&&e.code)||'error'; syncError=c; journalKeep(path, job);
      if(WRITE_PERMANENT.has(c)){ if(!q.next){ refused=job; handleWriteError(e); break; } continue; }   // a newer edit of the same record is tried instead
      q.fails++; if(!writeTrouble){ writeTrouble=true; handleWriteError(e); }
      if(!q.next) q.next=job;                                            // keep the change; a newer edit replaces it
      updateSync(); await sleep(WRITE_RETRY[Math.min(q.fails-1, WRITE_RETRY.length-1)]);
    }
  }
  q.running=false; pending.delete(path);
  if(refused) failedWrites.set(path, refused);     // localDirty stays: the change remains visible and is included in backups
  else localDirty.delete(path);
  updateSync();
}
async function attempt(job){
  for(let i=0;i<5;i++){
    try{ return job.op==='del' ? await job.ref.delete() : await job.ref.set(job.data); }
    catch(e){
      const c=e&&e.code;
      if((c==='unavailable'||c==='resource_exhausted') && i<4){ await sleep(500*(i+1)+Math.random()*500); continue; }
      throw e;
    }
  }
}
function handleWriteError(e){
  const c=e&&e.code;
  syncError = c||'error';
  if(c==='quota_exceeded') toast('Osiągnięto limit miejsca na dane. Zmiana została zachowana w tej przeglądarce, ale nie w chmurze. Usuń stare zakończone zadania lub zarchiwizowane projekty i zrób kopię zapasową.', {sticky:true});
  else if(c==='invalid_argument') toast('Chmura odrzuciła zapis zmiany. Zmiana została zachowana w tej przeglądarce — zrób kopię zapasową do pliku (Ustawienia → Kopia zapasowa).', {sticky:true});
  else if(WRITE_PERMANENT.has(c)) toast('Utracono dostęp do synchronizacji. Zmiany są zachowane w tej przeglądarce — nie zamykaj karty i odśwież stronę.', {sticky:true});
  else toast('Brak połączenia z chmurą. Zmiany są zachowane i zapiszą się same po odzyskaniu połączenia — nie zamykaj tej karty.', {sticky:true});
}
function retryFailedWrites(){ for(const [path, job] of [...failedWrites]){ if(!pending.has(path)) enqueue(path, job.ref, job.op, job.data); } }
setInterval(()=>{ if(S.mode==='cloud' && failedWrites.size) retryFailedWrites(); }, 300000);
window.addEventListener('online', ()=>{ if(S.mode==='cloud') retryFailedWrites(); });
const unsentCount = () => pending.size + failedWrites.size;
window.addEventListener('beforeunload', e=>{ let draft=false; try{ if(UI.openTask){ flushFields(); draft=isDirty() || takePendingCheck(); } }catch(x){}
  if(draft || (S.mode==='cloud' && unsentCount() && (syncError || failedWrites.size))){ e.preventDefault(); e.returnValue=''; } });
function takePendingCheck(){ const v=dPending(); return Object.entries(v).some(([k,x])=>k!=='te-date' && k!=='te-person' && String(x||'').trim()); }

/* journal of unsent cloud writes (this browser only) */
const journalKey = () => 'wk.unsent.'+(S.uid||'');
function journalKeep(path, job){ const j=lsGet(journalKey(), {}); if(j[path] && (j[path].at||0) > (job.at||0)) return; j[path]={op:job.op, data:job.op==='del'?null:job.data, at:job.at||Date.now()}; lsSet(journalKey(), j); }
function journalDrop(path, job){ const j=lsGet(journalKey(), null); if(!j || !j[path]) return; if(job && (j[path].at||0) > (job.at||0)) return; delete j[path]; if(Object.keys(j).length) lsSet(journalKey(), j); else { try{ localStorage.removeItem(journalKey()); }catch(e){} } }
/* at start, once the full data set is known: changes that never reached the cloud are sent again (only if still newer than the cloud copy) */
function replayUnsent(){
  if(S.mode!=='cloud') return 0;
  const j=lsGet(journalKey(), null); if(!j) return 0;
  const pre=`data/users/${S.uid}/`; let n=0;
  for(const [path, e] of Object.entries(j)){
    if(!path.startsWith(pre) || !e){ continue; }
    const rest=path.slice(pre.length);
    if(rest==='settings'){ if(e.op==='set' && e.data && (e.data.updatedAt||0) > (S.settings.updatedAt||0)){ S.settings=clone(e.data); enqueue(path, Cloud.settingsRef, 'set', clone(e.data)); n++; } else journalDrop(path); continue; }
    const m=rest.match(/^ws\/([a-z]+)\/(.+)$/); if(!m || !COLLS.includes(m[1])){ journalDrop(path); continue; }
    const [, coll, id]=m; const cur=S[coll].get(id);
    if(e.op==='set' && e.data && (!cur || (e.data.updatedAt||0) > (cur.updatedAt||0))){ S[coll].set(id, clone(e.data)); enqueue(path, refOf(coll,id), 'set', clone(e.data)); n++; }
    else if(e.op==='del' && cur && (cur.updatedAt||0) <= (e.at||0)){ S[coll].delete(id); enqueue(path, refOf(coll,id), 'del'); n++; }
    else journalDrop(path);
  }
  if(n){ bumpDV(); render(); toast(`Odzyskano ${n} ${plural(n,'zmianę','zmiany','zmian')} z poprzedniej sesji, ${plural(n,'która nie zdążyła','które nie zdążyły','które nie zdążyły')} zapisać się w chmurze.`, {sticky:true}); }
  return n;
}

let DV=0; const bumpDV=()=>{ DV++; };
function put(coll, obj){
  bumpDV();
  obj.updatedAt = Date.now();
  if(!obj.createdAt) obj.createdAt = obj.updatedAt;
  S[coll].set(obj.id, obj);
  if(S.mode==='cloud') enqueue(pathOf(coll,obj.id), refOf(coll,obj.id), 'set', clone(obj));
  else if(S.mode==='server') srvEnqueue(coll, obj.id, clone(obj));
  else saveLocalSoon();
  render();
}
function del(coll, id){
  bumpDV();
  S[coll].delete(id);
  if(S.mode==='cloud') enqueue(pathOf(coll,id), refOf(coll,id), 'del');
  else if(S.mode==='server') srvEnqueue(coll, id, null);
  else saveLocalSoon();
  render();
}
function upd(coll, id, fn){ const cur=S[coll].get(id); if(!cur) return null; const o=clone(cur); fn(o); put(coll,o); return o; }
function saveSettings(patch){
  S.settings = {...S.settings, ...patch, updatedAt:Date.now()};
  if(S.mode==='cloud'){ const p=`data/users/${S.uid}/settings`; enqueue(p, Cloud.settingsRef, 'set', clone(S.settings)); }
  else if(S.mode==='server') srvEnqueue('settings', 'settings', clone(S.settings));
  else saveLocalSoon();
  render();
}

/* local mode (no claude.ai sign-in): browser storage only */
const LOCAL_KEY='wokanda.local.v1';
let localTimer=null;

function saveLocal(){ const o={settings:S.settings}; COLLS.forEach(c=>o[c]=[...S[c].values()]); lsSet(LOCAL_KEY, o); }
function loadLocal(){ bumpDV(); const o=lsGet(LOCAL_KEY, null); COLLS.forEach(c=>{ S[c]=new Map(); (o?.[c]||[]).forEach(x=>{ if(x && typeof x.id==='string') S[c].set(x.id, inDoc(x)); }); }); S.settings=(o?.settings && typeof o.settings==='object') ? o.settings : {}; }
/* every record entering the application state (cloud, server, browser storage): the colour is used inside style attributes, so only a plain #hex value is let in */

function updateSync(){

  if(S.mode==='local'){ cls=S.cloudMissing?'err':'local'; txt=S.cloudMissing?'Brak synchronizacji':'Tylko to urządzenie'; }
  else if(S.mode==='server'){ if(SRV.err){ cls='err'; txt='Błąd zapisu'; } else if(!SRV.online){ cls='local'; txt=SRV.pend.size?`Offline · ${SRV.pend.size} czeka`:'Offline'; } else if(SRV.pend.size){ cls='busy'; txt='Szyfrowanie i zapis…'; } else { cls='ok'; txt='Sejf · zsynchronizowano'; } }
  else if(S.mode==='cloud'){

}

async function connect(){
  let db=null, user=null;
  try{
    if(window.claude && typeof window.claude.use==='function'){
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    }
  }catch(e){ db=null; }
  if(db && user){
    let id=null; try{ id=await user.id(); }catch(e){}
    if(id){
      S.uid=id; Cloud.db=db; Cloud.user=user;
      try{ const me=await user.me(); S.meName=(me&&me.name)||''; }catch(e){}
      Cloud.base=db.doc(`data/users/${id}/ws`);
      Cloud.settingsRef=db.doc(`data/users/${id}/settings`);
      S.mode='cloud'; updateSync();
      subscribeAll();
      return;
    }
  }
  if(!window.claude && WK_EDITION==='server') return serverBoot();
  S.mode='local'; S.cloudMissing=!!window.claude; loadLocal(); updateSync(); onReady();
  if(S.cloudMissing) setTimeout(()=>toast('Synchronizacja z kontem Claude jest teraz niedostępna — zmiany zapisują się tylko na tym urządzeniu. Odśwież stronę; po połączeniu Wokanda zaproponuje przeniesienie ich do chmury.', {sticky:true, action:'Odśwież', onAction:()=>location.reload()}), 1200);
}
function subscribeColl(c){
  const pre=`data/users/${S.uid}/ws/${c}/`;
  return Cloud.base.collection(c).onSnapshot(snap=>{
    const m=new Map();
    snap.docs.forEach(d=>{ if(d.exists) m.set(d.id, inDoc({...clone(d.data()), id:d.id})); });
    for(const [p,body] of localDirty){ if(p.startsWith(pre)){ const id=p.slice(pre.length); if(body===null) m.delete(id); else m.set(id, clone(body)); } }
    S[c]=m; bumpDV(); Cloud.retry[c]=0;
    if(!snap.metadata?.fromCache) Cloud.firstSeen.add(c);
    afterSnapshot();
  }, err=>onSubErr(c, err));
}
function subscribeSettings(){
  return Cloud.settingsRef.onSnapshot(snap=>{
    const p=`data/users/${S.uid}/settings`;
    if(localDirty.has(p)) S.settings=clone(localDirty.get(p));
    else S.settings = snap.exists ? clone(snap.data()) : {};
    Cloud.retry.settings=0;
    if(!snap.metadata?.fromCache) Cloud.firstSeen.add('settings');
    if(S.ready) applyTheme();
    afterSnapshot();
  }, err=>onSubErr('settings', err));
}
function afterSnapshot(){
  const all = Cloud.firstSeen.size >= COLLS.length+1;
  if(!S.ready){ if(all) onReady(); return; }
  if(all && S.partial){ S.partial=false; syncError=null; onDataComplete(); }
  render();
}
function subscribeAll(){
  Cloud.retry={}; Cloud.subs={};
  COLLS.forEach(c=>{ Cloud.subs[c]=subscribeColl(c); });
  Cloud.subs.settings=subscribeSettings();
  // if the store is slow, show what has arrived — but never treat a partial load as "no data"
  setTimeout(()=>{ if(!S.ready){ S.partial=true; syncError='timeout'; onReady(); toast('Synchronizacja odpowiada wolno — pokazuję to, co już pobrano. Reszta pojawi się automatycznie.'); } }, 12000);
}
function onSubErr(c, err){
  const code=err&&err.code||'error'; syncError=code; updateSync();
  if(code==='revoked'||code==='not_granted'){ toast('Utracono dostęp do synchronizacji. Odśwież stronę.', {sticky:true}); return; }
  if(code==='invalid_argument') return;
  // listener is dead: subscribe again with growing delay (no page reload)
  const n=(Cloud.retry[c]||0)+1; Cloud.retry[c]=n;
  if(n>6){ if(!Cloud.deadTold){ Cloud.deadTold=true; toast('Synchronizacja z kontem Claude przestała odpowiadać. Twoje zmiany są zachowane w tej karcie — odśwież stronę, aby połączyć ponownie.', {sticky:true, action:'Odśwież', onAction:()=>location.reload()}); } return; }
  setTimeout(()=>{ try{ Cloud.subs[c]&&Cloud.subs[c](); }catch(e){} Cloud.subs[c] = c==='settings' ? subscribeSettings() : subscribeColl(c); }, Math.min(30000, 2000*n*n));
}

/* ---------------- undo ---------------- */
let undoStack=[];
let undoMute=0;   // >0 while a bulk action runs: its inner steps do not add their own undo entries
function pushUndo(label, items){ if(undoMute) return; undoStack.push({label, items}); if(undoStack.length>20) undoStack.shift(); }
function undoLast(){
  const u=undoStack.pop(); if(!u) return;
  u.items.forEach(({coll, before, id})=>{ if(before) put(coll, clone(before)); else del(coll, id); });
  toast('Cofnięto: '+u.label);
}
function snapshotFor(coll, ids){ return ids.map(id=>({coll, id, before: S[coll].get(id) ? clone(S[coll].get(id)) : null})); }

/* ---------------- quick add parser (natural language, Polish) ---------------- */
const WD = [['niedziela|niedzielę|niedziele|niedz|nd',0],['poniedziałek|poniedzialek|pon|pn',1],['wtorek|wt',2],['środa|środę|sroda|srode|śr|sr',3],['czwartek|czw|cz',4],['piątek|piatek|pt',5],['sobota|sobotę|sobote|sob|sb',6]];
function matchPerson(tok){
  const n=norm(tok).replace(/[_.]/g,' ');
  const list=sorted('people').filter(p=>p.active!==false);
  const full=p=>[norm(personFirst(p)+' '+personLast(p)), norm(personLast(p)+' '+personFirst(p))];
  return list.find(p=>full(p).includes(n)) || list.find(p=>full(p).some(f=>f.startsWith(n))) || list.find(p=>full(p)[0].split(/\s+/).some(w=>w.startsWith(n)));
}
function matchProject(tok){
  const n=norm(tok).replace(/_/g,' ');
  const list=sorted('projects').filter(p=>p.status!=='archived');
  return list.find(p=>norm(p.code)===n) || list.find(p=>norm(p.name)===n) || list.find(p=>norm(p.name).startsWith(n)) || list.find(p=>norm(p.name).split(/\s+/).some(w=>w.startsWith(n)));
}
function matchCategory(tok){ const n=norm(tok).replace(/_/g,' '); const l=sorted('categories'); return l.find(c=>norm(c.name)===n) || l.find(c=>norm(c.name).startsWith(n)) || l.find(c=>norm(c.name).split(/\s+/).some(w=>w.startsWith(n))); }
function matchTag(tok){ const n=norm(tok); return [...S.tags.values()].find(t=>norm(t.name)===n); }

function parseQuick(text){
  const r={title:'', tags:[], newTags:[], people:[], project:null, client:null, category:null, priority:null, due:null, time:null, milestone:false, hard:false, recur:null};
  let s=' '+text+' ';
  const T=today();
  const take=(re, fn)=>{ s=s.replace(re, (...a)=>{ const v=fn(...a); return v===false ? a[0] : ' '; }); };
  take(/\s!!(?=\s)/g, ()=>{ r.hard=true; });
  take(/\s(?:!|p)([1-4])(?=\s)/gi, (m,d)=>{ r.priority=+d; });
  take(/\s\*(?=\s)/g, ()=>{ r.milestone=true; });
  take(/\s#([\p{L}\p{N}_\-]+)/gu, (m,t)=>{ const tg=matchTag(t); if(tg){ if(!r.tags.includes(tg.id)) r.tags.push(tg.id); } else if(!r.newTags.some(x=>norm(x)===norm(t))) r.newTags.push(t); });
  take(/\s@([\p{L}\p{N}_\-.]+)/gu, (m,n)=>{ const p=matchPerson(n); if(!p) return false; if(!r.people.includes(p.id)) r.people.push(p.id); });
  take(/\s\+([\p{L}\p{N}_\-.]+)/gu, (m,n)=>{ const p=matchProject(n); if(!p) return false; r.project=p.id; });
  take(/\s\/([\p{L}\p{N}_\-]+)/gu, (m,n)=>{ const c=matchCategory(n); if(!c) return false; r.category=c.id; });
  take(/\s\$([\p{L}\p{N}_\-.]+)/gu, (m,n)=>{ const c=matchClient(n); if(!c) return false; r.client=c.id; });
  // recurrence
  take(/\s(?:codziennie|co\s+dzie[ńn])(?=\s)/gi, ()=>{ r.recur={freq:'daily',interval:1}; });
  take(/\s(?:w\s+)?dni\s+(?:robocze|powszednie)(?=\s)/gi, ()=>{ r.recur={freq:'weekdays',interval:1}; });
  take(/\sco\s+(\d+)\s+(dni|tygodnie|tygodni|miesiące|miesiace|miesięcy|miesiecy|lata|lat)(?=\s)/gi, (m,n,u)=>{ const un=norm(u); r.recur={freq: un.startsWith('dni')?'daily': un.startsWith('tyg')?'weekly': un.startsWith('mies')?'monthly':'yearly', interval:+n}; });
  take(/\s(?:co\s+tydzie[ńn]|cotygodniowo)(?=\s)/gi, ()=>{ r.recur={freq:'weekly',interval:1}; });
  take(/\s(?:co\s+miesi[ąa]c|comiesi[ęe]cznie)(?=\s)/gi, ()=>{ r.recur={freq:'monthly',interval:1}; });
  take(/\s(?:co\s+roku?|corocznie)(?=\s)/gi, ()=>{ r.recur={freq:'yearly',interval:1}; });
  // dates
  take(/\s(?:na\s+|do\s+)?(?:dzi[śs]|dzisiaj)(?=\s)/gi, ()=>{ r.due=T; });
  take(/\s(?:na\s+|do\s+)?pojutrze(?=\s)/gi, ()=>{ r.due=addDays(T,2); });
  take(/\s(?:na\s+|do\s+)?jutro(?=\s)/gi, ()=>{ r.due=addDays(T,1); });
  take(/\s(?:w\s+)?przysz[łl]ym\s+tygodniu(?=\s)/gi, ()=>{ r.due=addDays(startOfWeek(T),7); });
  take(/\s(?:na\s+|do\s+)?koniec\s+miesi[ąa]ca(?=\s)/gi, ()=>{ const d=D(T); r.due=ymd(new Date(d.getFullYear(), d.getMonth()+1, 0)); });
  take(/\sza\s+(\d+)\s+(dzie[ńn]|dni|tydzie[ńn]|tygodnie|tygodni|tyg\.?|miesi[ąa]c|miesi[ąa]ce|miesi[ęe]cy|mies\.?)(?=\s)/gi, (m,n,u)=>{
    const un=norm(u); n=+n; r.due = un.startsWith('dz')||un.startsWith('dni') ? addDays(T,n) : un.startsWith('tyg') ? addDays(T,7*n) : addMonths(T,n); });
  for(const [names, dow] of WD){
    const re=new RegExp(`\\s(?:(?:w|we|na|do)\\s+)?(?:(przysz[łl]y|przysz[łl]ą|nast[ęe]pny|nast[ęe]pną)\\s+)?(?:${names})(?=\\s)`, 'gi');
    take(re, (m, nx)=>{ const cur=D(T).getDay(); let add=(dow-cur+7)%7; if(add===0) add=7; if(nx && add<7) add+=7; r.due=addDays(T,add); });
  }
  const real=s=>{ try{ return ymd(D(s))===s; }catch(e){ return false; } };   // 31.11 or 30.02 is left in the title instead of becoming a date that no view shows
  take(/\s(\d{4})-(\d{2})-(\d{2})(?=\s)/g, (m,y,mo,d)=>{ const c=`${y}-${mo}-${d}`; if(!real(c)) return false; r.due=c; });
  take(/\s(?:do\s+|na\s+)?(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?=\s)/g, (m,d,mo,y)=>{
    d=+d; mo=+mo; if(mo<1||mo>12||d<1||d>31) return false;
    let yy = y ? (+y<100? 2000+(+y) : +y) : D(T).getFullYear();
    let cand=`${yy}-${pad(mo)}-${pad(d)}`;
    if(!y && cand<T) cand=`${yy+1}-${pad(mo)}-${pad(d)}`;
    if(!real(cand)) return false;
    r.due=cand;
  });
  // time
  take(/\s(?:o\s+|godz\.?\s*|g\.\s*)?([01]?\d|2[0-3]):([0-5]\d)(?=\s)/g, (m,h,mi)=>{ r.time=`${pad(+h)}:${mi}`; });
  take(/\s(?:o|godz\.?)\s+([01]?\d|2[0-3])(?=\s)/gi, (m,h)=>{ r.time=`${pad(+h)}:00`; });
  if(r.time && !r.due){ const n=new Date(); const hm=`${pad(n.getHours())}:${pad(n.getMinutes())}`; r.due = r.time>hm ? T : addDays(T,1); }
  if(r.recur && !r.due) r.due=T;
  r.title=s.replace(/\s+/g,' ').trim();
  return r;
}

const RECUR_PL = {daily:'Codziennie', weekdays:'W dni robocze', weekly:'Co tydzień', monthly:'Co miesiąc', yearly:'Co rok'};
function recurLabel(r){ if(!r) return ''; if(r.interval>1){ const u={daily:['dzień','dni','dni'],weekly:['tydzień','tygodnie','tygodni'],monthly:['miesiąc','miesiące','miesięcy'],yearly:['rok','lata','lat'],weekdays:['dzień roboczy','dni robocze','dni roboczych']}[r.freq]; return `Co ${r.interval} ${plural(r.interval,u[0],u[1],u[2])}`; } return RECUR_PL[r.freq]||''; }

/* ---------- Polish public holidays & business days ----------
   A deadline that falls on a Saturday, Sunday or public holiday moves to the

function easterDate(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);

  return ymd(new Date(y, month-1, day, 12));

const HOL_CACHE={};

/* ---------- recurrence v2: anchored day of month, optional business-day shift ---------- */
function stepNominal(base, r){
  const n=r.interval||1;
  if(r.freq==='daily') return addDays(base,n);
  if(r.freq==='weekly') return addDays(base,7*n);
  if(r.freq==='weekdays'){ let d=addDays(base,1), g=0; while(!isWorkday(d) && g++<14) d=addDays(d,1); return d; }
  if(r.freq==='monthly'||r.freq==='yearly'){
    const b=D(base); const months=r.freq==='monthly'?n:12*n; const day=r.day||b.getDate();
    const y=b.getFullYear(), m=b.getMonth()+months; const last=new Date(y, m+1, 0).getDate();
    return ymd(new Date(y, m, Math.min(day,last), 12));
  }
  return addDays(base,1);
}
/** moves a recurring task to its next occurrence (mutates t); returns the day shift */
function advanceRecurring(t){
  const r=t.recur; if(!r) return 0;
  const base=t.recurBase || t.due || today();
  if((r.freq==='monthly'||r.freq==='yearly') && !r.day) r.day=D(base).getDate();
  const nominal=stepNominal(base, r);
  const due = r.workday ? nextWorkday(nominal) : nominal;
  const delta = t.due ? diffDays(t.due, due) : 0;
  t.recurBase=nominal; t.due=due;
  if(t.start) t.start=addDays(t.start, delta);
  t.reminders=(t.reminders||[]).filter(x=>!x.snooze && x.at).map(x=>{ const [d,h]=x.at.split('T'); return {...x, at:`${addDays(d,delta)}T${h}`, fired:false}; });   // odłożenia dotyczyły tylko tego wystąpienia
  return delta;
}
/** completes one occurrence: the task moves to the next date and its subtasks reopen */
function completeRecurring(id, opts={}){
  const t0=S.tasks.get(id); if(!t0||!t0.recur) return;
  const kids=descendants(id);
  const before=snapshotFor('tasks',[id, ...kids.map(k=>k.id)]);
  let delta=0;
  upd('tasks', id, t=>{
    const was=t.due; delta=advanceRecurring(t);
    if(isClosed(t)){ t.status = t.prevStatus && !['done','cancelled'].includes(statusById(t.prevStatus).type) ? t.prevStatus : firstStatusOfType('active','todo'); }
    t.completedAt=null; t.lastDoneAt=Date.now();
    t.doneLog=[...(t.doneLog||[]), {due:was, at:Date.now()}].slice(-400);   // a year of daily occurrences stays countable in reports
    logH(t, `Ukończono wystąpienie z ${was?fmtNum(was):'—'}; następne: ${fmtNum(t.due)}`);
  });
  kids.forEach(k=>upd('tasks', k.id, x=>{
    if(isClosed(x) && statusById(x.status).type!=='cancelled'){ x.status = x.assignees?.length && S.statuses.has('przydzielone') ? 'przydzielone' : firstStatusOfType('todo'); x.completedAt=null; }
    if(x.due && delta) x.due=addDays(x.due, delta);
    x.reminders=(x.reminders||[]).filter(r=>!r.snooze && r.at).map(r=>{ const [d,h]=r.at.split('T'); return {...r, at: delta ? `${addDays(d,delta)}T${h}` : r.at, fired:false}; });   // przypomnienia podzadania przesuwają się razem z jego terminem
  }));
  pushUndo('ukończenie wystąpienia', before);
  if(!opts.silent) toast(`Zadanie cykliczne: następny termin ${fmtDate(S.tasks.get(id).due)}${kids.length?' · podzadania odnowione':''}`, {action:'Cofnij', onAction:undoLast});
}

function dutyFirstNominal(duty, from){
  const f=D(from); let y=f.getFullYear(), m=f.getMonth()+1;

  if(duty.freq==='yearly'){ let d=mk(y, duty.month); if(nextWorkday(d)<from) d=mk(y+1, duty.month); return d; }

}

/* "Dziś": open tasks due today or earlier, tasks starting today, and tasks closed today — the same rule for the list and the menu counter */
function inToday(t){ const T=today(); if(isClosed(t)) return !!t.completedAt && ymd(new Date(t.completedAt))===T; return (!!t.due && t.due<=T) || t.start===T; }
function scopeTasks(route){
  const {kind,id}=route ? parseRoute(route) : rp(); const T=today(); const all=tasksArr();
  switch(kind){
    case 'inbox': return all.filter(t=>!t.projectId && !t.categoryId && !t.clientId);
    case 'today': return all.filter(inToday);
    case 'upcoming': return all.filter(t=>t.due && t.due>=T && t.due<=addDays(T,13));
    case 'milestones': return all.filter(t=>t.milestone);
    case 'area': return all.filter(t=>taskArea(t)===id);
    case 'cat': return all.filter(t=>t.categoryId===id);
    case 'project': return all.filter(t=>t.projectId===id);
    case 'client': return all.filter(t=>t.clientId===id || (t.projectId && S.projects.get(t.projectId)?.clientId===id));
    case 'person': return all.filter(t=>(t.assignees||[]).includes(id));
    case 'dept': return all.filter(t=>t.departmentId===id || (t.assignees||[]).some(p=>(S.people.get(p)?.departmentIds||[]).includes(id)));
    case 'tag': return all.filter(t=>(t.tags||[]).includes(id));
    case 'view': { const b=S.views.get(id)?.base; return b && !b.startsWith('view') ? scopeTasks(b) : all; }   // zapisany widok zachowuje zakres, z którego go zapisano
    default: return all;
  }
}
function applyFilter(ts, v){
  const f=v.filter; const T=today();
  return ts.filter(t=>{
    if(!v.showDone && isClosed(t)) return false;
    if(f.areas.length && !f.areas.includes(taskArea(t))) return false;
    if(f.cats.length && !f.cats.includes(t.categoryId||'none')) return false;
    if(f.projects.length && !f.projects.includes(t.projectId||'none')) return false;
    if(f.clients.length && !f.clients.includes(t.clientId||'none')) return false;
    if(f.statuses.length && !f.statuses.includes(t.status)) return false;
    if(f.pri.length && !f.pri.includes(String(t.priority||0))) return false;
    if(f.tags.length){ const tg=t.tags||[]; if(f.tagMode==='all' ? !f.tags.every(x=>tg.includes(x)) : !f.tags.some(x=>tg.includes(x))) return false; }
    if(f.people.length || f.unassigned){ const a=t.assignees||[]; const ok=(f.unassigned && !a.length) || f.people.some(p=>a.includes(p)); if(!ok) return false; }
    if(f.depts.length){ const ok=f.depts.includes(t.departmentId) || (t.assignees||[]).some(p=>(S.people.get(p)?.departmentIds||[]).some(d=>f.depts.includes(d))); if(!ok) return false; }
    if(f.milestone && !t.milestone) return false;
    if(f.hard && !t.hard) return false;
    if(f.pinned && !t.pinned) return false;
    if(f.blocked && !isBlocked(t)) return false;
    if(f.due){
      const d=t.due;
      if(f.due==='late' && !isLate(t)) return false;
      if(f.due==='today' && d!==T) return false;
      if(f.due==='7' && !(d && d>=T && d<=addDays(T,7))) return false;
      if(f.due==='30' && !(d && d>=T && d<=addDays(T,30))) return false;
      if(f.due==='none' && d) return false;
      if(f.due==='has' && !d) return false;
    }
    if(f.q){ const q=norm(f.q); const hay=norm(`${t.title} ${t.notes||''} ${sigOf(t)} ${(t.comments||[]).map(c=>c.text).join(' ')}`); if(!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
    return true;
  });
}
const SORTS = {manual:'Ręcznie', due:'Termin', priority:'Priorytet', title:'Nazwa', created:'Data utworzenia', updated:'Ostatnia zmiana', num:'Sygnatura'};
function sortTasks(ts, by){
  const a=[...ts]; const pr=t=>t.priority||9;
  const cmp={
    manual:(x,y)=>(x.order??0)-(y.order??0),
    due:(x,y)=>(x.due||'9999')<(y.due||'9999')?-1:(x.due||'9999')>(y.due||'9999')?1:((x.dueTime||'99')<(y.dueTime||'99')?-1:(x.dueTime||'99')>(y.dueTime||'99')?1:pr(x)-pr(y)),
    priority:(x,y)=>pr(x)-pr(y) || ((x.due||'9999')<(y.due||'9999')?-1:(x.due||'9999')>(y.due||'9999')?1:0),
    title:(x,y)=>x.title.localeCompare(y.title,'pl'),
    created:(x,y)=>(y.createdAt||0)-(x.createdAt||0),
    updated:(x,y)=>(y.updatedAt||0)-(x.updatedAt||0),
    num:(x,y)=>(x.num||0)-(y.num||0)

const GROUPS = {none:'Bez grupowania', client:'Klient', project:'Projekt', status:'Status', priority:'Priorytet', due:'Termin', assignee:'Osoba', category:'Kategoria', department:'Dział', area:'Obszar', day:'Dzień', phase:'Etap projektu'};
function dueBucket(t){
  const T=today(); if(!t.due) return 'none';
  if(isClosed(t) && t.due<T) return 'past';        // a closed task is not "overdue"
  if(isLate(t)) return 'late'; if(t.due===T) return 'today'; if(t.due===addDays(T,1)) return 'tomorrow';
  const sow=startOfWeek(T); if(t.due<=addDays(sow,6)) return 'week'; if(t.due<=addDays(sow,13)) return 'nextweek'; return 'later';
}
const DUE_B = [['late','Zaległe'],['today','Dziś'],['tomorrow','Jutro'],['week','Ten tydzień'],['nextweek','Przyszły tydzień'],['later','Później'],['none','Bez terminu'],['past','Zakończone — wcześniejsze terminy']];
function groupsFor(ts, by, opts={}){
  const out=[]; const push=(key,label,color,items,extra={})=>out.push({key,label,color,items,...extra});
  const keepEmpty=opts.keepEmpty;
  if(by==='none'){ push('all','',null,ts); return out; }
  if(by==='status'){ statuses().forEach(s=>{ const it=ts.filter(t=>t.status===s.id); if(it.length||keepEmpty) push(s.id,s.name,s.color,it); }); const known=new Set(statuses().map(s=>s.id)); const orphan=ts.filter(t=>!known.has(t.status)); if(orphan.length) push('?','Inny status','#888',orphan); return out; }
  if(by==='priority'){ [1,2,3,4,0].forEach(p=>{ const it=ts.filter(t=>(t.priority||0)===p); if(it.length||keepEmpty) push(String(p), PRI[p].name, PRI[p].color, it); }); return out; }
  if(by==='due'){ DUE_B.forEach(([k,l])=>{ const it=ts.filter(t=>dueBucket(t)===k); if(it.length||(keepEmpty&&k!=='late')) push(k,l,k==='late'?'var(--danger)':null,it,{cls:k==='late'?'overdue':''}); }); return out; }
  if(by==='day'){ const T=today(); for(let i=0;i<14;i++){ const d=addDays(T,i); const it=ts.filter(t=>t.due===d); if(it.length||i<7||keepEmpty){ const lab=i<2?fmtDate(d):DOW[D(d).getDay()].replace(/^./,c=>c.toUpperCase()); push(d, `${lab} · ${D(d).getDate()} ${MONTHS_GEN[D(d).getMonth()]}`, null, it); } } const late=ts.filter(t=>t.due && t.due<T && !isClosed(t)); const past=ts.filter(t=>t.due && t.due<T && isClosed(t)); if(past.length) push('past','Zakończone — wcześniejsze terminy',null,past); if(late.length) out.unshift({key:'late',label:'Zaległe',color:'var(--danger)',items:late,cls:'overdue'}); return out; }
  if(by==='project'){ sorted('projects').forEach(p=>{ const it=ts.filter(t=>t.projectId===p.id); if(it.length||(keepEmpty&&['active','waiting'].includes(p.status))) push(p.id,p.name,p.color,it); }); const it=ts.filter(t=>!t.projectId||!S.projects.get(t.projectId)); if(it.length||keepEmpty) push('none','Bez projektu',null,it); return out; }
  if(by==='client'){ sorted('clients').sort((a,b)=>alpha(clientLabel(a),clientLabel(b))).forEach(c=>{ const it=ts.filter(t=>t.clientId===c.id); if(it.length||(keepEmpty&&c.active!==false)) push(c.id,clientLabel(c),c.color||null,it); }); const it=ts.filter(t=>!t.clientId||!S.clients.get(t.clientId)); if(it.length||keepEmpty) push('none','Bez klienta',null,it); return out; }
  if(by==='category'){ sorted('categories').forEach(c=>{ const it=ts.filter(t=>t.categoryId===c.id); if(it.length||keepEmpty) push(c.id,c.name,c.color,it); }); const it=ts.filter(t=>!t.categoryId||!S.categories.has(t.categoryId)); if(it.length||keepEmpty) push('none','Bez kategorii',null,it); return out; }
  if(by==='assignee'){ sorted('people').forEach(p=>{ const it=ts.filter(t=>(t.assignees||[]).includes(p.id)); if(it.length||(keepEmpty&&p.active!==false)) push(p.id,personLabel(p),p.color,it); }); const it=ts.filter(t=>!(t.assignees||[]).some(a=>S.people.has(a))); if(it.length||keepEmpty) push('none','Nieprzydzielone',null,it); return out; }
  if(by==='department'){ sorted('departments').forEach(d=>{ const it=ts.filter(t=>t.departmentId===d.id); if(it.length||keepEmpty) push(d.id,d.name,d.color,it); }); const it=ts.filter(t=>!t.departmentId||!S.departments.has(t.departmentId)); if(it.length||keepEmpty) push('none','Bez działu',null,it); return out; }
  if(by==='phase'){ const pr=rp().kind==='project'&&S.projects.get(rp().id); if(pr&&pPhases(pr).length){ const ci=pPhaseIdx(pr); pPhases(pr).forEach((z,k)=>{ const it=ts.filter(t=>t.phaseId===z.id); if(it.length||keepEmpty) push(z.id, `${k+1}. ${z.name}${k===ci?' · bieżący':''}`, k===ci?(pr.color||null):null, it); }); const ids=new Set(pPhases(pr).map(z=>z.id)); const it=ts.filter(t=>!t.phaseId||!ids.has(t.phaseId)); if(it.length||keepEmpty) push('none','Bez etapu',null,it); return out; } push('all','',null,ts); return out; }

  push('all','',null,ts); return out;
}
function applyGroupValue(t, by, val, fromVal){
  const T=today();
  switch(by){
    case 'status': if(t.status!==val && statuses().some(x=>x.id===val)){ const ty=statusById(val).type; /* „Inny status” is not a status to move to */ if(ty==='done'||ty==='cancelled'){ t.prevStatus=t.status; t.completedAt=Date.now(); } else t.completedAt=null; t.status=val; logH(t,`Status: ${statusById(val).name}`); } break;
    case 'priority': t.priority=+val; logH(t,`Priorytet: ${PRI[+val].name}`); break;
    case 'project': { const p=val==='none'?null:S.projects.get(val); if((t.projectId||null)!==(p?p.id:null)) t.phaseId=null; t.projectId=p?p.id:null; if(p){ t.area=p.area||t.area; if(p.categoryId) t.categoryId=p.categoryId; } logH(t, p?`Projekt: ${p.name}`:'Usunięto z projektu'); break; }
    case 'category': { const c=val==='none'?null:S.categories.get(val); t.categoryId=c?c.id:null; if(c) t.area=c.area; break; }
    case 'department': t.departmentId= val==='none'?null:val; break;
    case 'client': t.clientId= val==='none'?null:val; logH(t, val==='none'?'Usunięto klienta':`Klient: ${clientName(val)}`); break;
    case 'area': t.area=val; break;
    case 'phase': t.phaseId= val==='none'?null:val; { const pr=t.projectId&&S.projects.get(t.projectId); const z=pr&&pPhases(pr).find(q=>q.id===val); logH(t, z?`Etap: ${z.name}`:'Usunięto etap'); } break;
    case 'assignee': { let a=(t.assignees||[]).filter(x=>x!==fromVal); if(val==='none') a=[]; else if(!a.includes(val)) a.push(val); t.assignees=a; logH(t, val==='none'?'Usunięto przydział':`Przydzielono: ${personName(val)}`); break; }
    case 'due': { const sow=startOfWeek(T); const m={today:T, tomorrow:addDays(T,1), week: addDays(sow,4)>addDays(T,1)?addDays(sow,4):addDays(sow,6), nextweek:addDays(sow,7), later:addDays(T,21), none:null}; if(val in m){ t.due=m[val]; if(!t.due) t.dueTime=null; logH(t, t.due?`Termin: ${fmtNum(t.due)}`:'Usunięto termin'); } break; }
    case 'day': if(/^\d{4}-\d{2}-\d{2}$/.test(val)){ t.due=val; logH(t,`Termin: ${fmtNum(val)}`); } break;
  }
}

/* keep the current item visible in the sidebar; when it is scrolled away or its section is collapsed, a sticky "Jesteś tutaj" chip appears */
let navObs=null;
function navTrack(){
  const nav=$('#nav'); const here=$('#navHere .nav-here'); const act=nav.querySelector('.nav-item.active');
  if(navObs){ navObs.disconnect(); navObs=null; }
  if(UI._navRoute!==UI.route){ UI._navRoute=UI.route; if(act) requestAnimationFrame(()=>{ const r=act.getBoundingClientRect(), n=nav.getBoundingClientRect(); if(r.top<n.top+4 || r.bottom>n.bottom-8) nav.scrollTop += (r.top - n.top) - n.height/2 + r.height/2; }); }
  if(!act){ here.classList.add('show'); return; }
  if('IntersectionObserver' in window){ navObs=new IntersectionObserver(es=>{ es.forEach(e=>{ const hide=e.intersectionRatio>=0.5; if(here.classList.contains('show')===hide) here.classList.toggle('show', !hide); }); }, {root:nav, threshold:[0,0.5,1]}); navObs.observe(act); }
}
function navReveal(){
  const sec=navSecOf(); if(sec && UI.collapsed[sec]){ UI.collapsed[sec]=false; try{ lsSet('wk.collapsed', UI.collapsed); }catch(_){} }
  if(rp().kind==='person' && UI.collapsed.people){ UI.collapsed.people=false; }
  if(rp().kind==='cat'){ const c=S.categories.get(rp().id); if(c) UI.collapsed['area_'+c.area]=false; }
  if(document.body.classList.contains('side-mini')) document.querySelector('.side-toggle')?.click();
  renderNav();
  const nav=$('#nav'); const act=nav.querySelector('.nav-item.active') || nav.querySelector('.nav-sec-h.here');
  if(act){ const r=act.getBoundingClientRect(), n=nav.getBoundingClientRect(); nav.scrollTo({top: nav.scrollTop + (r.top-n.top) - n.height/2 + r.height/2, behavior:'smooth'}); act.classList.add('flash'); setTimeout(()=>act.classList.remove('flash'), 1400); }
}

function filterCount(f){ return f.areas.length+f.cats.length+f.projects.length+f.clients.length+f.statuses.length+f.pri.length+f.tags.length+f.people.length+(f.unassigned?1:0)+f.depts.length+(f.due?1:0)+(f.milestone?1:0)+(f.hard?1:0)+(f.pinned?1:0)+(f.blocked?1:0)+(f.q?1:0); }
const DUE_F={late:'Zaległe',today:'Na dziś','7':'Najbliższe 7 dni','30':'Najbliższe 30 dni',none:'Bez terminu',has:'Z terminem'};
function filterChips(f){
  const c=[];

  f.areas.forEach(a=>c.push(['areas',a,'Obszar: '+AREAS[a].name]));

  f.projects.forEach(x=>c.push(['projects',x,'Projekt: '+nm('projects',x)]));

  if(t.recur) m.push(`<span class="m" title="${esc(recurLabel(t.recur))}">${ico('i-repeat','s14')}</span>`);
  if(isBlocked(t)) m.push(`<span class="m blocked" title="Blokowane przez: ${esc(openBlockers(t).map(b=>sigOf(b)).join(', '))}">${ico('i-lock','s14')}zablokowane</span>`);

  if(t.notes) m.push(`<span class="m" title="Ma notatki">${ico('i-note','s14')}</span>`);
  if(!ctx.hideProject && t.projectId && S.projects.get(t.projectId)){ const p=S.projects.get(t.projectId); m.push(`<span class="m"><span class="dot" style="width:7px;height:7px;border-radius:2px;background:${esc(p.color)};display:inline-block"></span>${esc(p.name)}</span>`); }
  else if(!t.projectId && t.categoryId && S.categories.get(t.categoryId)){ const c=S.categories.get(t.categoryId); m.push(`<span class="m"><span style="width:7px;height:7px;border-radius:50%;background:${esc(c.color)};display:inline-block"></span>${esc(c.name)}</span>`); }

  const tt=timeTotal(t); const running=timerState()?.taskId===t.id;
  if(tt||t.estimate||running) m.push(`<span class="m ${running?'running':''}" title="Czas pracy${t.estimate?' / szacowany':''}">${ico(running?'i-timer':'i-clock','s14')}${running?'trwa · ':''}${tt?esc(fmtDur(tt)):''}${tt&&t.estimate?' / ':''}${t.estimate?esc(fmtDur(t.estimate)):''}</span>`);

function rowHTML(t, ctx={}){

function renderList(ts, v){
  if(!ts.length) return emptyForRoute();
  const set=new Set(ts.map(t=>t.id));
  const top=ts.filter(t=>!t.parentId || !set.has(t.parentId));
  const groups=groupsFor(sortTasks(top, v.sort), v.group);
  const hideProject = rp().kind==='project' || v.group==='project';
  const hideClient = rp().kind==='client' || v.group==='client';
  let h='';
  const renderTree=(t, depth, group)=>{
    let s=rowHTML(t,{depth, group, hideProject, hideClient, allowNest:true, orphan: depth===0 && t.parentId && !set.has(t.parentId)});
    if(UI.expanded.has(t.id)){ sortTasks(childrenOf(t.id).filter(c=>set.has(c.id)), v.sort).forEach(c=>{ s+=renderTree(c, Math.min(depth+1,2), group); }); }
    return s;
  };
  groups.forEach(g=>{
    if(v.group!=='none'){
      const gIt=g.items;
      h+=`<section class="group"><div class="group-h ${g.cls||''}" data-drop="group:${esc(v.group)}:${esc(g.key)}"><h3>${g.color?`<span class="gdot" style="background:${esc(g.color)}"></span>`:''}${esc(g.label)}</h3><span class="gcount">${gIt.length}</span></div>`;
    } else h+=`<section class="group">`;
    g.items.forEach(t=>{ h+=renderTree(t, 0, g.key); });
    h+=`</section>`;
  });
  return h;
}

function renderBoard(ts, v){
  const set=new Set(ts.map(t=>t.id));

  const by=v.boardBy||'status';
  const groups=groupsFor(sortTasks(top, v.sort), by, {keepEmpty:true}).filter(g=>!(by==='due'&&g.key==='late'&&!g.items.length));

      <div class="col-body">${g.items.map(t=>cardHTML(t,by,g.key)).join('')}</div></div>`;

/* ---------------- calendar ---------------- */
/* Which tasks the calendar shows. A calendar is read as "what is on this day", so in views whose scope
   is narrower than the calendar (Skrzynka, Dziś, Nadchodzące) it shows all tasks by default; in a project,
   client, person etc. it shows that view's tasks. Either way a bar says what is shown and what is hidden. */
const CAL_ALL_DEFAULT = ['inbox','today','upcoming'];
function calShowsAll(v){ const k=rp().kind; if(k==='calendar'||k==='all') return true; return v.calAll ?? CAL_ALL_DEFAULT.includes(k); }
function calRange(){
  const T=today();
  if(UI.calMode==='week'){ const ws=startOfWeek(UI.calSel||T); return [ws, addDays(ws,6)]; }
  const gs=startOfWeek(UI.calMonth||T.slice(0,7)+'-01'); return [gs, addDays(gs,41)];
}
function calScopeBar(v, shown, scopeHidden, filterHidden){
  const k=rp().kind; const nm=routeTitle().title; const all=calShowsAll(v); const fixed=k==='calendar'||k==='all';
  const n=x=>`${x} ${plural(x,'zadanie','zadania','zadań')}`;
  const per=UI.calMode==='week'?'w tym tygodniu':'na tej stronie kalendarza';
  const parts=[];
  if(fixed) parts.push(`Wszystkie zadania z terminem ${per}: <b>${shown}</b>.`);
  else if(all) parts.push(`Pokazuję <b>wszystkie</b> zadania z terminem ${per} (${shown}), nie tylko z widoku „${esc(nm)}”.`);
  else parts.push(`Pokazuję tylko zadania z widoku „${esc(nm)}” (${shown}).${scopeHidden?` Poza nim ${per}: <b>${n(scopeHidden)}</b>.`:''}`);
  if(filterHidden) parts.push(`Filtry ukrywają tu <b>${n(filterHidden)}</b>.`);
  let btns='';
  if(!fixed) btns+= all ? `<button class="btn sm" type="button" data-act="cal-scope" data-v="0">Tylko „${esc(nm)}”</button>` : `<button class="btn sm${scopeHidden?' primary':''}" type="button" data-act="cal-scope" data-v="1">Pokaż wszystkie zadania</button>`;
  if(filterHidden) btns+=`<button class="btn sm" type="button" data-act="clear-filter">Wyczyść filtry</button>`;
  const warn=(!all&&scopeHidden)||filterHidden;
  return `<div class="cal-scope ${warn?'warn':''}">${ico(warn?'i-filter':'i-cal','s14')}<span class="cal-scope-t">${parts.join(' ')}</span>${btns?`<span class="cal-scope-b">${btns}</span>`:''}</div>`;
}
function renderCalendar(ts, v){
  const T=today();
  if(!UI.calMonth) UI.calMonth=T.slice(0,7)+'-01';
  const m0=UI.calMonth; const md=D(m0);
  const gridStart=startOfWeek(m0);
  const days=[]; for(let i=0;i<42;i++) days.push(addDays(gridStart,i));
  // source: the view's own tasks, or all tasks (with the view's filters) — see calShowsAll
  const showAll=calShowsAll(v);
  const src = showAll ? applyFilter(tasksArr(), v) : ts;
  const [r0,r1]=calRange(); const inR=t=>!!t.due && t.due>=r0 && t.due<=r1;
  const shown=src.filter(inR).length;
  const inSrc=new Set(src.map(t=>t.id));
  const scopeHidden = showAll ? 0 : applyFilter(tasksArr(), v).filter(t=>inR(t) && !inSrc.has(t.id)).length;
  const unfiltered = applyFilter(showAll ? tasksArr() : scopeTasks(), {...v, filter:emptyFilter()}).filter(inR).length;
  const filterHidden = Math.max(0, unfiltered - shown);
  const bar=calScopeBar(v, shown, scopeHidden, filterHidden);
  const byDay={}; src.forEach(t=>{ if(t.due){ (byDay[t.due]=byDay[t.due]||[]).push(t); } });
  Object.values(byDay).forEach(a=>a.sort((x,y)=>(x.dueTime||'99').localeCompare(y.dueTime||'99') || (x.priority||9)-(y.priority||9)));
  const projDue={}; if(showAll || rp().kind==='area') sorted('projects').forEach(p=>{ if(p.due && p.status!=='archived') (projDue[p.due]=projDue[p.due]||[]).push(p); });
  if(UI.calMode==='week') return renderWeek(src, byDay, projDue, bar);
  let h=`<div class="cal-head"><button class="icon-btn bordered" type="button" data-act="cal-prev" aria-label="Poprzedni miesiąc">${ico('i-chevl')}</button><h2>${MONTHS[md.getMonth()]} ${md.getFullYear()}</h2><button class="icon-btn bordered" type="button" data-act="cal-next" aria-label="Następny miesiąc">${ico('i-chev')}</button><button class="btn sm" type="button" data-act="cal-today">Dziś</button><div class="seg" style="margin-left:auto"><button type="button" class="on" data-act="cal-mode" data-v="month">Miesiąc</button><button type="button" data-act="cal-mode" data-v="week">Tydzień</button></div></div>`;
  h+=bar;
  h+=`<div style="overflow-x:auto"><div class="cal">${['Pon','Wt','Śr','Czw','Pt','Sob','Nd'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}`;
  days.forEach(d=>{
    const dd=D(d); const other=dd.getMonth()!==md.getMonth(); const hol=holidayName(d); const wk=[0,6].includes(dd.getDay())||!!hol;
    const items=byDay[d]||[]; const pds=projDue[d]||[];
    const max=4; const shown=items.slice(0, max-Math.min(pds.length,1));
    h+=`<div class="cal-day ${other?'other':''} ${wk&&!other?'wknd':''} ${d===T?'today':''} ${UI.calSel===d?'sel':''} ${hol?'hol':''}" data-drop="cal:${d}" data-act="cal-day" data-date="${d}" ${hol?`title="${esc(hol)}"`:''}>
      <div class="dn"><b>${dd.getDate()}</b>${hol?`<span class="hol-name">${esc(hol)}</span>`:''}${items.length?`<span class="muted" style="font-size:10px">${items.length}</span>`:''}</div>
      ${pds.slice(0,1).map(p=>`<div class="cev proj" style="border-left-color:${esc(p.color)}" data-act="go-project" data-id="${p.id}" title="Termin projektu">${ico('i-flag','s14')}${esc(p.name)}</div>`).join('')}
      ${shown.map(t=>`<div class="cev ${isClosed(t)?'done':''} ${t.milestone?'ms':''}" style="border-left-color:${esc(t.projectId&&S.projects.get(t.projectId)?S.projects.get(t.projectId).color:(PRI[t.priority||0].color))}" data-drag="task:${t.id}" data-drag-label="${esc(t.title)}" data-act="open" data-id="${t.id}" title="${esc(t.title)}">${t.dueTime?`<span class="t">${esc(t.dueTime)}</span>`:''}${t.milestone?ico('i-diamond','s14'):''}${esc(t.title)}</div>`).join('')}
      ${items.length>shown.length?`<div class="cal-more">+${items.length-shown.length} więcej</div>`:''}
    </div>`;
  });
  h+=`</div></div>`;
  const sel=UI.calSel||T;
  const its=sortTasks(byDay[sel]||[], 'due');
  h+=`<div class="agenda"><div class="panel-h"><h3>${esc(fmtLong(sel))}${holidayName(sel)?` <span class="pill soft" style="font-family:var(--f-body);vertical-align:middle">${esc(holidayName(sel))}</span>`:''}</h3><button class="btn sm" type="button" data-act="add-on-day" data-date="${sel}">${ico('i-plus','s14')}Dodaj na ten dzień</button></div>`;
  h+= its.length ? `<section class="group">${its.map(t=>rowHTML(t,{group:sel})).join('')}</section>` : `<p class="muted" style="font-size:13px">Brak zadań tego dnia.</p>`;
  h+=`</div>`;
  return h;
}

/* ---------------- matrix ---------------- */
function quadOf(t){ const imp=t.priority===1||t.priority===2; const urg=t.due && diffDays(today(), t.due)<=2; return imp&&urg?1: imp?2: urg?3: 4; }
function renderMatrix(ts){
  const Q=[[1,'Zrób teraz','Ważne i pilne','var(--danger)'],[2,'Zaplanuj','Ważne, niepilne','var(--info)'],[3,'Deleguj','Pilne, mniej ważne','var(--warn)'],[4,'Ogranicz','Ani pilne, ani ważne','var(--fg-3)']];
  const set=new Set(ts.map(t=>t.id)); const top=ts.filter(t=>!t.parentId||!set.has(t.parentId));
  let h=`<p class="muted" style="font-size:12.5px;margin:0 0 10px">Ważne = priorytet P1 lub P2. Pilne = termin w ciągu 2 dni lub zaległy. Przeciągnięcie między ćwiartkami zmienia priorytet i w razie potrzeby termin.</p><div class="matrix">`;
  Q.forEach(([n,t1,t2,c])=>{
    const it=sortTasks(top.filter(t=>quadOf(t)===n),'due');
    h+=`<div class="quad" data-drop="quad:${n}"><div class="quad-h"><span class="q" style="background:${c}">Q${n}</span><b>${t1}</b><span>${t2} · ${it.length}</span></div><div class="quad-body">${it.map(t=>rowHTML(t,{showStatus:false})).join('')||`<p class="muted" style="font-size:12.5px;padding:8px">Brak zadań.</p>`}</div></div>`;
  });
  return h+`</div>`;
}

  const T=today(); const all=tasksArr(); const open=all.filter(t=>!isClosed(t));

  // two-week strip: load per day, statutory deadlines and public holidays

  h+=`<div class="ov-grid"><div>`;

const PSTAT={idea:'Pomysł',planned:'Planowany',active:'W realizacji',waiting:'Czeka na kogoś',onhold:'Wstrzymany',done:'Zakończony',archived:'Zarchiwizowany'};
function ringSVG(pct, color){ const r=30, c=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--sunken)" stroke-width="7"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="${esc(color)}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 36 36)"/><text x="36" y="41" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="var(--fg)">${pct}%</text></svg>`; }
function projectHeader(p){
  const s=projectStats(p.id); const cat=p.categoryId&&S.categories.get(p.categoryId);
  let h=`<div class="phead" style="--ph-color:${esc(p.color||'')}"><div style="min-width:0">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill soft">${esc(AREAS[p.area||'work'].name)}</span>${cat?`<span class="pill soft"><span class="d" style="background:${esc(cat.color)}"></span>${esc(cat.name)}</span>`:''}<span class="pill soft">${esc(PSTAT[p.status||'active'])}</span>${p.code?`<span class="sig">${esc(p.code)}</span>`:''}</div>
    ${p.description?`<p class="desc">${esc(p.description)}</p>`:''}
    <div class="facts">
      ${p.clientId&&S.clients.get(p.clientId)?`<span><b>Klient</b><button type="button" class="link" data-nav="client:${p.clientId}" style="font-size:12.5px">${esc(S.clients.get(p.clientId).name)}</button></span>`:''}
      <span><b>Opiekun</b>${p.ownerId?esc(personName(p.ownerId)):'—'}</span>
      <span><b>Start</b>${p.start?fmtNum(p.start):'—'}</span>
      <span><b>Termin</b>${p.due?`<span style="${p.due<today()&&pLive(p)?'color:var(--danger);font-weight:600':''}">${fmtNum(p.due)}</span>`:'—'}</span>
      <span><b>Zadania</b>${s.done}/${s.total}${s.late?` · <span style="color:var(--danger)">${s.late} po terminie</span>`:''}</span>
      ${(p.members||[]).length?`<span style="display:inline-flex;align-items:center;gap:6px"><b>Zespół</b>${avatars(sortPeopleIds(p.members),6)}</span>`:''}
    </div></div>${ringSVG(s.pct, p.color||'var(--accent)')}</div>`;

  h+=`<div class="ptabs">${[['tasks','Zadania'],['about','Przegląd i notatki'],['comments',`Komentarze${(p.comments||[]).length?' ('+p.comments.length+')':''}`]].map(([k,l])=>`<button type="button" class="${UI.projTab===k?'on':''}" data-act="ptab" data-tab="${k}">${l}</button>`).join('')}</div>`;
  return h;
}

/* ---------------- timeline ---------------- */
function renderTimeline(){
  const T=today();
  if(!UI.tlStart){ const d=D(T); d.setDate(1); d.setMonth(d.getMonth()-1); UI.tlStart=ymd(d); }
  const start=UI.tlStart; const months=7; const end=addMonths(start, months);
  const total=diffDays(start,end); const W=Math.max(7, Math.min(10, Math.floor(1100/total*1.6)));
  const x=d=>diffDays(start,d)*W;
  const ps=sorted('projects').filter(p=>p.status!=='archived');
  let h=`<div class="cal-head"><button class="icon-btn bordered" type="button" data-act="tl-prev" aria-label="Wcześniej">${ico('i-chevl')}</button><h2>${MONTHS[D(start).getMonth()]} – ${MONTHS[D(addMonths(start,months-1)).getMonth()]} ${D(addMonths(start,months-1)).getFullYear()}</h2><button class="icon-btn bordered" type="button" data-act="tl-next" aria-label="Później">${ico('i-chev')}</button><button class="btn sm" type="button" data-act="tl-today">Dziś</button></div>`;
  if(!ps.length) return h+emptyState('Brak projektów','Utwórz projekt z datą startu i terminem, aby zobaczyć go na osi czasu.',`<button class="btn primary" type="button" data-act="add-project">${ico('i-plus','s14')}Nowy projekt</button>`,'i-timeline');
  const width=total*W;
  h+=`<div class="tl-wrap"><div class="tl" style="width:${width+220}px">`;
  h+=`<div class="tl-scale"><div class="tl-label" style="background:var(--surface-2);font-size:11px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.07em;cursor:default">Projekt</div>`;
  for(let i=0;i<months;i++){ const ms=addMonths(start,i), me=addMonths(start,i+1); h+=`<div class="mo" style="width:${diffDays(ms,me)*W}px">${MONTHS[D(ms).getMonth()]} ${D(ms).getFullYear()}</div>`; }
  h+=`</div>`;
  const rowsH=[];
  const lines=[]; for(let i=1;i<months;i++) lines.push(`<div class="tl-grid" style="left:${x(addMonths(start,i))}px"></div>`);
  const todayLine = T>=start&&T<end ? `<div class="tl-today" style="left:${x(T)}px"></div>` : '';
  const row=(label, color, track, nav)=>`<div class="tl-row"><div class="tl-label" ${nav}><span style="width:9px;height:9px;border-radius:3px;background:${esc(color)};flex:none"></span><span>${esc(label)}</span></div><div class="tl-track" style="width:${width}px">${lines.join('')}${todayLine}${track}</div></div>`;
  ps.forEach(p=>{
    const ts=tasksArr().filter(t=>t.projectId===p.id);
    const dates=ts.map(t=>t.due).filter(Boolean).sort();
    const s0=p.start || dates[0] || ymd(new Date(p.createdAt||Date.now()));
    const e0=p.due || dates[dates.length-1] || addDays(s0,14);
    const st=projectStats(p.id);
    let track='';
    const a=s0<start?start:s0, b=e0>end?end:e0;
    if(b>=start && a<=end && a<=b){ track+=`<div class="tl-bar" style="left:${x(a)}px;width:${Math.max(W,(diffDays(a,b)+1)*W)}px;background:${esc(p.color||'#888')}" data-nav="project:${p.id}" title="${esc(p.name)}: ${fmtNum(s0)} – ${fmtNum(e0)}"><span class="fill" style="transform:scaleX(${st.pct/100})"></span><span style="position:relative">${st.pct}%</span></div>`; }
    ts.filter(t=>t.milestone&&t.due&&t.due>=start&&t.due<end).forEach(t=>{ track+=`<div class="tl-ms ${isDone(t)?'done':''}" style="left:${x(t.due)+W/2}px" data-act="open" data-id="${t.id}" title="${esc(t.title)} · ${fmtNum(t.due)}"></div>`; });
    rowsH.push(row(p.name, p.color||'#888', track, `data-nav="project:${p.id}"`));
  });
  const loose=tasksArr().filter(t=>!t.projectId&&t.milestone&&t.due&&t.due>=start&&t.due<end);
  if(loose.length) rowsH.push(row('Kamienie bez projektu','var(--brass)', loose.map(t=>`<div class="tl-ms ${isDone(t)?'done':''}" style="left:${x(t.due)+W/2}px" data-act="open" data-id="${t.id}" title="${esc(t.title)}"></div>`).join(''), ''));
  h+=rowsH.join('')+`</div></div>`;
  h+=`<div class="legend" style="margin-top:10px"><span><i style="background:var(--brass);transform:rotate(45deg)"></i>Kamień milowy</span><span><i style="background:var(--ok);transform:rotate(45deg)"></i>Osiągnięty</span><span><i style="background:var(--accent);width:2px"></i>Dziś</span><span>Pasek: od startu do terminu projektu, wypełnienie = postęp</span></div>`;
  return h;
}

    h+=`</tbody></table></div><p class="muted" style="font-size:12px;margin-top:8px">Lista alfabetyczna według nazwisk. Kliknij osobę, aby zobaczyć jej zadania.</p>`;
