<style>
/* Layout: biuro kancelarii — granatowa szyna nawigacji z mosiężnymi akcentami, szklany pasek narzędzi, robocza wokanda zadań i pływająca karta sprawy po prawej.
   Dzień = porcelana + granat; Noc = atrament + mosiądz. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --sunken:#EBEEF4; --hover:#F0F2F7;
  --line:#E2E6EE; --line-strong:#CAD1DE;
  --fg:#0E1A2F; --fg-2:#4A566F; --fg-3:#8691A7;
  --accent:#1D3A6E; --accent-hover:#152E59; --accent-fg:#FFFFFF; --accent-soft:#E8EEF8; --accent-line:#B8C7E3;
  --accent-grad:linear-gradient(135deg,#2A4E8C 0%,#1D3A6E 55%,#14284F 100%);
  --gold:#A9802F; --gold-bright:#C9A253; --gold-soft:#F6EEDB; --gold-line:#E4D0A2;
  --brass:var(--gold); --brass-soft:var(--gold-soft);
  --danger:#C5372C; --danger-soft:#FCEAE7; --warn:#B2701A; --warn-soft:#FBF1DF; --ok:#1C7C53; --ok-soft:#E1F3EA; --info:#2D68C4; --info-soft:#E5EEFB;
  --side-bg:linear-gradient(180deg,#0E1B33 0%,#112347 62%,#14295A 100%);
  --side-fg:#E7EDF8; --side-fg-2:#A8B5CE; --side-fg-3:#6E7E9E; --side-hover:rgba(255,255,255,.06); --side-active:linear-gradient(90deg,rgba(212,175,96,.20),rgba(212,175,96,.04)); --side-line:rgba(255,255,255,.08); --side-input:rgba(255,255,255,.07);
  --hero-grad:linear-gradient(118deg,#10234A 0%,#1D3A6E 52%,#2B5394 100%);
  --hero-fg:#F4F7FD; --hero-fg-2:#B9C6DF;
  --glass:rgba(242,244,248,.74); --glass-strong:rgba(255,255,255,.86);
  --glow:rgba(169,128,47,.10);
  --shadow-1:0 1px 2px rgba(14,26,47,.05),0 1px 3px rgba(14,26,47,.04);
  --shadow-2:0 10px 30px -10px rgba(14,26,47,.20),0 2px 6px rgba(14,26,47,.06);
  --shadow-3:0 30px 80px -20px rgba(14,26,47,.38),0 6px 18px rgba(14,26,47,.10);
  --ring:0 0 0 3px rgba(29,58,110,.16);
  --scrim:rgba(8,16,34,.40);
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px;
  --side-w:272px; --detail-w:520px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A101D; --surface:#111A2C; --surface-2:#142036; --sunken:#0C1424; --hover:#18243B;
  --line:#1E2A42; --line-strong:#2D3B59;
  --fg:#E9EEF7; --fg-2:#A6B2CA; --fg-3:#6D7A95;
  --accent:#D6B163; --accent-hover:#E5C682; --accent-fg:#16110A; --accent-soft:#282214; --accent-line:#5F4E2B;
  --accent-grad:linear-gradient(135deg,#E8C982 0%,#D2AA58 55%,#B38A3A 100%);
  --gold:#D6B163; --gold-bright:#E8C982; --gold-soft:#282214; --gold-line:#5F4E2B;
  --danger:#F28B7F; --danger-soft:#3A1E1E; --warn:#EBB767; --warn-soft:#382A16; --ok:#5CCB97; --ok-soft:#11301F; --info:#8DB2F6; --info-soft:#162742;
  --side-bg:linear-gradient(180deg,#060B16 0%,#0A1222 100%);
  --side-fg:#E3E9F4; --side-fg-2:#9AA7C0; --side-fg-3:#5E6C88; --side-hover:rgba(255,255,255,.05); --side-active:linear-gradient(90deg,rgba(214,177,99,.18),rgba(214,177,99,.03)); --side-line:rgba(255,255,255,.06); --side-input:rgba(255,255,255,.05);
  --hero-grad:linear-gradient(118deg,#0E1830 0%,#13213F 55%,#1A2C52 100%);
  --hero-fg:#F1F4FA; --hero-fg-2:#9FAECB;
  --glass:rgba(10,16,29,.72); --glass-strong:rgba(17,26,44,.88);
  --glow:rgba(214,177,99,.07);
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 12px 32px -10px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.3);
  --shadow-3:0 30px 80px -20px rgba(0,0,0,.85),0 6px 18px rgba(0,0,0,.4);
  --ring:0 0 0 3px rgba(214,177,99,.20);
  --scrim:rgba(0,0,0,.58);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A101D; --surface:#111A2C; --surface-2:#142036; --sunken:#0C1424; --hover:#18243B;
  --line:#1E2A42; --line-strong:#2D3B59;
  --fg:#E9EEF7; --fg-2:#A6B2CA; --fg-3:#6D7A95;
  --accent:#D6B163; --accent-hover:#E5C682; --accent-fg:#16110A; --accent-soft:#282214; --accent-line:#5F4E2B;
  --accent-grad:linear-gradient(135deg,#E8C982 0%,#D2AA58 55%,#B38A3A 100%);
  --gold:#D6B163; --gold-bright:#E8C982; --gold-soft:#282214; --gold-line:#5F4E2B;
  --danger:#F28B7F; --danger-soft:#3A1E1E; --warn:#EBB767; --warn-soft:#382A16; --ok:#5CCB97; --ok-soft:#11301F; --info:#8DB2F6; --info-soft:#162742;
  --side-bg:linear-gradient(180deg,#060B16 0%,#0A1222 100%);
  --side-fg:#E3E9F4; --side-fg-2:#9AA7C0; --side-fg-3:#5E6C88; --side-hover:rgba(255,255,255,.05); --side-active:linear-gradient(90deg,rgba(214,177,99,.18),rgba(214,177,99,.03)); --side-line:rgba(255,255,255,.06); --side-input:rgba(255,255,255,.05);
  --hero-grad:linear-gradient(118deg,#0E1830 0%,#13213F 55%,#1A2C52 100%);
  --hero-fg:#F1F4FA; --hero-fg-2:#9FAECB;
  --glass:rgba(10,16,29,.72); --glass-strong:rgba(17,26,44,.88);
  --glow:rgba(214,177,99,.07);
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 12px 32px -10px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.3);
  --shadow-3:0 30px 80px -20px rgba(0,0,0,.85),0 6px 18px rgba(0,0,0,.4);
  --ring:0 0 0 3px rgba(214,177,99,.20);
  --scrim:rgba(0,0,0,.58);
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"ss01","cv11"}
body.theme-anim,body.theme-anim *{transition:background-color .35s var(--ease),border-color .35s var(--ease),color .25s var(--ease),box-shadow .35s var(--ease)!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)}
.svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.svg.s14{width:14px;height:14px}.svg.s18{width:18px;height:18px}.svg.s20{width:20px;height:20px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@keyframes fadeUp{from{opacity:.001;transform:translateY(6px)}}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes checkpop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes sheen{from{background-position:-200% 0}to{background-position:200% 0}}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100%}
.sidebar{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px);position:relative;overflow:hidden}
.sidebar::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px 260px at 110% -10%,rgba(214,177,99,.16),transparent 70%),radial-gradient(300px 300px at -20% 110%,rgba(80,120,200,.14),transparent 70%)}
.sidebar > *{position:relative}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}
.seal{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,#E8C982,#B38A3A);color:#14100A;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;box-shadow:0 6px 18px -6px rgba(214,177,99,.6),inset 0 1px 0 rgba(255,255,255,.5);flex:none}
.brand-name{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1;color:#fff}
.brand-sub{font-size:10.5px;color:var(--side-fg-3);letter-spacing:.14em;text-transform:uppercase;margin-top:5px;font-weight:600}
.side-search{margin:4px 14px 8px;display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--side-line);border-radius:10px;background:var(--side-input);color:var(--side-fg-2);font-size:12.5px;width:calc(100% - 28px);text-align:left;transition:border-color .2s,background .2s}
.side-search:hover{border-color:rgba(214,177,99,.4);background:rgba(255,255,255,.09)}
.side-search kbd{margin-left:auto;background:transparent;border-color:var(--side-line);color:var(--side-fg-3)}
kbd{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;color:var(--fg-3);background:var(--surface)}
.side-scroll{flex:1;overflow-y:auto;padding:4px 10px 16px;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.nav-sec{margin-top:16px}
.nav-sec-h{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--side-fg-3)}
.nav-sec-h button{color:var(--side-fg-3);padding:2px;border-radius:5px}.nav-sec-h button:hover{color:var(--side-fg);background:var(--side-hover)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:10px;color:var(--side-fg-2);text-align:left;font-size:13.5px;font-weight:500;position:relative;min-height:34px;transition:background .15s,color .15s}
.nav-item:hover{background:var(--side-hover);color:var(--side-fg)}
.nav-item.active{background:var(--side-active);color:#fff;font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#E8C982,#B38A3A)}
.nav-item.active .svg{color:#E8C982}
.nav-item .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--side-fg-3);font-variant-numeric:tabular-nums}
.nav-item .cnt.alert{color:#fff;background:#C5372C;border-radius:20px;padding:0 7px;font-weight:600;line-height:18px}
.nav-item.active .cnt{color:#E8C982}
.nav-item .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.nav-item .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nav-item.sub{padding-left:30px;font-size:13px}
.nav-item.drop-hot{background:rgba(214,177,99,.2);box-shadow:inset 0 0 0 1.5px #D6B163}
.nav-item .av{border-color:transparent}
.nav-caret{width:16px;height:16px;display:grid;place-items:center;color:var(--side-fg-3);margin-left:-4px;transition:transform .2s var(--ease)}
.nav-caret.open{transform:rotate(90deg)}
.side-foot{border-top:1px solid var(--side-line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px}
.sync-pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--side-fg-2);min-width:0}
.sync-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-pill i{width:7px;height:7px;border-radius:50%;background:var(--side-fg-3);flex:none}
.sync-pill.ok i{background:#4CC38A;box-shadow:0 0 0 3px rgba(76,195,138,.18)}
.sync-pill.busy i{background:#E9B565;animation:pulse 1s infinite}
.sync-pill.local i{background:#E9B565}
.sync-pill.err i{background:#F08A7E}
.ver{margin-left:auto;font-family:var(--f-mono);font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid rgba(214,177,99,.35);color:#E8C982;background:rgba(214,177,99,.08);transition:all .2s}
.ver:hover{background:rgba(214,177,99,.18);border-color:#D6B163}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;background-image:radial-gradient(900px 380px at 100% -8%,var(--glow),transparent 70%)}
.topbar{display:flex;align-items:center;gap:12px;padding:14px max(24px,env(safe-area-inset-right,0px)) 12px 28px;min-height:68px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid transparent}
.topbar .menu-btn{display:none}
.vt{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.vt h1{font-family:var(--f-display);font-weight:600;font-size:30px;letter-spacing:-.02em;line-height:1.1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-variation-settings:"opsz" 72}
.vt .vt-sub{font-size:12px;color:var(--fg-3);white-space:nowrap;font-family:var(--f-mono);padding:2px 8px;border:1px solid var(--line);border-radius:20px}
.vt .vt-dot{width:12px;height:12px;border-radius:4px;flex:none}
.tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;color:var(--fg-2);border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn.bordered{border-color:var(--line);background:var(--surface)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.seg{display:inline-flex;background:var(--sunken);border-radius:11px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--fg-2);white-space:nowrap;transition:all .18s var(--ease)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.seg button[disabled]{opacity:.5;cursor:not-allowed}
/* day / night switch */
.theme-seg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:3px;isolation:isolate}
.theme-seg::before{content:'';position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--surface);box-shadow:var(--shadow-1);transition:transform .38s var(--ease),background .3s;z-index:-1}
.theme-seg.dark::before{transform:translateX(100%);background:linear-gradient(135deg,#1C2A47,#0F1A30)}
.theme-seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--fg-3);transition:color .3s}
.theme-seg:not(.dark) .t-day{color:#B07A12}
.theme-seg.dark .t-night{color:#E8C982}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap;transition:transform .12s,box-shadow .2s,border-color .2s,background .2s}
.btn:hover{border-color:var(--fg-3);box-shadow:var(--shadow-1)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent-grad);border-color:transparent;color:var(--accent-fg);box-shadow:0 6px 16px -8px var(--accent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{filter:brightness(1.07);box-shadow:0 10px 22px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}.btn.ghost:hover{background:var(--hover);color:var(--fg);box-shadow:none}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.lg{height:42px;padding:0 18px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.new-btn{height:38px;padding:0 16px 0 12px;border-radius:12px}
.new-btn .svg{stroke-width:2.2}

/* filter bar */
.fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px max(24px,env(safe-area-inset-right,0px)) 12px 28px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;max-width:260px;border:1px solid var(--accent-line);animation:popin .2s var(--ease)}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.fchip button:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.fbar .sep{flex:1}
.ctl{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;font-size:12px;font-weight:500;color:var(--fg-2);border:1px solid var(--line);background:var(--surface);transition:all .15s}
.ctl:hover{color:var(--fg);border-color:var(--line-strong);box-shadow:var(--shadow-1)}
.ctl.on{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.ctl b{font-weight:700;color:var(--fg)}
.ctl.on b{color:var(--accent)}

.content{flex:1;overflow:auto;min-height:0;padding:6px max(24px,env(safe-area-inset-right,0px)) 48px 28px;scrollbar-width:thin}
.content > *{animation:fadeUp .35s var(--ease) both}

/* ---------- tasks list ---------- */
.group{margin-bottom:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-1);overflow:hidden}
.group.bare{background:transparent;border:0;box-shadow:none;overflow:visible}
.group-h{display:flex;align-items:center;gap:10px;padding:11px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.group-h h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.group-h .gcount{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);background:var(--sunken);border-radius:20px;padding:0 8px;line-height:20px}
.group-h .gdot{width:9px;height:9px;border-radius:50%}
.group-h.overdue{background:var(--danger-soft)}
.group-h.overdue h3{color:var(--danger)}
.group-h.drop-hot{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.trow{display:grid;grid-template-columns:18px 24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 14px 10px 8px;border-bottom:1px solid var(--line);position:relative;cursor:default;background:var(--surface);transition:background .15s}
.group > .trow:last-child{border-bottom:0}
.trow:hover{background:var(--hover)}
.trow.sel{background:var(--accent-soft)}
.trow.open{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.trow.closed .ttl{color:var(--fg-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.trow.drag-src{opacity:.35}
.grip{width:18px;height:22px;display:grid;place-items:center;color:var(--fg-3);opacity:0;cursor:grab;touch-action:none;transition:opacity .15s}
.trow:hover .grip,.card:hover .grip{opacity:1}
@media (hover:none){.grip{opacity:.55}}
.chk{width:21px;height:21px;border-radius:50%;border:1.8px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:all .15s var(--ease);flex:none;background:var(--surface)}
.chk:hover{border-color:var(--ok);color:var(--ok);transform:scale(1.06)}
.chk.p1{border-color:var(--danger);background:var(--danger-soft)}
.chk.p2{border-color:var(--warn);background:var(--warn-soft)}
.chk.p3{border-color:var(--info);background:var(--info-soft)}
.chk.done{background:var(--ok);border-color:var(--ok);color:#fff;animation:checkpop .3s var(--ease)}
.chk.cancel{background:var(--sunken);border-color:var(--line-strong);color:var(--fg-3)}
.chk.square{border-radius:6px}
.tmain{min-width:0;cursor:pointer}
.tline{display:flex;align-items:center;gap:8px;min-width:0}
.sig{font-family:var(--f-mono);font-size:10.5px;color:var(--fg-3);flex:none;letter-spacing:.02em}
.ttl{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tmeta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:11.5px;color:var(--fg-3)}
.tmeta .m{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tmeta .m.late{color:var(--danger);font-weight:700}
.tmeta .m.today{color:var(--ok);font-weight:700}
.tmeta .m.soon{color:var(--warn);font-weight:600}
.tright{display:flex;align-items:center;gap:8px}
.ms-ico{color:var(--gold)}
.hard{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:5px;padding:0 5px;line-height:17px}
.drop-line{position:absolute;left:0;right:0;height:2px;background:var(--accent);border-radius:2px;pointer-events:none;z-index:5}
.drop-line::before{content:'';position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.subtoggle{width:20px;height:20px;display:grid;place-items:center;border-radius:5px;color:var(--fg-3)}
.subtoggle:hover{background:var(--sunken);color:var(--fg)}
.trow.child{padding-left:36px;background:var(--surface-2)}
.trow.child.d2{padding-left:64px}
.row-more{opacity:0}.trow:hover .row-more,.trow.open .row-more{opacity:1}
@media (hover:none){.row-more{opacity:1}}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;max-width:100%}
.pill .d{width:7px;height:7px;border-radius:50%;flex:none}
.pill.soft{background:var(--sunken);color:var(--fg-2);border-color:var(--line)}
.pill.btnlike{cursor:pointer;transition:border-color .15s,background .15s}.pill.btnlike:hover{border-color:var(--line-strong);background:var(--hover)}
.tag{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:600;white-space:nowrap}
.tag::before{content:'#';opacity:.6}
.avs{display:inline-flex;align-items:center}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;letter-spacing:.02em;border:2px solid var(--surface);margin-left:-7px;flex:none;text-transform:uppercase;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.av:first-child{margin-left:0}
.av.lg{width:38px;height:38px;font-size:13px;border-width:0;margin:0}
.av.md{width:26px;height:26px;font-size:10px;border-width:0;margin:0}
.av.more{background:var(--sunken);color:var(--fg-2)}

/* empty states */
.empty{max-width:460px;margin:56px auto;text-align:center;color:var(--fg-2)}
.empty h3{font-family:var(--f-display);font-weight:600;font-size:24px;color:var(--fg);margin:14px 0 6px;letter-spacing:-.01em}
.empty p{margin:0 0 18px;font-size:13.5px}
.empty .ill{width:68px;height:68px;margin:0 auto;border-radius:22px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}

/* ---------- board ---------- */
.board{display:flex;gap:14px;align-items:flex-start;min-height:100%;padding-bottom:20px;padding-right:24px}
.col{flex:0 0 296px;background:var(--sunken);border-radius:var(--r-l);display:flex;flex-direction:column;max-height:100%;border:1px solid var(--line);transition:background .15s,border-color .15s}
.col.drop-hot{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:13px 13px 9px;font-size:13px;font-weight:700}
.col-h .cnt{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);font-weight:500;background:var(--surface);border-radius:20px;padding:0 7px;line-height:19px}
.col-h .add{margin-left:auto;color:var(--fg-3);border-radius:6px;padding:3px}.col-h .add:hover{color:var(--fg);background:var(--surface)}
.col-body{display:flex;flex-direction:column;gap:9px;padding:2px 9px 11px;overflow-y:auto;min-height:60px}
.card{background:var(--surface);border-radius:var(--r-m);padding:11px 12px;box-shadow:var(--shadow-1);border:1px solid var(--line);cursor:pointer;position:relative;display:flex;flex-direction:column;gap:8px;transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
.card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.card.open{border-color:var(--accent);box-shadow:var(--ring)}
.card .ttl{white-space:normal;font-weight:600;font-size:13.5px;line-height:1.38}
.card .crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-3)}
.card .pri-bar{position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0}
.card .grip{position:absolute;right:6px;top:8px}
.prog{height:5px;border-radius:5px;background:var(--sunken);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 70%,#fff));border-radius:5px;transition:width .5s var(--ease)}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:8px;margin:2px 0 12px;flex-wrap:wrap}
.cal-head h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0 8px 0 4px;text-transform:capitalize;min-width:180px;letter-spacing:-.01em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-1)}
.cal-dow{font-size:10.5px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.1em;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal-dow:nth-child(7n){border-right:0}
.cal-day{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;transition:background .12s}
.cal-day:nth-child(7n){border-right:0}
.cal-day:hover{background:var(--hover)}
.cal-day.other{background:var(--surface-2)}
.cal-day.other .dn{color:var(--fg-3);opacity:.6}
.cal-day.wknd{background:color-mix(in srgb,var(--sunken) 50%,var(--surface))}
.cal-day.drop-hot{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent-line)}
.dn{font-family:var(--f-mono);font-size:12px;color:var(--fg-2);display:flex;align-items:center;justify-content:space-between}
.cal-day.today .dn b{background:var(--accent-grad);color:var(--accent-fg);border-radius:20px;padding:1px 8px;box-shadow:0 4px 10px -4px var(--accent)}
.dn b{font-weight:600}
.cev{font-size:11.5px;font-weight:500;padding:3px 7px;border-radius:6px;background:var(--sunken);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--fg-3);cursor:grab;touch-action:none;display:flex;gap:4px;align-items:center;transition:transform .12s}
.cev:hover{transform:translateX(1px)}
.cev.done{opacity:.55;text-decoration:line-through}
.cev.ms{background:var(--gold-soft);border-left-color:var(--gold)}
.cev.proj{background:transparent;border:1px dashed var(--line-strong);border-left:3px solid var(--fg-3);cursor:pointer;color:var(--fg-2)}
.cev .t{font-family:var(--f-mono);font-size:10px;color:var(--fg-3)}
.cal-more{font-size:11px;color:var(--fg-3);padding-left:4px;font-weight:600}
.agenda{margin-top:20px}
.agenda .panel-h h3{text-transform:capitalize}

/* ---------- matrix ---------- */
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;min-height:100%}
.quad{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);display:flex;flex-direction:column;min-height:260px;min-width:0;box-shadow:var(--shadow-1);overflow:hidden;transition:border-color .15s,background .15s}
.quad.drop-hot{border-color:var(--accent);background:var(--accent-soft)}
.quad-h{padding:13px 16px 10px;display:flex;align-items:baseline;gap:9px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.quad-h b{font-family:var(--f-display);font-size:18px;font-weight:600}
.quad-h span{font-size:11.5px;color:var(--fg-3)}
.quad-h .q{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:6px;color:#fff;font-weight:600}
.quad-body{padding:0;overflow:auto;flex:1}
.quad .trow{grid-template-columns:18px 24px minmax(0,1fr)}

/* ---------- overview ---------- */
.hero{position:relative;border-radius:var(--r-xl);background:var(--hero-grad);color:var(--hero-fg);padding:26px 28px 22px;margin:4px 0 24px;overflow:hidden;box-shadow:var(--shadow-2);isolation:isolate}
.hero::before{content:'';position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px)}
.hero::after{content:'';position:absolute;right:-60px;top:-80px;width:340px;height:340px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(214,177,99,.32),transparent 65%)}
.hero .scales{position:absolute;right:26px;top:18px;width:120px;height:120px;color:rgba(232,201,130,.22);stroke-width:1.1;z-index:-1}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hero .date{font-family:var(--f-mono);font-size:11.5px;color:#E8C982;text-transform:uppercase;letter-spacing:.14em}
.hero h2{font-family:var(--f-display);font-size:38px;font-weight:600;margin:6px 0 0;letter-spacing:-.02em;line-height:1.05;text-wrap:balance;color:#fff}
.hero .summary{font-size:13.5px;max-width:46ch;color:var(--hero-fg-2)}
.hero .summary b{color:#fff}
.hero .summary .late{color:#FFB4A8}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{padding:13px 15px;border-radius:14px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--hero-fg);transition:background .2s,transform .2s var(--ease),border-color .2s}
.kpi:hover{background:rgba(255,255,255,.13);transform:translateY(-2px);border-color:rgba(232,201,130,.45)}
.kpi .k{font-size:11.5px;color:var(--hero-fg-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:#fff}
.kpi.alert{background:rgba(197,55,44,.22);border-color:rgba(255,160,150,.35)}
.kpi.alert .v{color:#FFC2B8}
.kpi .s{font-size:11px;color:var(--hero-fg-2)}
.ov-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px 10px;min-width:0;box-shadow:var(--shadow-1)}
.panel+.panel{margin-top:22px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.panel-h h3{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.panel-h a,.panel-h button.link{font-size:12px;font-weight:600;color:var(--accent);cursor:pointer}
.panel .trow{background:transparent;padding-left:0;padding-right:0}
.panel .trow:hover{background:transparent}
.panel .trow:last-child{border-bottom:0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:0}
.prow:hover .pn span:not(.pill){color:var(--accent)}
.prow .pn{display:flex;align-items:center;gap:9px;min-width:0;font-weight:600}
.prow .pn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pct{font-family:var(--f-mono);font-size:11.5px;text-align:right;color:var(--fg-2)}
.wl{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 54px;gap:10px;align-items:center;padding:7px 0;cursor:pointer}
.wl .nm{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px;font-weight:600}
.wl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-bar{height:10px;border-radius:6px;background:var(--sunken);display:flex;overflow:hidden}
.wl-bar i{display:block;height:100%;transition:width .6s var(--ease)}
.wl .n{font-family:var(--f-mono);font-size:11.5px;text-align:right;color:var(--fg-2)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--fg-3);margin-top:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.msrow{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.msrow:last-child{border-bottom:0}
.msdate{text-align:center;border:1px solid var(--gold-line);border-radius:10px;padding:5px 0;background:var(--gold-soft)}
.msdate b{display:block;font-family:var(--f-display);font-size:20px;line-height:1;color:var(--fg)}
.msdate span{font-family:var(--f-mono);font-size:10px;color:var(--gold);text-transform:uppercase;font-weight:600}
.msrow .ml{min-width:0}
.msrow .ml div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- project header ---------- */
.phead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px;margin-bottom:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.phead::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--ph-color,var(--accent-grad))}
.phead .desc{color:var(--fg-2);font-size:13.5px;margin:6px 0 0;max-width:72ch;white-space:pre-wrap}
.phead .facts{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:12px;font-size:12.5px;color:var(--fg-2)}
.phead .facts span b{color:var(--fg-3);font-weight:600;margin-right:5px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ring{width:76px;height:76px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.ptabs button{padding:9px 13px;font-size:13px;font-weight:600;color:var(--fg-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .2s}
.ptabs button:hover{color:var(--fg)}
.ptabs button.on{color:var(--fg);border-color:var(--gold)}

/* ---------- timeline ---------- */
.tl-wrap{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:auto;position:relative;box-shadow:var(--shadow-1)}
.tl{position:relative}
.tl-scale{display:flex;position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--line);z-index:3}
.tl-scale .mo{flex:none;font-size:11px;font-weight:700;color:var(--fg-3);padding:8px;border-left:1px solid var(--line);text-transform:capitalize;white-space:nowrap;overflow:hidden}
.tl-row{display:flex;align-items:center;height:50px;border-bottom:1px solid var(--line);position:relative}
.tl-row:last-child{border-bottom:0}
.tl-label{position:sticky;left:0;z-index:2;background:var(--surface);width:230px;flex:none;height:100%;display:flex;align-items:center;gap:9px;padding:0 14px;border-right:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;min-width:0}
.tl-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-track{position:relative;height:100%;flex:none}
.tl-bar{position:absolute;top:13px;height:24px;border-radius:8px;display:flex;align-items:center;padding:0 9px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:6px;box-shadow:0 4px 12px -6px rgba(0,0,0,.4);transition:filter .15s}
.tl-bar:hover{filter:brightness(1.1)}
.tl-bar .fill{position:absolute;inset:0;background:rgba(255,255,255,.22);transform-origin:left}
.tl-ms{position:absolute;top:18px;width:14px;height:14px;transform:rotate(45deg);background:var(--gold);border:2px solid var(--surface);cursor:pointer;margin-left:-7px;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tl-ms.done{background:var(--ok)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);z-index:1;pointer-events:none;box-shadow:0 0 8px var(--gold)}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);pointer-events:none}

/* ---------- team ---------- */
.ttable{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow-1)}
.ttable th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.ttable td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.ttable tr:last-child td{border-bottom:0}
.ttable tr.clickable{cursor:pointer}.ttable tr.clickable:hover td{background:var(--hover)}
.ttable .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.tbl-scroll{overflow-x:auto;border-radius:var(--r-l)}
.pcell{display:flex;align-items:center;gap:11px;min-width:190px;font-weight:600}
.pcell small{display:block;color:var(--fg-3);font-size:11.5px;font-weight:500}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;position:relative;cursor:pointer;box-shadow:var(--shadow-1);transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
.pcard:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.pcard h4{margin:0 0 3px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
.pcard.drop-hot{border-color:var(--accent);box-shadow:var(--ring)}

/* ---------- detail drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.detail{position:fixed;top:12px;right:12px;bottom:12px;width:min(var(--detail-w),calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-3);z-index:45;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .32s var(--ease);overflow:hidden;margin-top:env(safe-area-inset-top,0px);margin-right:env(safe-area-inset-right,0px)}
.detail.on{transform:none}
.d-top{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.d-crumb{font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:6px;min-width:0;flex:1;overflow:hidden;font-weight:600}
.d-crumb button{color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.d-crumb button:hover{color:var(--accent)}
.d-body{flex:1;overflow-y:auto;padding:18px 22px 28px;scrollbar-width:thin}
.d-title{display:flex;gap:12px;align-items:flex-start}
.d-title .chk{margin-top:7px;width:23px;height:23px}
.d-title textarea{flex:1;border:0;background:transparent;resize:none;font-family:var(--f-display);font-size:25px;font-weight:600;line-height:1.25;outline:none;padding:2px 0;letter-spacing:-.015em;overflow:hidden;min-width:0;border-radius:6px}
.d-title textarea:focus{box-shadow:0 2px 0 var(--accent-line)}
.d-sig{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);margin:4px 0 16px 35px;letter-spacing:.03em}
.props{display:grid;grid-template-columns:128px minmax(0,1fr);gap:2px 10px;align-items:center;margin-bottom:16px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m)}
.props .pl{font-size:12.5px;color:var(--fg-3);display:flex;align-items:center;gap:8px;min-height:36px;font-weight:500}
.props .pv{min-height:36px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-width:0}
.pbtn{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:3px 9px;border-radius:8px;font-size:13px;font-weight:500;color:var(--fg);max-width:100%;text-align:left;transition:background .12s}
.pbtn:hover{background:var(--hover)}
.pbtn.dim{color:var(--fg-3)}
.pbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.changed{color:var(--gold)!important;font-weight:700!important}
.changed::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:2px;box-shadow:0 0 0 3px var(--gold-soft)}
.inp{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 11px;font-size:13px;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:var(--line-strong)}
.inp:focus{border-color:var(--accent-line);box-shadow:var(--ring)}
textarea.inp{height:auto;padding:9px 11px;line-height:1.5;resize:vertical}
select.inp{padding-right:6px}
.inp.sm{height:30px;font-size:12.5px;border-radius:8px}
.d-sec{margin-top:22px}
.d-sec-h{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);font-weight:700;margin-bottom:9px}
.d-sec-h .cnt{font-family:var(--f-mono);letter-spacing:0}
.notes{width:100%;min-height:120px;border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;background:var(--surface-2);resize:vertical;outline:none;line-height:1.6;font-size:13.5px;transition:border-color .15s,background .15s,box-shadow .15s}
.notes:focus{border-color:var(--accent-line);background:var(--surface);box-shadow:var(--ring)}
.subs .trow{background:transparent;padding:7px 0;grid-template-columns:18px 24px minmax(0,1fr) auto}
.addline{display:flex;align-items:center;gap:8px;padding:7px 0;color:var(--fg-3)}
.addline input{flex:1;border:0;background:transparent;outline:none;font-size:13.5px;height:30px;min-width:0;border-bottom:1px dashed var(--line-strong)}
.addline input:focus{border-bottom-color:var(--accent)}
.cmt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 0}
.cmt .who{font-size:12.5px;font-weight:700}
.cmt .who span{font-weight:400;color:var(--fg-3);font-family:var(--f-mono);font-size:10.5px;margin-left:6px}
.cmt .txt{font-size:13.5px;white-space:pre-wrap;word-break:break-word;margin-top:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 11px}
.cmt .del{font-size:11px;color:var(--fg-3);margin-top:4px}.cmt .del:hover{color:var(--danger)}
.cmt-box{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.cmt-box textarea{flex:1;min-height:44px}
.hist{font-size:12px;color:var(--fg-3);padding:3px 0;display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px}
.hist .mono{font-size:10.5px}
.asg{display:flex;flex-direction:column;gap:5px;width:100%}
.asg-row{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.asg-row .nm{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asg-row .nm small{color:var(--fg-3);margin-left:6px;font-weight:500}
.asg-row .ord{font-family:var(--f-mono);font-size:10.5px;color:var(--fg-3);width:14px;text-align:center}
.asg-row.drop-hot{border-color:var(--accent)}
.asg-row .grip{opacity:.6}
.x{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--fg-3);flex:none}
.x:hover{background:var(--danger-soft);color:var(--danger)}
.rem{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 0}
.rem.fired{color:var(--fg-3);text-decoration:line-through}
.links a{color:var(--accent);word-break:break-all;font-size:13px;font-weight:500}
.d-foot{display:flex;align-items:center;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--glass-strong);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.dirty{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--fg-3);margin-right:auto;min-width:0;flex:1 1 auto;overflow:hidden}
.dirty i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dirty.on{color:var(--gold)}
.dirty.on i{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);animation:pulse 1.6s infinite}
.dirty span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- popovers / modals ---------- */
.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-m);box-shadow:var(--shadow-2);min-width:230px;max-width:min(360px,calc(100vw - 24px));max-height:min(440px,70vh);overflow:auto;padding:6px;animation:popin .14s var(--ease)}
.pop .pi{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;text-align:left;color:var(--fg)}
.pop .pi:hover,.pop .pi.kb{background:var(--hover)}
.pop .pi.on{color:var(--accent);font-weight:700}
.pop .pi .r{margin-left:auto;color:var(--fg-3);font-size:11.5px;font-family:var(--f-mono);font-weight:400}
.pop .pi.danger{color:var(--danger)}
.pop .ph{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);font-weight:700;padding:9px 10px 4px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pop .psearch{width:100%;margin-bottom:4px}
.pop .tick{width:17px;height:17px;border:1.5px solid var(--line-strong);border-radius:5px;display:grid;place-items:center;flex:none;color:transparent;transition:all .12s}
.pop .pi.on .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.modal-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .18s}
.modal{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-3);width:min(580px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;border:1px solid var(--line);animation:popin .2s var(--ease);overflow:hidden}
.modal.wide{width:min(860px,100%)}
.modal.xwide{width:min(980px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}
.modal-h h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:600;flex:1;letter-spacing:-.015em}
.modal-b{padding:4px 20px 18px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:13px 20px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--surface-2)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fg-2);font-weight:600;min-width:0}
.form .inp{width:100%}
.form [hidden]{display:none!important}
.flabel{font-size:12px;color:var(--fg-2);font-weight:600;margin-bottom:6px}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1 1 0;justify-content:center;white-space:normal;text-align:center;min-height:36px}
.seg.wide button .lbl{display:inline!important}
.name-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.name-hint{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:-4px}
.name-hint b{color:var(--fg);font-weight:650}
.form .fsec{border-top:1px solid var(--line);padding-top:14px;margin:6px 0 -6px;font-size:12.5px;color:var(--fg);letter-spacing:.01em}
.name-hint .link{font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:0;padding:2px 0}
.name-hint .link:hover{text-decoration:underline}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);transition:transform .12s}
.sw:hover{transform:scale(1.1)}
.sw.on{box-shadow:0 0 0 2px var(--fg)}
.cbx{display:flex!important;flex-direction:row!important;align-items:center;gap:8px!important;font-size:13px!important;color:var(--fg)!important;cursor:pointer}
.cbx input{width:17px;height:17px;accent-color:var(--accent)}

/* task form (new task window) */
.tf{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.tf-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.tf-title{width:100%;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface-2);font-family:var(--f-display);font-size:21px;font-weight:600;padding:12px 14px;outline:none;letter-spacing:-.01em;transition:border-color .15s,box-shadow .15s,background .15s}
.tf-title:focus{border-color:var(--accent-line);box-shadow:var(--ring);background:var(--surface)}
.tf-title::placeholder{color:var(--fg-3);font-weight:500}
.tf-hint{font-size:11.5px;color:var(--fg-3);margin-top:-6px}
.tf-hint code{font-family:var(--f-mono);background:var(--sunken);padding:0 4px;border-radius:4px;color:var(--fg-2)}
.tf-parsed{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.tf-parsed:empty{display:none}
.tf-parsed .pill{background:var(--gold-soft);border-color:var(--gold-line);color:var(--fg)}
.tf-lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);font-weight:700;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.tf-side{display:grid;grid-template-columns:104px minmax(0,1fr);gap:9px 10px;align-items:center;align-content:start;padding:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-l);min-width:0}
.tf-side .pl{font-size:12px;color:var(--fg-3);font-weight:600;display:flex;align-items:center;gap:7px}
.tf-side .pv{min-width:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tf-side .pv .inp{flex:1;min-width:0;width:100%}
.tf-side .pv .inp.time{flex:0 0 96px}
.tf-side .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:3px 0}
.chipbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:36px;width:100%;padding:4px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface)}
.chipbox .pill{background:var(--sunken)}
.chipbox .pill button{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;margin-right:-4px}
.chipbox .pill button:hover{background:var(--danger-soft);color:var(--danger)}
.chipbox .add-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:20px;font-size:12px;font-weight:600;color:var(--accent)}
.chipbox .add-chip:hover{background:var(--accent-soft)}
.tf-subs .sub-li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px;margin-bottom:5px}
.tf-subs .sub-li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* palette */
.cmdk{width:min(640px,100%);align-self:start;margin-top:10vh}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);outline:none;background:transparent;font-size:16px;padding:18px 20px}
.cmdk .res{max-height:52vh;overflow:auto;padding:6px}

/* logbook */
.lb-entry{border-left:2px solid var(--gold-line);padding:0 0 20px 20px;position:relative}
.lb-entry::before{content:'';position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.lb-entry h3{margin:0;font-family:var(--f-display);font-size:21px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lb-entry h3 .mono{font-size:12px;color:var(--fg-3);font-weight:400}
.lb-entry p{margin:4px 0 8px;color:var(--fg-2);font-size:13.5px}
.lb-entry h4{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin:12px 0 4px}
.lb-entry ul{margin:0;padding-left:18px;font-size:13px;line-height:1.65}
.pager{display:flex;align-items:center;gap:6px;justify-content:center}
.pager button{min-width:32px;height:32px;border-radius:8px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--surface)}
.pager button.on{background:var(--accent-grad);color:var(--accent-fg);border-color:transparent}
.pager button[disabled]{opacity:.4}

/* settings */
.set-grid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px;align-items:start}
.set-nav{position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.set-nav .nav-item{color:var(--fg-2)}
.set-nav .nav-item:hover{background:var(--hover);color:var(--fg)}
.set-nav .nav-item.active{background:var(--accent-soft);color:var(--accent)}
.set-nav .nav-item.active::before{left:0;background:var(--accent)}
.set-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow-1)}
.set-sec h3{margin:0 0 4px;font-family:var(--f-display);font-size:20px;font-weight:600}
.set-sec > p{margin:0 0 14px;color:var(--fg-2);font-size:13px;max-width:72ch}
.theme-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:640px}
.theme-card{border:1.5px solid var(--line);border-radius:var(--r-m);padding:8px;text-align:left;background:var(--surface);transition:border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.theme-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.theme-card.on{border-color:var(--accent);box-shadow:var(--ring)}
.theme-card .prev{height:74px;border-radius:9px;display:grid;grid-template-columns:28% 1fr;overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}
.theme-card .prev i{display:block}
.theme-card b{font-size:13px;display:flex;align-items:center;gap:6px}
.erow{display:grid;grid-template-columns:18px 28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow.drop-hot{background:var(--accent-soft)}
.erow input.inp{width:100%}
.colorbtn{width:24px;height:24px;border-radius:7px;border:1px solid var(--line-strong)}
.report{border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;font-size:13px;background:var(--surface-2);margin-top:10px}
.report .okk{color:var(--ok);font-weight:700}.report .bad{color:var(--danger);font-weight:700}.report .wrn{color:var(--warn);font-weight:700}
.report ul{margin:6px 0 0;padding-left:18px}
.report table{border-collapse:collapse;margin-top:6px;font-size:12.5px}
.report td{padding:2px 14px 2px 0}
.progress{height:6px;background:var(--sunken);border-radius:4px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent-grad);background-size:200% 100%;animation:sheen 1.4s linear infinite;transition:width .2s}
.fpick{border:1px solid var(--line)}
.fpick.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.link{color:var(--accent);font-size:12px;font-weight:600}

/* toasts */
.toasts{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:#0E1A2F;color:#EEF2FA;border:1px solid rgba(255,255,255,.08);border-radius:var(--r-m);padding:11px 13px 11px 15px;font-size:13px;font-weight:500;box-shadow:var(--shadow-3);display:flex;align-items:center;gap:12px;max-width:min(440px,calc(100vw - 32px));animation:popin .22s var(--ease)}
.toast button{color:#E8C982;font-weight:700;font-size:12.5px;white-space:nowrap}
.toast.rem{background:var(--surface);color:var(--fg);border:1px solid var(--gold-line);flex-direction:column;align-items:stretch;gap:8px}
.toast.rem .rh{display:flex;gap:8px;align-items:center;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:800}
.toast.rem .rt{font-weight:700;font-size:14px}
.toast.rem .ra{display:flex;gap:6px;flex-wrap:wrap}
.toast.rem .ra button{color:var(--fg)}
.toast.rem .ra .btn.primary{color:var(--accent-fg)}

/* drag ghost */
.drag-ghost{position:fixed;z-index:100;pointer-events:none;background:var(--surface);border:1px solid var(--accent);color:var(--fg);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;box-shadow:var(--shadow-3);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:rotate(-1.5deg)}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}

/* bulk bar */
.bulk{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0E1A2F;color:#EEF2FA;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:6px;display:flex;align-items:center;gap:2px;box-shadow:var(--shadow-3);z-index:30;max-width:calc(100% - 24px);overflow-x:auto;animation:popin .2s var(--ease)}
.bulk .n{padding:0 10px;font-size:12.5px;font-weight:700;white-space:nowrap;color:#E8C982}
.bulk button{padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#EEF2FA}
.bulk button:hover{background:rgba(255,255,255,.1)}

/* welcome / loading */
.boot{position:fixed;inset:0;z-index:80;background:var(--hero-grad);color:var(--hero-fg);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto;isolation:isolate}
.boot::before{content:'';position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 1px,transparent 1px 24px),radial-gradient(600px 400px at 85% 10%,rgba(214,177,99,.25),transparent 70%)}
.boot-card{max-width:540px;width:100%;text-align:left}
.boot-card .seal{width:56px;height:56px;font-size:30px;margin-bottom:18px;border-radius:16px}
.boot-card h1{font-family:var(--f-display);font-size:46px;font-weight:600;letter-spacing:-.025em;margin:0 0 10px;line-height:1.02;color:#fff}
.boot-card p{color:var(--hero-fg-2);font-size:15px;margin:0 0 14px;max-width:60ch}
.boot-card ul{color:var(--hero-fg-2);font-size:13.5px;padding-left:18px;margin:0 0 22px;line-height:1.8}
.boot-card ul li::marker{color:#E8C982}
.boot-actions{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.boot-actions .btn.primary{background:linear-gradient(135deg,#E8C982,#B38A3A);color:#14100A}
.boot-actions .btn:not(.primary){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.boot-actions .muted{color:var(--hero-fg-2)}
.spinner{width:24px;height:24px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#E8C982;border-radius:50%;animation:spin .8s linear infinite}


/* ===== v1.2 ===== */
.brand{position:relative}
.brand-txt{min-width:0;flex:1}
.side-toggle{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--side-fg-3);transition:background .15s,color .15s;flex:none}
.side-toggle:hover{background:var(--side-hover);color:var(--side-fg)}
@media (min-width:901px){
  body.side-mini{--side-w:76px}
  body.side-mini .brand{flex-direction:column;padding:16px 8px 8px;gap:10px}
  body.side-mini .brand-txt,body.side-mini .nav-sec-h,body.side-mini .nav-item .lbl,body.side-mini .nav-item .cnt:not(.alert),body.side-mini .nav-item.sub,body.side-mini .nav-caret,body.side-mini .sync-pill span,body.side-mini .side-search kbd,body.side-mini .side-search .lbl{display:none}
  body.side-mini .side-search{width:44px;margin:4px auto 8px;justify-content:center;padding:9px 0}
  body.side-mini .nav-item{justify-content:center;padding:9px 0}
  body.side-mini .nav-item .cnt.alert{position:absolute;top:2px;right:6px;font-size:9px;padding:0 5px;line-height:15px}
  body.side-mini .nav-sec{margin-top:8px;padding-top:8px;border-top:1px solid var(--side-line)}
  body.side-mini .side-foot{flex-direction:column;gap:10px}
  body.side-mini .ver{margin-left:0}
}
/* dense lists */
body.dense .trow{padding-top:6px;padding-bottom:6px}
body.dense .tmeta{margin-top:1px}
body.dense .ttl{font-size:13.5px}
body.dense .ttable td{padding-top:7px;padding-bottom:7px}
body.dense .card{padding:9px 10px;gap:6px}
/* tinted status */
.pill.tint{background:color-mix(in srgb,var(--sc) 13%,var(--surface));color:color-mix(in srgb,var(--sc) 75%,var(--fg));border-color:color-mix(in srgb,var(--sc) 28%,transparent)}
.pill.tint .d{background:var(--sc)}
.tmeta .m.client{color:var(--fg-2);font-weight:600}
.tmeta .m.running{color:var(--ok);font-weight:700}
/* timer pill */
.timer-pill{display:inline-flex;align-items:stretch;border-radius:999px;border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--surface));overflow:hidden;box-shadow:var(--shadow-1)}
.timer-pill .tp-main{display:inline-flex;align-items:center;gap:7px;padding:0 10px 0 11px;height:34px;font-size:12px;font-weight:700;color:var(--ok)}
.timer-pill .tp-main i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.2s infinite}
.timer-pill .tp-n{color:var(--fg-2);font-family:var(--f-mono);font-size:11px;font-weight:500}
.timer-pill .tp-stop{width:34px;display:grid;place-items:center;color:var(--danger);border-left:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.timer-pill .tp-stop:hover{background:var(--danger-soft)}
/* overview strip */
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;margin:-8px 0 24px}
.sday{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);transition:transform .15s var(--ease),border-color .15s;min-width:0}
.sday:hover{transform:translateY(-2px);border-color:var(--accent-line)}
.sday.off{background:var(--surface-2)}
.sday.off .sd-n{color:var(--fg-3)}
.sday.today{border-color:var(--accent);box-shadow:var(--ring)}
.sd-dow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3)}
.sd-n{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1}
.sd-bar{width:8px;height:34px;border-radius:5px;background:var(--sunken);display:flex;align-items:flex-end;overflow:hidden}
.sd-bar i{display:block;width:100%;background:var(--accent-grad);border-radius:5px;min-height:0}
.sd-c{font-family:var(--f-mono);font-size:11px;color:var(--fg-2);display:flex;gap:3px;align-items:center}
.sd-c b{background:var(--gold);color:#fff;border-radius:10px;padding:0 4px;font-size:9.5px;line-height:14px}
/* calendar holidays */
.cal-day.hol{background:color-mix(in srgb,var(--danger) 5%,var(--surface))}
.cal-day.hol .dn b{color:var(--danger)}
.hol-name{font-family:var(--f-body);font-size:9.5px;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 4px;flex:1;min-width:0}
/* toolbar, clients */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.toolbar .inp{height:34px}
.search-field{position:relative;flex:1 1 260px;max-width:420px;display:flex;align-items:center}
.search-field .svg{position:absolute;left:11px;color:var(--fg-3);pointer-events:none}
.search-field .inp{width:100%;padding-left:32px}
.cl-badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.svc{display:flex;flex-wrap:wrap;gap:4px;min-width:140px}
.svc span{font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--sunken);color:var(--fg-2);white-space:nowrap}
.cstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;min-width:220px}
.cstats div{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface-2);display:flex;flex-direction:column}
.cstats b{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.1}
.cstats span{font-size:11px;color:var(--fg-3);font-weight:600}
.cstats .bad b{color:var(--danger)}
.hint-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-l);border:1px dashed var(--gold-line);background:var(--gold-soft);margin:-4px 0 16px;color:var(--fg)}
.hint-card > .svg{color:var(--gold);flex:none}
.hint-card div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hint-card span{font-size:12.5px;color:var(--fg-2)}
.duty-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.duty{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.duty:hover{border-color:var(--accent-line)}
.duty:has(input:checked){background:var(--accent-soft);border-color:var(--accent-line)}
.duty.on{opacity:.65;cursor:default}
.duty input{width:17px;height:17px;accent-color:var(--accent)}
.duty .dt{font-size:13px;font-weight:600}
.duty .dd{font-size:11px;color:var(--fg-3);white-space:nowrap}
.tf-tpl{display:flex;align-items:center;gap:8px;color:var(--fg-3)}
.tf-tpl .inp{flex:1}
/* detail tabs & time */
.d-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.d-tabs button{padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--fg-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.d-tabs button:hover{color:var(--fg)}
.d-tabs button.on{color:var(--fg);border-color:var(--gold)}
.d-tabs .cnt{font-family:var(--f-mono);font-size:10.5px;font-weight:500;background:var(--sunken);border-radius:10px;padding:0 6px;line-height:17px;color:var(--fg-2)}
.timebox{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;background:var(--surface-2)}
.tb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tb-top .k{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.tb-top b{font-family:var(--f-display);font-size:26px;font-weight:600}
.tb-run{display:flex;align-items:center;gap:10px}
.tb-run i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1.2s infinite}
.tb-run .mono{font-size:18px;font-weight:600;color:var(--ok)}
.time-add{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.te-row{display:grid;grid-template-columns:86px 120px minmax(0,1fr) auto 24px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.te-row .mono{font-size:11.5px;color:var(--fg-2)}
.te-row .te-who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.te-row .te-note{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* reports */
.rep-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.rep-head h2{margin:0;font-family:var(--f-display);font-size:26px;font-weight:600;text-transform:capitalize;letter-spacing:-.01em}
.stat-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11.5px;font-weight:700;color:var(--fg-3)}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .s{font-size:11.5px;color:var(--fg-3)}
.stat.bad .v{color:var(--danger)}
.tbar{flex:1;height:8px;border-radius:5px;background:var(--sunken);overflow:hidden;min-width:60px}
.tbar i{display:block;height:100%;background:var(--accent-grad);border-radius:5px}
.crow-rep{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 78px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.crow-rep:last-child{border-bottom:0}
.crow-rep .nm{min-width:0;display:flex;flex-direction:column}
.crow-rep .nm span{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-rep .nm small{font-size:11px;color:var(--fg-3)}
.ttable.flat{box-shadow:none;border:0;border-radius:0}
.ttable.flat th{background:transparent;padding:9px 8px 9px 0}
.ttable.flat td{padding:9px 8px 9px 0}
.ttable.flat .num{padding-right:10px}
body:has(.modal-wrap) .toasts{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}
.crow-rep .mono{white-space:nowrap}
.prow.cl{grid-template-columns:minmax(0,1fr) auto 76px}
.prow .soon{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);text-align:right;white-space:nowrap}
/* table view */
.tasks-table td{vertical-align:middle}
.tasks-table .t-title{min-width:240px}
.tasks-table .t-title .ttl{white-space:normal;font-weight:600}
.tasks-table .sig{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.tasks-table tr.open td{background:var(--accent-soft)}
.tasks-table tr.closed .ttl{text-decoration:line-through;color:var(--fg-3)}
.tasks-table .due.late{color:var(--danger);font-weight:700}
.tasks-table .due.today{color:var(--ok);font-weight:700}
.tasks-table tfoot td{background:var(--surface-2);font-size:12px;font-weight:600}
.th-sort{display:inline-flex;align-items:center;gap:4px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.th-sort:hover,.th-sort.on{color:var(--fg)}
.cell-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-chip i{width:8px;height:8px;border-radius:3px;flex:none}
.pri-txt{font-family:var(--f-mono);font-size:11.5px;font-weight:700;color:var(--pc)}
@media (max-width:1180px){.stat-row{grid-template-columns:repeat(3,minmax(0,1fr))}.strip{grid-template-columns:repeat(7,minmax(0,1fr))}.strip .sday:nth-child(n+8){display:none}}
@media (max-width:900px){.stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}.cstats{min-width:0}.te-row{grid-template-columns:76px minmax(0,1fr) auto 24px}.te-row .te-note{display:none}.hint-card{flex-wrap:wrap}.side-toggle{display:none}.timer-pill .tp-n{display:none}.crow-rep{grid-template-columns:minmax(0,1fr) 70px 54px}}

/* ===== v1.3 — depth & motion ===== */
:root{
  --e1:0 1px 1px rgba(14,26,47,.04),0 2px 4px rgba(14,26,47,.05),0 8px 18px -10px rgba(14,26,47,.18);
  --e2:0 2px 4px rgba(14,26,47,.05),0 10px 24px -8px rgba(14,26,47,.22),0 28px 56px -28px rgba(14,26,47,.28);
  --e3:0 6px 14px rgba(14,26,47,.10),0 30px 70px -20px rgba(14,26,47,.42);
  --hi:inset 0 1px 0 rgba(255,255,255,.85);
  --hi-soft:inset 0 1px 0 rgba(255,255,255,.55);
  --card-grad:linear-gradient(180deg,#FFFFFF 0%,#F9FAFD 100%);
  --sunk:inset 0 1px 2px rgba(14,26,47,.08),inset 0 0 0 1px rgba(14,26,47,.03);
  --btn-grad:linear-gradient(180deg,#FFFFFF,#F3F5F9);
  --bg-depth:radial-gradient(1200px 600px at 85% -10%,rgba(29,58,110,.08),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(169,128,47,.07),transparent 60%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fg-2:#B9C4DA; --fg-3:#7D8AA6; --line:#243149; --line-strong:#344463; --surface-2:#162238;
  --e1:0 1px 1px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.35),0 10px 20px -12px rgba(0,0,0,.6);
  --e2:0 2px 6px rgba(0,0,0,.4),0 14px 30px -10px rgba(0,0,0,.65),0 30px 60px -30px rgba(0,0,0,.7);
  --e3:0 8px 18px rgba(0,0,0,.45),0 34px 80px -24px rgba(0,0,0,.85);
  --hi:inset 0 1px 0 rgba(255,255,255,.07); --hi-soft:inset 0 1px 0 rgba(255,255,255,.05);
  --card-grad:linear-gradient(180deg,#152035 0%,#111A2C 100%);
  --sunk:inset 0 1px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.03);
  --btn-grad:linear-gradient(180deg,#1A2740,#131E33);
  --bg-depth:radial-gradient(1200px 600px at 85% -10%,rgba(214,177,99,.09),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(60,100,180,.12),transparent 60%);
}}
:root[data-theme="dark"]{
  --fg-2:#B9C4DA; --fg-3:#7D8AA6; --line:#243149; --line-strong:#344463; --surface-2:#162238;
  --e1:0 1px 1px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.35),0 10px 20px -12px rgba(0,0,0,.6);
  --e2:0 2px 6px rgba(0,0,0,.4),0 14px 30px -10px rgba(0,0,0,.65),0 30px 60px -30px rgba(0,0,0,.7);
  --e3:0 8px 18px rgba(0,0,0,.45),0 34px 80px -24px rgba(0,0,0,.85);
  --hi:inset 0 1px 0 rgba(255,255,255,.07); --hi-soft:inset 0 1px 0 rgba(255,255,255,.05);
  --card-grad:linear-gradient(180deg,#152035 0%,#111A2C 100%);
  --sunk:inset 0 1px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.03);
  --btn-grad:linear-gradient(180deg,#1A2740,#131E33);
  --bg-depth:radial-gradient(1200px 600px at 85% -10%,rgba(214,177,99,.09),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(60,100,180,.12),transparent 60%);
}
.main{background-image:var(--bg-depth)}
/* surfaces */
.group,.panel,.set-sec,.quad,.pcard,.stat,.tl-wrap,.cal,.ttable,.phead,.timebox,.sday{background:var(--card-grad);box-shadow:var(--e1),var(--hi-soft)}
.panel,.set-sec,.phead,.stat{border-color:color-mix(in srgb,var(--line) 80%,transparent)}
.card{background:var(--card-grad);box-shadow:var(--e1),var(--hi-soft)}
.card:hover{box-shadow:var(--e2),var(--hi-soft);transform:translateY(-3px)}
.pcard:hover,.sday:hover{box-shadow:var(--e2),var(--hi-soft)}
.col{box-shadow:var(--sunk);background:color-mix(in srgb,var(--sunken) 85%,var(--surface))}
.inp,.notes,.tf-title,.chipbox{box-shadow:var(--sunk)}
.inp:focus,.notes:focus,.tf-title:focus{box-shadow:var(--sunk),var(--ring)}
/* buttons */
.btn{background:var(--btn-grad);box-shadow:var(--e1),var(--hi)}
.btn:hover{box-shadow:var(--e2),var(--hi);transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:var(--sunk)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.primary{background:var(--accent-grad);box-shadow:0 8px 20px -8px var(--accent),0 2px 4px rgba(14,26,47,.12),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.12)}
.btn.primary:hover{box-shadow:0 14px 28px -10px var(--accent),0 3px 6px rgba(14,26,47,.14),inset 0 1px 0 rgba(255,255,255,.3)}
.seg,.theme-seg{box-shadow:var(--sunk)}
.seg button.on,.theme-seg::before{box-shadow:var(--e1),var(--hi)}
.icon-btn.bordered,.ctl{background:var(--btn-grad);box-shadow:var(--e1),var(--hi-soft)}
.chk{box-shadow:var(--sunk),var(--hi-soft)}
.chk.done{box-shadow:0 4px 10px -4px var(--ok),inset 0 1px 0 rgba(255,255,255,.35)}
.fab{box-shadow:0 18px 36px -12px var(--accent),0 4px 10px rgba(14,26,47,.2),inset 0 1px 0 rgba(255,255,255,.3)}
/* sidebar */
.sidebar{box-shadow:inset -1px 0 0 rgba(255,255,255,.06),8px 0 30px -18px rgba(0,0,0,.5)}
.nav-item.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 14px -8px rgba(0,0,0,.6)}
.seal{box-shadow:0 10px 24px -8px rgba(214,177,99,.75),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.18);position:relative;overflow:hidden}
.seal::after{content:'';position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-80%);animation:glint 6s ease-in-out infinite}
@keyframes glint{0%,70%{transform:translateX(-80%)}85%,100%{transform:translateX(80%)}}
/* hero aurora */
.hero{box-shadow:var(--e3),inset 0 1px 0 rgba(255,255,255,.12)}
.hero::after{animation:aurora 14s ease-in-out infinite alternate;filter:blur(6px)}
@keyframes aurora{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-120px,40px) scale(1.25)}100%{transform:translate(-40px,90px) scale(.9)}}
.hero .scales{animation:sway 9s ease-in-out infinite;transform-origin:50% 8%}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 24px -14px rgba(0,0,0,.6)}
.kpi:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 16px 30px -14px rgba(0,0,0,.7)}
.kpi .v{text-shadow:0 2px 12px rgba(0,0,0,.25)}
/* status / deadline motion */
.tmeta .m.late{animation:latePulse 2.4s ease-in-out infinite}
@keyframes latePulse{0%,100%{opacity:1}50%{opacity:.62}}
.tmeta .m.blocked{color:var(--fg-3);font-weight:600}
.pin-ico{color:var(--gold)}
.pill.dep{gap:4px;padding-right:4px}
.pill.dep.ok{color:var(--ok);background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.pbtn.pin.on{color:var(--gold);background:var(--gold-soft)}
.prog i{box-shadow:0 0 10px -2px var(--ok)}
.ring circle:nth-child(2){filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
/* detail & modals */
.detail{box-shadow:var(--e3),var(--hi-soft);background:var(--card-grad)}
.modal{box-shadow:var(--e3),var(--hi-soft);background:var(--card-grad)}
.pop{box-shadow:var(--e2),var(--hi-soft)}
.toast{box-shadow:var(--e3),inset 0 1px 0 rgba(255,255,255,.08)}
.trow.open{box-shadow:inset 3px 0 0 var(--accent),inset 0 0 0 1px var(--accent-line)}
/* calendar depth */
.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent-line),inset 0 0 24px -10px var(--accent)}
.cev{box-shadow:var(--e1)}
/* calendar scope bar (2.2) */
.cal-scope{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-m,10px);background:var(--surface-2);font-size:12.5px;color:var(--fg-2)}
.cal-scope>.svg{flex:none;color:var(--fg-3)}
.cal-scope b{color:var(--fg)}
.cal-scope-t{flex:1 1 260px;min-width:0}
.cal-scope-b{display:flex;gap:6px;flex-wrap:wrap}
.cal-scope.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.cal-scope.warn>.svg{color:var(--warn)}
/* week view */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.wday{background:var(--card-grad);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--e1),var(--hi-soft);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:220px;min-width:0;transition:background .15s,border-color .15s}
.wday.off{background:var(--surface-2)}
.wday.today{border-color:var(--accent);box-shadow:var(--ring),var(--e1)}
.wday.drop-hot{background:var(--accent-soft);border-color:var(--accent)}
.wday-h{display:flex;align-items:center;gap:6px;padding:2px 2px 6px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.wd-dow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--fg-3)}
.wday-h b{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1}
.wday.today .wday-h b{color:var(--accent)}
.wd-meta{font-size:10.5px;color:var(--fg-3)}
.wcard{position:relative;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:9px;padding:7px 8px;cursor:grab;touch-action:none;box-shadow:var(--e1);transition:transform .15s var(--ease),box-shadow .15s;min-width:0}
.wcard:hover{transform:translateY(-2px);box-shadow:var(--e2)}
.wcard.done{opacity:.55}.wcard.done .wc-t{text-decoration:line-through}
.wcard.late{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:color-mix(in srgb,var(--danger) 6%,var(--surface))}
.wc-top{display:flex;gap:5px;align-items:center;font-size:10.5px;color:var(--fg-3);min-height:12px}
.wc-top .mono{font-weight:600;color:var(--fg-2)}
.wc-t{font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.wc-m{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--fg-3);margin-top:4px;min-width:0}
.wempty{color:var(--fg-3);text-align:center;padding:12px;font-size:12px}
/* calculator */
.calc-out{margin-top:14px}
.calc-res{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:var(--r-l);background:var(--accent-soft);border:1px solid var(--accent-line);box-shadow:var(--hi-soft)}
.calc-res .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--fg-3)}
.calc-res b{font-family:var(--f-display);font-size:24px;font-weight:600;color:var(--accent)}
.calc-res .note{font-size:12.5px;display:flex;gap:6px;align-items:center;margin-top:4px}
/* book */
.modal-b.book{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;padding-top:8px}
.book-nav{position:sticky;top:0;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.book-nav a{padding:6px 10px;border-radius:8px;color:var(--fg-2);text-decoration:none;font-weight:600}
.book-nav a:hover{background:var(--hover);color:var(--fg)}
.book-body{max-width:72ch;font-size:14px;line-height:1.6}
.book-body h2{font-family:var(--f-display);font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
